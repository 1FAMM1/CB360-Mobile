<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CB360 Mobile">
  <meta name="theme-color" content="#c62828">
  <title>CB360 Mobile - Pedido de Férias</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
    VARIABLES (alinhadas com a página Escalas / Disponibilidades)
    ============================================================ */
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
           --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
           --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
           --header-h: 60px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --orange: #ef6c00; --green: #2e7d32;}
    /* ============================================================
    DARK MODE
    ============================================================ */
    .dark-mode {--bg: #141312; --surface: #1f1e1c; --surface-2: #2a2826; --border: rgba(255, 255, 255, 0.07); --txt-1: #f0ede8; --txt-2: #a09890; --txt-3: #5a5450;
                --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14);}
    /* ============================================================
    RESET & BASE
    ============================================================ */
    html {scrollbar-width: none; background: var(--red-dark);}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
          user-select: none; transition: background var(--ease), color var(--ease);}
    /* ============================================================
    HEADER
    ============================================================ */
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}
    .header-center {display: flex; flex-direction: column; align-items: center; gap: 1px;}
    .header-title {font-size: 19px; font-weight: 700; letter-spacing: 1.5px; color: #fff;}
    .header-sub {font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.75); text-transform: uppercase;}
    /* ============================================================
    MAIN CONTENT
    ============================================================ */
    .main-content {flex: 1; overflow-y: auto; overflow-x: hidden; padding-top: calc(var(--header-h) + 18px); padding-bottom: calc(var(--footer-h) + 18px); padding-left: 16px; padding-right: 16px;
                   display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px;
                   transition: padding-top 0.9s cubic-bezier(0.4, 0, 0.2, 1);}
    .main-content::-webkit-scrollbar {display: none;}
    body.mobile-month-active .main-content {padding-top: calc(var(--header-h) + 8px); justify-content: flex-start !important; align-items: stretch !important;}
    .main-content.content-blur {filter: blur(2px); pointer-events: none;}
    .vacations-req-header {flex-shrink: 0; text-align: center; width: 100%;}
    .vacations-req-subtitle {font-size: 1.1em; font-weight: 600; color: var(--txt-2); transition: color var(--ease);}
    /* ============================================================
    MONTH BUTTONS
    ============================================================ */
    .months-card {background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-md); overflow: hidden; width: 100%; margin-bottom: 4px; flex-shrink: 0;}
    .vacations-req-buttons {display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); width: 100%;}
    .vacations-req-btn {position: relative; background: var(--surface); border: none; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 14px 8px; min-height: 64px; 
                        font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--txt-2); cursor: pointer; text-align: center; display: flex; flex-direction: column; 
                        justify-content: center; align-items: center; gap: 6px; line-height: 1.2; transition: background var(--ease), color var(--ease);}
    .vacations-req-btn:nth-child(3n) {border-right: none;}
    .vacations-req-btn:nth-child(n+10) {border-bottom: none;}
    .vacations-req-btn:hover:not(.selected) {background: var(--surface-2); color: var(--txt-1);}
    .vacations-req-btn:active:not(.selected) {background: var(--surface-2);}
    .vacations-req-btn .material-icons {font-size: 22px; color: var(--red-icon); transition: color var(--ease), transform var(--ease);}
    .vacations-req-btn:hover .material-icons {transform: scale(1.08);}
    .vacations-req-btn.selected {background: var(--red-light); color: var(--red);}
    .vacations-req-btn.selected .material-icons {color: var(--red); transform: scale(1.1);}
    .vacations-req-btn div, .vacations-req-btn span {position: relative; z-index: 2; line-height: 1.2;}
    /* ============================================================
    CALENDAR CARD
    ============================================================ */
    .calendar-container {background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--red); border-right: 4px solid var(--red); border-radius: var(--r-md);
                         box-shadow: var(--sh-sm); padding: 14px; width: 100%; max-width: 100%; display: none;}
    .calendar-container.show {display: block; animation: slideDown 0.3s ease;}
    .calendar-header {text-align: center; font-size: 14px; font-weight: 700; color: var(--red); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px;
                      letter-spacing: 0.3px; transition: color var(--ease), border-color var(--ease);}
    .calendar-grid {display: grid; grid-template-columns: repeat(7, minmax(30px, 1fr)); gap: 5px;}
    .calendar-day-header {text-align: center; font-weight: 700; padding: 6px 0; font-size: 11px; color: var(--txt-3);}
    .calendar-day {text-align: center; padding: 9px 0; border-radius: var(--r-sm); background: var(--surface-2); font-size: 12.5px; color: var(--txt-1); cursor: pointer;
                   transition: background var(--ease), transform 0.15s ease, color var(--ease);}
    .calendar-day:hover {background: var(--red-light); color: var(--red); transform: scale(1.05);}
    .calendar-day.empty {background: transparent; cursor: default;}
    .calendar-day.empty:hover {transform: none; background: transparent;}
    .calendar-day.today {background: var(--red-dark); color: #fff; font-weight: 700; border: 2px solid #e67e22;}
    .calendar-day.state-pending {background: linear-gradient(135deg, #ffb74d, #ff9800, #ef6c00); color: #fff; font-weight: 700; border: 2px solid rgba(255,255,255,0.2);}
    .calendar-day.state-pending:hover {background: linear-gradient(135deg, #ff9800, #f57c00, #e65100); box-shadow: 0 4px 12px rgba(239, 108, 0, 0.5); transform: scale(1.05);}
    .calendar-day.state-approved {background: linear-gradient(135deg, #66bb6a, #43a047, #2e7d32); color: #fff; font-weight: 700; border: 2px solid rgba(255,255,255,0.2);}
    .calendar-day.state-approved:hover {background: linear-gradient(135deg, #4caf50, #388e3c, #1b5e20); box-shadow: 0 4px 12px rgba(46, 125, 50, 0.5); transform: scale(1.05);}
    .calendar-day.state-rejected {background: linear-gradient(135deg, #ef5350, #e53935, #b71c1c); color: #fff; font-weight: 700; border: 2px solid rgba(255,255,255,0.2);}
    .calendar-day.state-rejected:hover {background: linear-gradient(135deg, #e53935, #c62828, #8e0000); box-shadow: 0 4px 12px rgba(183, 28, 28, 0.5); transform: scale(1.05);}
    /* ============================================================
    SAVE BUTTON
    ============================================================ */
    .save-vacation-btn {display: none; width: 100%; padding: 12px; background: linear-gradient(135deg, #27ae60, #229954); color: white; border: none; border-radius: var(--r-md); font-size: 13.5px; font-weight: 600;
                        cursor: pointer; box-shadow: var(--sh-sm); transition: background var(--ease), transform var(--ease); text-align: center;}
    .save-vacation-btn:hover {background: linear-gradient(135deg, #229954, #1e8449); transform: translateY(-1px);}
    .save-vacation-btn.show {display: block; animation: slideDown 0.3s ease;}

    /* ============================================================
    VACATION CARDS CONTAINER & CARDS
    ============================================================ */
    #vacationCardsContainer {width: 100%; display: flex; flex-direction: column; gap: 8px;}
    .vacation-card {background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--orange); border-radius: var(--r-sm); padding: 12px 14px;
                    box-shadow: var(--sh-sm); font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; color: var(--txt-1); transition: transform var(--ease);}
    .vacation-card.pending {border-left-color: #ef6c00;}
    .vacation-card.approved {border-left-color: #2e7d32;}
    .vacation-card.rejected {border-left-color: #b71c1c;}
    .vacation-state {font-weight: 700;}
    .vacation-card.pending .vacation-state {color: #ef6c00;}
    .vacation-card.approved .vacation-state {color: #2e7d32;}
    .vacation-card.rejected .vacation-state {color: #b71c1c;}
    /* ============================================================
    TOAST
    ============================================================ */
    .toast {position: fixed; bottom: calc(var(--footer-h) + 30px); left: 50%; transform: translateX(-50%) translateY(10px); background: linear-gradient(to right, var(--red-dark), var(--red));
            color: #fff; padding: 14px 22px; border-radius: var(--r-md); box-shadow: var(--sh-lg); font-size: 13.5px; font-weight: 600; width: 90%; max-width: 380px; text-align: center;
            z-index: 9999; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease;}
    .toast.show {opacity: 1; transform: translateX(-50%) translateY(0);}
    /* ============================================================
    FOOTER
    ============================================================ */
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 100;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    @keyframes slideDown {from {opacity: 0; transform: translateY(-10px);} to {opacity: 1; transform: translateY(0);}}
    /* ============================================================
    RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .header-title {font-size: 16px;}
      .vacations-req-subtitle {font-size: 0.95em;}
      .vacations-req-btn {min-height: 56px; font-size: 10.5px; padding: 10px 10px;}
      .vacations-req-btn .material-icons {font-size: 19px;}
      .main-content {padding-left: 14px; padding-right: 14px; justify-content: center; align-items: center;}
    }
    @media (min-width: 769px) {
      .main-content {max-width: 700px; margin: 0 auto; width: 100%;}
    }
  </style>
</head>
<body>
  <header class="header">
    <img id="corpLogo" class="header-logo" alt="" style="display:none;"
         onerror="console.error('❌ Logo: falha ao carregar imagem, URL:', this.src); this.style.display='none';"
         onload="this.style.display='block';">
    <div class="header-center">
      <span class="header-title">PEDIDO FÉRIAS</span>
      <span class="header-sub">Voluntariado</span>
    </div>
    <h2 id="corpInfo" style="display: none;"></h2>
  </header>  
  <div class="main-content">
    <div class="vacations-req-header">
      <p class="vacations-req-subtitle">Selecione o mês:</p>
    </div>    
    <div class="months-card">
      <div class="vacations-req-buttons">
        <button class="vacations-req-btn" data-month="0" onclick="showCalendar(0, this)"><span class="material-icons">ac_unit</span><div>Janeiro</div></button>
        <button class="vacations-req-btn" data-month="1" onclick="showCalendar(1, this)"><span class="material-icons">favorite</span><div>Fevereiro</div></button>
        <button class="vacations-req-btn" data-month="2" onclick="showCalendar(2, this)"><span class="material-icons">eco</span><div>Março</div></button>
        <button class="vacations-req-btn" data-month="3" onclick="showCalendar(3, this)"><span class="material-icons">local_florist</span><div>Abril</div></button>
        <button class="vacations-req-btn" data-month="4" onclick="showCalendar(4, this)"><span class="material-icons">wb_sunny</span><div>Maio</div></button>
        <button class="vacations-req-btn" data-month="5" onclick="showCalendar(5, this)"><span class="material-icons">beach_access</span><div>Junho</div></button>
        <button class="vacations-req-btn" data-month="6" onclick="showCalendar(6, this)"><span class="material-icons">local_fire_department</span><div>Julho</div></button>
        <button class="vacations-req-btn" data-month="7" onclick="showCalendar(7, this)"><span class="material-icons">whatshot</span><div>Agosto</div></button>
        <button class="vacations-req-btn" data-month="8" onclick="showCalendar(8, this)"><span class="material-icons">park</span><div>Setembro</div></button>
        <button class="vacations-req-btn" data-month="9" onclick="showCalendar(9, this)"><span class="material-icons">cloud</span><div>Outubro</div></button>
        <button class="vacations-req-btn" data-month="10" onclick="showCalendar(10, this)"><span class="material-icons">grain</span><div>Novembro</div></button>
        <button class="vacations-req-btn" data-month="11" onclick="showCalendar(11, this)"><span class="material-icons">celebration</span><div>Dezembro</div></button>
      </div>
    </div>    
    <div id="calendarContainer" class="calendar-container">
      <div class="calendar-header" id="calendarHeader"></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>    
    <button id="saveVacationBtn" class="save-vacation-btn" onclick="saveVacation()">Efetuar Pedido</button>
    <div id="vacationCardsContainer"></div>
  </div>
  <footer class="footer">
    <div class="footer-content">
      <div class="powered-by">
        Powered by Fábio Martins · Sistemas de Informação · Grupo CB360
      </div>
      <div class="footer-year">
        © 2023–2025 · Sistema CB360 Mobile
      </div>
    </div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('App pronta: ', reg.scope))
          .catch(err => console.log('Erro no motor da App: ', err));
      });
    }
  </script>
  <script>
    let currentMonthIndex = null;
    let selectedDays = [];
    let vacationsData = [];
    /* ===================== SUPABASE CONFIGURATION ====================== */
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';
    /* --- chave única e consistente em TODO o ficheiro para corp/nint --- */
    function getCorp() {return localStorage.getItem("currentCorpOperNr")}
    function getNInt() {return localStorage.getItem("currentCorpNint")}
    function getSupabaseHeaders(options = {}) {
      const corp  = getCorp();
      const nint  = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    /* ======================= CORPORATION LOADING ======================= */
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }
    /* ========================== THEME LOADING ========================== */
    function loadTheme() {
      const savedTheme = localStorage.getItem('sgo-theme');
      if (savedTheme === 'dark') document.body.classList.add('dark-mode');
    }
    /* ======================== VACATIONS LOADING ======================== */
    async function loadVacations() {
      const n_int = localStorage.getItem("currentCorpNint");
      const corp_oper_nr = localStorage.getItem("currentCorpOperNr");
      const currentYear = new Date().getFullYear();
      if (!n_int || !corp_oper_nr) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/ped_vacat?n_int=eq.${n_int}&corp_oper_nr=eq.${corp_oper_nr.padStart(4, "0")}&order=year,month`, {
          headers: getSupabaseHeaders()
        });
        const data = await res.json();
        vacationsData = data || [];
        const container = document.getElementById('vacationCardsContainer');
        container.innerHTML = '';
        if (vacationsData.length === 0) {
          const emptyMsg = document.createElement('div');
          emptyMsg.className = 'vacation-card';
          emptyMsg.style.justifyContent = 'center';
          emptyMsg.style.textAlign = 'center';
          emptyMsg.innerHTML = `<strong>Ainda não marcou Férias de Voluntário para o ano ${currentYear}.</strong>`;
          container.appendChild(emptyMsg);
          return;
        }
        vacationsData.forEach(v => {
          if (v.day) {
            const daysArray = v.day.split(',').map(Number);
            showVacationCard(daysArray, v.month, v.year, v.state);
          }
        });
      } catch (err) {
        console.error("Erro Load:", err);
      }
    }
    /* ======================== CALENDAR DISPLAY ========================= */
    async function showCalendar(monthIndex, button = null) {
      const calendarContainer = document.getElementById('calendarContainer');
      const saveBtn = document.getElementById('saveVacationBtn');
      const cardsContainer = document.getElementById('vacationCardsContainer');
      if (currentMonthIndex === monthIndex && button && button.classList.contains('selected')) {
        calendarContainer.classList.remove('show');
        document.body.classList.remove('mobile-month-active');
        if (saveBtn) saveBtn.classList.remove('show');
        cardsContainer.style.display = 'flex';
        currentMonthIndex = null;
        document.querySelectorAll('.vacations-req-btn').forEach(btn => btn.classList.remove('selected'));
        return;
      }
      currentMonthIndex = monthIndex;
      cardsContainer.style.display = 'none';
      calendarContainer.classList.add('show');
      document.body.classList.add('mobile-month-active');
      if (saveBtn) saveBtn.classList.add('show');      
      document.querySelectorAll('.vacations-req-btn').forEach(btn => btn.classList.remove('selected'));
      if (button) button.classList.add('selected');
      selectedDays = [];
      renderCalendarGrid(monthIndex);
    }
    function renderCalendarGrid(monthIndex) {
      const grid = document.getElementById('calendarGrid');
      const header = document.getElementById('calendarHeader');
      grid.innerHTML = '';
      selectedDays = [];
      const names = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
      const daysWeek = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];    
      const now = new Date();
      const year = now.getFullYear();
      const month = monthIndex + 1;
      const todayRef = new Date();
      todayRef.setHours(0, 0, 0, 0);      
      daysWeek.forEach(d => {
        const div = document.createElement('div');
        div.className = 'calendar-day-header';
        div.textContent = d;
        grid.appendChild(div);
      });      
      const firstDay = new Date(year, monthIndex, 1).getDay();
      const lastDay = new Date(year, monthIndex + 1, 0).getDate();      
      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(Object.assign(document.createElement('div'), { className: 'calendar-day empty' }));
      }      
      const stateClass = {'Em Aprovação': 'state-pending', 'Aprovadas': 'state-approved', 'Recusadas': 'state-rejected'};
      const monthRecords = vacationsData.filter(v => parseInt(v.month) === month);      
      for (let day = 1; day <= lastDay; day++) {
        const dayEl = document.createElement('div');
        dayEl.className = 'calendar-day';
        dayEl.textContent = day;    
        const dateObj = new Date(year, monthIndex, day);
        if (dateObj.getTime() === todayRef.getTime()) {
          dayEl.classList.add('today');
        }
        if (dateObj < todayRef) {
          dayEl.classList.add('disabled');
        }        
        const isDayDecir = (month === 5 && day >= 15) || (month > 5 && month < 10) || (month === 10 && day <= 15);
        if (isDayDecir) dayEl.classList.add('decir-period');        
        monthRecords.forEach(r => {
          const days = r.day.split(',').map(d => parseInt(d.trim()));
          if (days.includes(day)) {
            dayEl.classList.add(stateClass[r.state] || 'state-pending');
            selectedDays.push(day);
          }
        });        
        dayEl.onclick = () => {
          if (isDayDecir) {
            showToast("Não é possível marcar Férias de Voluntariado em período DECIR.");
            return;
          }
          if (dateObj < todayRef) {
            showToast("Não pode marcar ou alterar férias em datas passadas.");
            return;
          }    
          if (dayEl.classList.contains('state-approved')) {
            showToast("Este dia já foi aprovado e não pode ser alterado.");
            return;
          }    
          if (selectedDays.includes(day)) {
            selectedDays = selectedDays.filter(d => d !== day);
            dayEl.classList.remove('state-pending','state-approved','state-rejected');
          } else {
            selectedDays.push(day);
            dayEl.classList.add('state-pending');
          }
        };
        grid.appendChild(dayEl);
      }
      header.textContent = `${names[monthIndex]} ${year}`;
    }
    /* ======================== SAVING VACATIONS ========================= */
    async function saveVacation() {
      if (currentMonthIndex === null) return showToast("Selecione um mês.");
      if (selectedDays.length === 0) return showToast("Selecione pelo menos um dia.");
      const n_int = parseInt(localStorage.getItem("currentCorpNint"));
      const corp_oper_nr = (localStorage.getItem("currentCorpOperNr")).padStart(4, "0");
      const year = new Date().getFullYear();
      const month = currentMonthIndex + 1;
      const daysStr = selectedDays.sort((a, b) => a - b).join(',');
      try {
        const check = await fetch(`${SUPABASE_URL}/rest/v1/ped_vacat?n_int=eq.${n_int}&corp_oper_nr=eq.${corp_oper_nr}&year=eq.${year}&month=eq.${month}`, {
          headers: getSupabaseHeaders()
        });
        const existing = await check.json();
        let res;
        if (existing.length > 0) {
          res = await fetch(`${SUPABASE_URL}/rest/v1/ped_vacat?id=eq.${existing[0].id}`, {
            method: 'PATCH',
            headers: getSupabaseHeaders(),
            body: JSON.stringify({
              day: daysStr,
              state: "Em Aprovação"
            })
          });
        } else {
          res = await fetch(`${SUPABASE_URL}/rest/v1/ped_vacat`, {
            method: 'POST',
            headers: getSupabaseHeaders(),
            body: JSON.stringify({n_int, corp_oper_nr, year, month, day: daysStr, state: "Em Aprovação"})
          });
        }
        if (res.ok) {
          showToast("Pedido de Férias Enviado!");
          await loadVacations();
        }
      } catch (err) {
        showToast("Erro de ligação.");
      }
    }
    function showVacationCard(days, month, year, state) {
      const names = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      const stateClasses = {'Em Aprovação': 'pending', 'Aprovadas': 'approved', 'Recusadas': 'rejected'};
      const card = document.createElement('div');
      card.className = `vacation-card ${stateClasses[state] || ''}`;
      const sortedDays = days.sort((a, b) => a - b);
      let groups = [];
      if (sortedDays.length > 0) {
        let start = sortedDays[0];
        let end = start;
        for (let i = 1; i < sortedDays.length; i++) {
          if (sortedDays[i] === end + 1) {
            end = sortedDays[i];
          } else {
            groups.push(start === end ? String(start).padStart(2, '0') : `${String(start).padStart(2, '0')} a ${String(end).padStart(2, '0')}`);
            start = sortedDays[i];
            end = start;
          }
        }
        groups.push(start === end ? String(start).padStart(2, '0') : `${String(start).padStart(2, '0')} a ${String(end).padStart(2, '0')}`);
      }
      const rangeStr = groups.join(', ');
      card.innerHTML = `
        <div style="display:flex; justify-content: space-between; align-items: center; width: 100%;">
          <div style="flex: 1; text-align: left;"><strong>Férias Solicitadas:</strong></div>
          <div style="flex: 2; text-align: center;">${rangeStr} de ${names[month-1]}</div>
          <div style="flex: 1; text-align: right;" class="vacation-state">${state}</div>
        </div>
      `;
      document.getElementById('vacationCardsContainer').appendChild(card);
    }
    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      const content = document.querySelector(".main-content");
      document.body.appendChild(toast);
      if (content) content.classList.add("content-blur");
      setTimeout(() => toast.classList.add("show"), 50);
      setTimeout(() => {
        toast.classList.remove("show");
        if (content) content.classList.remove("content-blur");
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
    /* ============================== INIT =============================== */
    document.addEventListener('DOMContentLoaded', () => {
      loadCorpInfo();
      loadTheme();
      loadVacations();
    });
  </script>
</body>
