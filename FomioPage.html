<!DOCTYPE html>
<html lang="pt-PT" style="background-color: #8b0000;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CB360 Mobile">
  <meta name="theme-color" content="#c62828">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>CB360 Mobile - Equipa de Serviço</title>
  <style>
    /* ============================================================
    VARIABLES
    ============================================================ */
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
            --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
            --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
            --header-h: 60px; --planning-h: 64px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --blue: #0282fa;
            --gold: #b8860b;}
    /* ============================================================
    DARK MODE
    ============================================================ */
    .dark-mode {--bg: #141312; --surface: #1f1e1c; --surface-2: #2a2826; --border: rgba(255, 255, 255, 0.07); --txt-1: #f0ede8; --txt-2: #a09890; --txt-3: #5a5450;
                --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14); --blue: #6cb8ff;}
    /* ============================================================
    RESET & BASE
    ============================================================ */
    html {scrollbar-width: none; background: var(--red-dark);}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--txt-1); height: 100vh; overflow: hidden; display: flex;
          flex-direction: column; user-select: none; transition: background var(--ease), color var(--ease);}
    /* ============================================================
    HEADER
    ============================================================ */
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}
    .header-center {display: flex; flex-direction: column; align-items: center; gap: 1px;}
    .header-title {display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; letter-spacing: 1.5px; color: #fff;}
    .header-title .material-icons {font-size: 1.1em;}
    .header-sub {font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.75); text-transform: uppercase;}
    /* ============================================================
    PLANNING HEADER
    ============================================================ */
    .planning-header {position: fixed; top: var(--header-h); left: 0; right: 0; min-height: var(--planning-h); background: var(--surface-2); border-bottom: 1px solid var(--border);
                      box-shadow: var(--sh-sm); padding: 10px 20px; text-align: center; z-index: 999; transition: background var(--ease), border-color var(--ease);}
    .planning-header h2 {display: flex; align-items: center; justify-content: center; gap: 5px; margin: 0 0 10px; font-size: 0.95em; font-weight: 700; letter-spacing: 1px; color: var(--txt-1);
                         text-transform: uppercase;}
    .planning-header h2 .material-icons {font-size: 1.05em; color: var(--red-icon);}
    .planning-info {font-size: 13px; font-weight: 600; color: var(--txt-2);}
    /* ============================================================
    MAIN CONTENT
    ============================================================ */
    .main-content {flex: 1; background: var(--bg); padding: calc(var(--header-h) + var(--planning-h) + 15px) 16px calc(var(--footer-h) + 25px); display: flex; flex-direction: column;
                   height: 100vh; overflow: hidden; transition: background var(--ease);}
    .tables-scroll-area {flex: 1; overflow-y: scroll; overflow-x: hidden; padding-bottom: 20px; scrollbar-width: none; -ms-overflow-style: none; min-height: 0;}
    .tables-scroll-area::-webkit-scrollbar {display: none; width: 0; height: 0;}
    .tables-container {display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; width: 100%; padding-bottom: 40px;}
    /* ============================================================
    TABLE CARDS
    ============================================================ */
    .table-wrapper {background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--sh-sm); overflow: hidden; margin-bottom: -10px;
                    transition: transform var(--ease), box-shadow var(--ease), background var(--ease), border-color var(--ease);}
    .table-wrapper[data-team="inem"] .table-header {background: linear-gradient(to right, #b8860b, #f0c000, #ffdf00); color: #333;}
    .table-wrapper:hover {transform: translateY(-1px); box-shadow: var(--sh-md);}
    .table-header {display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(to right, var(--red-dark), var(--red)); color: #fff; padding: 12px 15px;
                   text-align: center; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; text-transform: uppercase;}
    .table-header .material-icons {font-size: 17px;}
    .table {width: 100%; border-collapse: collapse;}
    .table th, .table td {padding: 10px 14px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); font-size: 13px; color: var(--txt-1);
                          transition: border-color var(--ease), color var(--ease);}
    .table th:first-child, .table td:first-child {text-align: center;}
    .table th:last-child, .table td:last-child {text-align: left; border-right: none;}
    .table tbody tr:last-child td {border-bottom: none;}
    .table th {background: var(--surface-2); font-weight: 700; color: var(--txt-2); text-transform: uppercase; font-size: 11px; letter-spacing: 0.4px;}
    .table tbody tr {transition: background var(--ease);}
    .table tbody tr:hover {background: var(--red-light);}
    .table th:first-child, .table td:first-child {width: 150px; min-width: 100px; max-width: 190px;}
    .table th:last-child, .table td:last-child {width: auto;}
    /* ============================================================
    FOOTER
    ============================================================ */
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 1000;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    .footer strong {color: inherit;}
    /* ============================================================
    RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .header-title {font-size: 16px;}
      .planning-header {padding: 8px 15px;}
      .planning-header h2 {font-size: 0.85em;}
      .planning-info {font-size: 11.5px;}
      .main-content {padding-left: 10px; padding-right: 10px;}
      .table th, .table td {padding: 8px 10px; font-size: 12px;}
    }
    @media (min-width: 769px) {
      .tables-container {max-width: 1200px;}
    }
  </style>
</head>
<body>
  <header class="header">
    <img id="corpLogo" class="header-logo" alt="" src="">
    <div class="header-center">
      <span class="header-title">EQUIPA DE SERVIÇO</span>
      <span class="header-sub">Força Mínima de Intervenção</span>
    </div>
    <h2 id="corpInfo" style="display: none;"></h2>
  </header>
  <section class="planning-header">
    <h2><span class="material-icons">schedule</span>TURNO</h2>
    <div class="planning-info" id="planning-info">
      A carregar informações...
    </div>
  </section>
  <main class="main-content">
    <section class="tables-scroll-area">
      <div class="tables-container" id="tables-container">
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="footer-content">
      <div class="powered-by">
        Powered by Fábio Martins · Sistemas de Informação · Grupo CB360
      </div>
      <div class="footer-year">
        © 2023–2025 · Sistema CB360 Mobile
      </div>
    </div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('App pronta: ', reg.scope))
          .catch(err => console.log('Erro no motor da App: ', err));
      });
    }
  </script>
  <script>
    /* ===================== SUPABASE CONFIGURATION ====================== */
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';
    function getCorp() {return localStorage.getItem("currentCorpOperNr");}
    function getNInt() {return localStorage.getItem("currentCorpNint");}
    function getSupabaseHeaders(options = {}) {
      const corp  = getCorp();
      const nint  = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    /* ======================= CORPORATION LOADING ======================= */
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }
    /* ======================= LEITURA DIRETA (SUBSTITUI API) ======================= */
    async function loadPlanningHeader() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/fomio_date?select=header_text&limit=1`, {
          method: 'GET',
          headers: getSupabaseHeaders()
        });
        const data = await response.json();
        if (data && data.length > 0) {
          const headerText = data[0].header_text.replace(/^Dia:\s*/i, '');
          document.getElementById('planning-info').textContent = headerText;
        } else {
          document.getElementById('planning-info').textContent = 'Informações não disponíveis';
        }
      } catch (error) {
        console.error('Erro ao carregar header:', error);
        document.getElementById('planning-info').textContent = 'Erro ao carregar informações';
      }
    }
    async function loadAllTeams() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/fomio_teams?select=*`, {
          method: 'GET',
          headers: getSupabaseHeaders()
        });
        const allMembers = await response.json();
        if (allMembers && Array.isArray(allMembers)) {
          const grouped = allMembers.reduce((acc, m) => {
            if (!acc[m.team_name]) acc[m.team_name] = [];
            acc[m.team_name].push(m);
            return acc;
          }, {});
          teamsMap.forEach(team => {
            populateTable(team.id, grouped[team.id] || []);
          });
        }
      } catch (error) {
        console.error('Erro ao carregar equipas:', error);
      }
    }
    /* ======================= UTILS & RENDER ======================= */
    const teamsMap = [
      {label: 'OFOPE', id: 'ofope', icon: 'military_tech'},
      {label: 'Chefe de Serviço', id: 'chefe_servico', icon: 'star'},
      {label: 'OPTEL', id: 'optel', icon: 'headset_mic'},
      {label: 'Equipa 01', id: 'equipa_01', icon: 'groups'},
      {label: 'Equipa 02', id: 'equipa_02', icon: 'groups'},
      {label: 'Logística', id: 'logistica', icon: 'inventory_2'},
      {label: 'INEM', id: 'inem', icon: 'medical_services'},
      {label: 'INEM Reserva', id: 'inem_reserva', icon: 'medical_services'},
      {label: 'Serviço Geral', id: 'servico_geral', icon: 'engineering'}
    ];
    function createTables() {
      const container = document.getElementById('tables-container');
      if (!container) return;
      container.innerHTML = '';
      teamsMap.forEach(team => {
        const tableHTML = `
        <div class="table-wrapper" data-team="${team.id}" style="display: none;">
          <div class="table-header"><span class="material-icons">${team.icon}</span>${team.label}</div>
          <table class="table">
            <thead>
              <tr><th>Patente</th><th>Nome</th></tr>
            </thead>
            <tbody id="${team.id}-tbody"></tbody>
          </table>
        </div>`;
        container.insertAdjacentHTML('beforeend', tableHTML);
      });
    }
    function populateTable(teamName, data) {
      const tbody = document.getElementById(`${teamName}-tbody`);
      const tableWrapper = tbody?.closest('.table-wrapper');
      if (!tbody || !tableWrapper) return;
      tbody.innerHTML = '';
      if (data.length === 0) {
        tableWrapper.style.display = 'none';
        return;
      }
      const sortedData = sortByPatente(data);
      const blockedWords = ['falta', 'baixa', 'dispensa', 'licença'];
      sortedData.forEach(member => {
        const obs = (member.observ || '').toLowerCase();
        if (blockedWords.some(word => obs.includes(word))) return;
        const row = document.createElement('tr');
        row.innerHTML = `<td>${member.patente || ''}</td><td>${member.nome || ''}</td>`;
        tbody.appendChild(row);
      });
      tableWrapper.style.display = tbody.children.length > 0 ? 'block' : 'none';
    }
    function sortByPatente(data) {
      const patenteOrder = ['Comandante', '2º Comandante', 'Adj. de Comando', 'Oficial Bº Superior', 'Oficial Bº Principal', 'Oficial Bº 1ª', 'Oficial Bº 2ª', 
                          'Oficial Bº Estagiário', 'Chefe', 'Subchefe', 'Bombeiro(a) 1ª', 'Bombeiro(a) 2ª', 'Bombeiro(a) 3ª', 'Estagiário(a)', 'Bº Especialista', 'Cadete'];
      return data.sort((a, b) => {
        const indexA = patenteOrder.indexOf(a.patente);
        const indexB = patenteOrder.indexOf(b.patente);
        const orderA = indexA === -1 ? 999 : indexA;
        const orderB = indexB === -1 ? 999 : indexB;
        if (orderA === orderB) return (Number(a.n_int) || 0) - (Number(b.n_int) || 0);
        return orderA - orderB;
      });
    }
    window.addEventListener('load', async () => {
      if (localStorage.getItem('sgo-theme') === 'dark') document.body.classList.add('dark-mode');
      await loadCorpInfo();
      createTables();
      loadPlanningHeader();
      loadAllTeams();
    });
    setInterval(() => {
      loadAllTeams();
      loadPlanningHeader();
    }, 10 * 60 * 1000);
  </script>
</body>
</html>
