<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CB360 Mobile">
  <meta name="theme-color" content="#c62828">
  <title>CB360 Mobile - Disponibilidades DECIR</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
    VARIABLES (alinhadas com a página Escalas / Disponibilidades Piquetes)
    ============================================================ */
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
           --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
           --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
           --header-h: 60px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --blue: #0282fa;}
    /* ============================================================
    DARK MODE
    ============================================================ */
    .dark-mode {--bg: #141312; --surface: #1f1e1c; --surface-2: #2a2826; --border: rgba(255, 255, 255, 0.07); --txt-1: #f0ede8; --txt-2: #a09890; --txt-3: #5a5450; --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14); --blue: #6cb8ff;}
    /* ============================================================
    RESET & BASE
    ============================================================ */
    html {scrollbar-width: none; background: var(--red-dark);}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; user-select: none; transition: background var(--ease), color var(--ease);}
    /* ============================================================
    HEADER
    ============================================================ */
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center; justify-content: center; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}
    .header-center {display: flex; flex-direction: column; align-items: center; gap: 1px;}
    .header-title {font-size: 19px; font-weight: 700; letter-spacing: 1.5px; color: #fff;}
    .header-sub {font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.75); text-transform: uppercase;}
    /* ============================================================
    MAIN CONTENT
    ============================================================ */
    .main-content {flex: 1; overflow-y: auto; overflow-x: hidden; padding-top: calc(var(--header-h) + 18px); padding-bottom: calc(var(--footer-h) + 18px); padding-left: 16px; padding-right: 16px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; transition: padding-top 0.9s cubic-bezier(0.4, 0, 0.2, 1);}
    .main-content::-webkit-scrollbar {display: none;}
    body.mobile-month-active .main-content {padding-top: calc(var(--header-h) + 8px); justify-content: flex-start !important; align-items: stretch !important;}
    .main-content.slide-out, .main-content.slide-in {transform: none;}
    .main-content.content-blur {filter: blur(2px); pointer-events: none;}
    .availability-dec-header {flex-shrink: 0; text-align: center; width: 100%;}
    .availability-dec-subtitle {font-size: 1.1em; font-weight: 600; color: var(--txt-2); transition: color var(--ease);}
    /* ============================================================
    MONTH BUTTONS
    ============================================================ */
    .months-card {background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-md); overflow: hidden; width: 100%; margin-bottom: 0px; flex-shrink: 0;}
    .availability-dec-buttons {display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); width: 100%;}
    .availability-dec-btn {position: relative; background: var(--surface); border: none; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 14px 8px; min-height: 64px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--txt-2); cursor: pointer; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; line-height: 1.2; transition: background var(--ease), color var(--ease);}
    .availability-dec-btn:nth-child(3n) {border-right: none;}
    .availability-dec-btn:nth-child(n+10) {border-bottom: none;}
    .availability-dec-btn:hover:not(.selected) {background: var(--surface-2); color: var(--txt-1);}
    .availability-dec-btn:active:not(.selected) {background: var(--surface-2);}
    .availability-dec-btn .material-icons {font-size: 22px; color: var(--red-icon); transition: color var(--ease), transform var(--ease);}
    .availability-dec-btn:hover .material-icons {transform: scale(1.08);}
    .availability-dec-btn.selected {background: var(--red-light); color: var(--red);}
    .availability-dec-btn.selected .material-icons {color: var(--red); transform: scale(1.1);}
    .availability-dec-btn div, .availability-dec-btn span {position: relative; z-index: 2; line-height: 1.2;}
    .availability-dec-btn.month-blocked {opacity: 0.35; pointer-events: none; cursor: not-allowed;}
    /* ============================================================
    CALENDAR CARD
    ============================================================ */
    .calendar-container {background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--red); border-right: 4px solid var(--red); border-radius: var(--r-md); box-shadow: var(--sh-sm); padding: 14px; width: 100%; max-width: 100%; display: none;}
    .calendar-container.show {display: block; animation: slideDown 0.3s ease;}
    .calendar-header {text-align: center; font-size: 14px; font-weight: 700; color: var(--red); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; letter-spacing: 0.3px; transition: color var(--ease), border-color var(--ease);}
    .calendar-grid {display: grid; grid-template-columns: repeat(7, minmax(30px, 1fr)); gap: 5px;}
    .calendar-day-header {text-align: center; font-weight: 700; padding: 6px 0; font-size: 11px; color: var(--txt-3);}
    .calendar-day {text-align: center; padding: 9px 0; border-radius: var(--r-sm); background: var(--surface-2); font-size: 12.5px; color: var(--txt-1); cursor: pointer; transition: background var(--ease), transform 0.15s ease, color var(--ease);}
    .calendar-day:hover {background: var(--red-light); color: var(--red); transform: scale(1.05);}
    .calendar-day.empty {background: transparent; cursor: default;}
    .calendar-day.empty:hover {transform: none; background: transparent; color: inherit;}
    .calendar-day.today {background: var(--red-dark); color: #fff; font-weight: 700; border: 2px solid #e67e22;}
    .calendar-day.disp-D {background: linear-gradient(135deg, #ffd54f, #ffca28, #ffa726); color: #4e342e; font-weight: 700; border: 2px solid rgba(255,255,255,0.2);}
    .calendar-day.disp-D:hover {background: linear-gradient(135deg, #ffe082, #ffd54f, #ffb300); box-shadow: 0 4px 12px rgba(255, 193, 7, 0.55); transform: scale(1.05); color: #4e342e;}
    .calendar-day.disp-N {background: linear-gradient(135deg, #3949ab, #2c387e, #1a237e); color: #fff; font-weight: 700; border: 2px solid rgba(255,255,255,0.2);}
    .calendar-day.disp-N:hover {background: linear-gradient(135deg, #5c6bc0, #303f9f, #1a237e); box-shadow: 0 4px 14px rgba(26, 35, 126, 0.6); transform: scale(1.05); color: #fff;}
    .calendar-day.disp-DN {background: linear-gradient(135deg, #ab47bc, #9c27b0, #8e24aa); color: #fff; font-weight: 700; border: 2px solid rgba(255,255,255,0.2);}
    .calendar-day.disp-DN:hover {background: linear-gradient(135deg, #9c27b0, #7b1fa2); box-shadow: 0 4px 12px rgba(156, 39, 176, 0.5); transform: scale(1.05); color: #fff;}
    .calendar-day.disp-D.today, .calendar-day.disp-N.today, .calendar-day.disp-DN.today {border: 2px solid #f39c12;}
    /* ============================================================
    LEGEND
    ============================================================ */
    .calendar-legend {display: none; width: 100%; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--sh-sm); justify-content: center; align-items: center; padding: 10px 14px; gap: 20px; font-size: 12px; flex-wrap: wrap;}
    .calendar-legend.show {display: flex;}
    .legend-item {display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: var(--txt-2); font-weight: 600;}
    .legend-color {width: 17px; height: 17px; border-radius: 5px; flex-shrink: 0; border: 1px solid var(--border);}
    .legend-color.day {background: linear-gradient(135deg, #ffd54f, #ffca28, #ffa726);}
    .legend-color.night {background: linear-gradient(135deg, #3949ab, #2c387e, #1a237e);}
    .legend-color.daynight {background: linear-gradient(135deg, #ab47bc, #9c27b0, #8e24aa);}
    /* ============================================================
    SHIFT SELECTION MODAL
    ============================================================ */
    .disp-modal {position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;}
    .disp-modal.show {display: flex;}
    .disp-modal-content {background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 340px; box-shadow: var(--sh-lg); border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; animation: mIn 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);}
    @keyframes mIn {from {opacity: 0; transform: scale(0.95) translateY(10px);} to {opacity: 1; transform: scale(1) translateY(0);}}
    .disp-modal-header {background: linear-gradient(to right, var(--red-dark), var(--red)); color: #fff; padding: 15px 18px; font-size: 15px; font-weight: 600; text-align: center; flex-shrink: 0;}
    .disp-modal-body {padding: 20px 18px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;}
    .disp-btn {flex: 1 1 45%; padding: 14px 0; font-size: 12.5px; font-weight: 700; border-radius: var(--r-sm); border: 2px solid transparent; cursor: pointer; transition: transform var(--ease), box-shadow var(--ease); text-transform: uppercase;}
    .disp-btn:hover {transform: scale(1.05); box-shadow: var(--sh-md);}
    .disp-btn.d {background: linear-gradient(135deg, #ffd54f, #ffa726); color: #4e342e;}
    .disp-btn.n {background: linear-gradient(135deg, #3949ab, #1a237e); color: #fff;}
    .disp-btn.dn {background: linear-gradient(135deg, #ab47bc, #8e24aa); color: #fff;}
    .disp-btn.nd {background: var(--surface-2); color: var(--red); border-color: var(--red);}
    .disp-btn.active {border-color: var(--txt-1);}
    .disp-modal-footer {background: var(--surface-2); padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: center; flex-shrink: 0;}
    .disp-cancel {background: transparent; border: 1px solid var(--border); color: var(--txt-2); cursor: pointer; font-size: 13px; font-weight: 600; padding: 8px 22px; border-radius: 50px; transition: background var(--ease), color var(--ease);}
    .disp-cancel:hover {background: var(--red-light); color: var(--red); border-color: transparent;}
    /* ============================================================
    TOAST
    ============================================================ */
    .toast {position: fixed; bottom: calc(var(--footer-h) + 30px); left: 50%; transform: translateX(-50%) translateY(10px); background: linear-gradient(to right, var(--red-dark), var(--red)); color: #fff; padding: 14px 22px; border-radius: var(--r-md); box-shadow: var(--sh-lg); font-size: 13.5px; font-weight: 600; width: 90%; max-width: 380px; text-align: center; z-index: 9999; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease;}
    .toast.show {opacity: 1; transform: translateX(-50%) translateY(0);}
    /* ============================================================
    FOOTER
    ============================================================ */
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 100;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    @keyframes slideDown {from {opacity: 0; transform: translateY(-10px);} to {opacity: 1; transform: translateY(0);}}
    /* ============================================================
    RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .header-title {font-size: 16px;}
      .availability-dec-subtitle {font-size: 0.95em;}
      .availability-dec-btn {min-height: 56px; font-size: 10.5px; padding: 10px 6px;}
      .availability-dec-btn .material-icons {font-size: 19px;}
      .main-content {padding-left: 14px; padding-right: 14px; justify-content: center; align-items: center;}
    }
    @media (min-width: 769px) {
      .main-content {max-width: 700px; margin: 0 auto; width: 100%;}
    }
  </style>
</head>
<body>

    <img id="corpLogo" class="header-logo" alt="" style="display:none;"

  <div class="main-content">
    <div class="availability-dec-header">
      <p class="availability-dec-subtitle">Selecione o mês, dias e tipo de turno:</p>
    </div>
    <div class="months-card">
      <div class="availability-dec-buttons">
        <button class="availability-dec-btn" data-month="0" onclick="showCalendar(0, this)"><span class="material-icons">ac_unit</span><div>Janeiro</div></button>

        <button class="availability-dec-btn" data-month="4" onclick="showCalendar(4, this)"><span class="material-icons">wb_sunny</span><div>Maio</div></button>
        <button class="availability-dec-btn" data-month="5" onclick="showCalendar(5, this)"><span class="material-icons">beach_access</span><div>Junho</div></button>
        <button class="availability-dec-btn" data-month="6" onclick="showCalendar(6, this)"><span class="material-icons">local_fire_department</span><div>Julho</div></button>
        <button class="availability-dec-btn" data-month="7" onclick="showCalendar(7, this)"><span class="material-icons">whatshot</span><div>Agosto</div></button>
        <button class="availability-dec-btn" data-month="8" onclick="showCalendar(8, this)"><span class="material-icons">park</span><div>Setembro</div></button>
        <button class="availability-dec-btn" data-month="9" onclick="showCalendar(9, this)"><span class="material-icons">cloud</span><div>Outubro</div></button>
        <button class="availability-dec-btn" data-month="10" onclick="showCalendar(10, this)"><span class="material-icons">grain</span><div>Novembro</div></button>
        <button class="availability-dec-btn" data-month="11" onclick="showCalendar(11, this)"><span class="material-icons">celebration</span><div>Dezembro</div></button>
      </div>
    </div>
    <div id="calendarContainer" class="calendar-container">
      <div class="calendar-header" id="calendarHeader"></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <div id="legend" class="calendar-legend">
      <div class="legend-item">
        <span class="legend-color day"></span>
        <span class="legend-text">ECIN Dia</span>
      </div>
      <div class="legend-item">
        <span class="legend-color night"></span>
        <span class="legend-text">ECIN Noite</span>
      </div>
      <div class="legend-item">
        <span class="legend-color daynight"></span>
        <span class="legend-text">ECIN 24h</span>
      </div>

  </div>
  <div class="disp-modal" id="dispModal">
    <div class="disp-modal-content">
      <div class="disp-modal-header" id="dispModalTitle">DISPONIBILIDADE</div>
      <div class="disp-modal-body">
        <button class="disp-btn d" onclick="confirmDisp('ED')">Dia</button>
        <button class="disp-btn n" onclick="confirmDisp('EN')">Noite</button>
        <button class="disp-btn dn" onclick="confirmDisp('ET')">Dia/Noite</button>
        <button class="disp-btn nd" onclick="confirmDisp('N/D')">Não Disponível</button>
      </div>
      <div class="disp-modal-footer">
        <button class="disp-cancel" onclick="closeDispModal()">Cancelar</button>
      </div>
    </div>
  </div>
  <footer class="footer">
    <div class="footer-content">
      <div class="powered-by">
        Powered by Fábio Martins · Sistemas de Informação · Grupo CB360
      </div>
      <div class="footer-year">
        © 2023–2025 · Sistema CB360 Mobile
      </div>
    </div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('App pronta: ', reg.scope))
          .catch(err => console.log('Erro no motor da App: ', err));
      });
    }
  </script>
  <script>
    /* ===================== SUPABASE CONFIGURATION ====================== */
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';
    function getCorp() {return localStorage.getItem("currentCorpOperNr");}
    function getNInt() {return localStorage.getItem("currentCorpNint");}
    function getSupabaseHeaders(options = {}) {
      const corp = getCorp();
      const nint = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    /* ======================= CORPORATION LOADING ======================= */
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }
    /* ========================== GLOBAL STATE =========================== */
    let currentMonthIndex = null;
    let selectedDays = {};
    let selectedDayElement = null;
    let selectedDayNumber = null;
    /* ========================== LOADING DAYS =========================== */
    async function loadSelectedDaysFromSupabase(monthIndex) {
      const nint = localStorage.getItem("currentCorpNint");
      const corp = localStorage.getItem("currentCorpOperNr");
      if (!nint || !corp) return {};
      const month = monthIndex + 1;
      const year = new Date().getFullYear();
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/reg_serv?select=day,value&n_int=eq.${parseInt(nint,10)}&corp_oper_nr=eq.${corp.padStart(4,"0")}&year=eq.${year}&month=eq.${month}&value=in.(ED,EN,ET)`, {
            headers: getSupabaseHeaders()
          }
        );
        if (!res.ok) return {};
        const data = await res.json();
        const map = {};
        data.forEach(r => map[r.day] = r.value);
        return map;
      } catch (e) {
        console.error("Erro load dec_disp:", e);
        return {};
      }
    }
    /* ============================ CALENDAR ============================= */
    let allowPastMonthsEdit = true;
    function canEditDay(monthIndex, dayNumber) {
      if (allowPastMonthsEdit) return true;
      const now = new Date();
      const currentMonth = now.getMonth();
      if (monthIndex < currentMonth) {
        showToast("Não é possível alterar registos de meses anteriores.");
        return false;
      }
      if (monthIndex === currentMonth) {
        showToast("Não é possível alterar registos do mês atual. Para alterações a efetue-as partir do menu 'Trocas de Serviço'. Obrigado.");
        return false;
      }
      return true;
    }
    function resetCalendarUI() {
      document.querySelectorAll('.availability-dec-btn')
        .forEach(b => b.classList.remove('selected'));
      document.getElementById('calendarContainer')
        .classList.remove('show');
      document.getElementById('legend')
        .classList.remove('show');
      document.body.classList.remove('mobile-month-active');
      currentMonthIndex = null;
    }
    const BLOCKED_MONTHS = [0, 1, 2, 3, 10, 11];
    async function showCalendar(monthIndex, button) {
      if (BLOCKED_MONTHS.includes(monthIndex)) {
        resetCalendarUI();
        showToast('Não é possível dar disponibilidades para DECIR no mês selecionado.', 4500);
        return;
      }
      if (currentMonthIndex === monthIndex && button.classList.contains('selected')) {
        button.classList.remove('selected');
        document.getElementById('calendarContainer').classList.remove('show');
        document.body.classList.remove('mobile-month-active');
        document.getElementById('legend').classList.remove('show');
        currentMonthIndex = null;
        return;
      }
      currentMonthIndex = monthIndex;
      document.querySelectorAll('.availability-dec-btn').forEach(b => b.classList.remove('selected'));
      document.body.classList.add('mobile-month-active');
      button.classList.add('selected');
      const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      const year = new Date().getFullYear();
      const firstDay = new Date(year, monthIndex, 1);
      const lastDay = new Date(year, monthIndex + 1, 0);
      const calendarGrid = document.getElementById('calendarGrid');
      const calendarHeader = document.getElementById('calendarHeader');
      const calendarContainer = document.getElementById('calendarContainer');
      calendarHeader.textContent = `${monthNames[monthIndex]} ${year}`;
      calendarGrid.innerHTML = '';
      dayNames.forEach(d => {
        const el = document.createElement('div');
        el.className = 'calendar-day-header';
        el.textContent = d;
        calendarGrid.appendChild(el);
      });
      for (let i = 0; i < firstDay.getDay(); i++) {
        calendarGrid.appendChild(
          Object.assign(document.createElement('div'), {
            className: 'calendar-day empty'
          })
        );
      }
      /* Constrói a grelha completa (números + clique) de imediato, para nunca
         mostrar um calendário vazio enquanto se aguarda o Supabase. */
      const today = new Date();
      const dayElementsByDay = {};
      for (let day = 1; day <= lastDay.getDate(); day++) {
        const el = document.createElement('div');
        el.className = 'calendar-day';
        el.textContent = day;
        if (year === today.getFullYear() && monthIndex === today.getMonth() && day === today.getDate()) {
          el.classList.add('today');
        }
        el.addEventListener('click', () => {
          if (!canEditDay(monthIndex, day)) {
            return;
          }
          const month = currentMonthIndex + 1;
          if (month === 5 && day < 15) {
            showToast('DECIR inicia apenas às 00:00 de 15 de Maio');
            return;
          }
          if (month === 10 && day > 15) {
            showToast('DECIR finalizou às 23:59 do dia 15 de Outubro');
            return;
          }
          selectedDayElement = el;
          selectedDayNumber = day;
          document.getElementById('dispModalTitle').textContent = `Disponibilidade - ${day} ${monthNames[currentMonthIndex]}`;
          highlightSelectedButton(selectedDays[day] || null);
          document.getElementById('dispModal').classList.add('show');
        });
        calendarGrid.appendChild(el);
        dayElementsByDay[day] = el;
      }
      calendarContainer.classList.add('show');
      document.getElementById('legend').classList.add('show');
      const requestedMonth = monthIndex;
      selectedDays = await loadSelectedDaysFromSupabase(monthIndex);
      if (currentMonthIndex !== requestedMonth) { return; }
      Object.keys(selectedDays).forEach(dayStr => {
        const day = parseInt(dayStr, 10);
        const value = selectedDays[dayStr];
        const el = dayElementsByDay[day];
        if (el && DISP_CLASS_MAP[value]) {
          el.classList.add(DISP_CLASS_MAP[value]);
          el.dataset.value = value;
        }
      });
    }
    /* ============================== MODAL ============================== */
    function closeDispModal() {
      document.getElementById('dispModal').classList.remove('show');
      selectedDayElement = null;
      selectedDayNumber = null;
    }
    function highlightSelectedButton(value) {
      document.querySelectorAll('.disp-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent === value) btn.classList.add('active');
      });
    }
    /* ============================== TOAST ============================== */
    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      const content = document.querySelector(".main-content"); 
      document.body.appendChild(toast);
      if (content) content.classList.add("content-blur");
      setTimeout(() => toast.classList.add("show"), 50);
      setTimeout(() => {
        toast.classList.remove("show");
        if (content) content.classList.remove("content-blur");
        setTimeout(() => toast.remove(), 300);
      }, 4500);
    }
    /* ============================== SAVE =============================== */
    const DISP_CLASS_MAP = {'ED': 'disp-D', 'EN': 'disp-N', 'ET': 'disp-DN'};
    async function confirmDisp(value) {
      if (!selectedDayElement || selectedDayNumber === null) return;
      const month = currentMonthIndex + 1;
      if ((value === 'EN' || value === 'ET')) {
        const pnExists = await checkPNExists(selectedDayNumber, month);
        if (pnExists) {
          showToast(`ATENÇÃO! Já deu disponibilidade para PIQUETE no dia (${selectedDayNumber}/${month}). Não pode dar disponibilidade para ECIN Noite.`);
          return;
        }
      }
      const currentValue = selectedDays[selectedDayNumber] || null;
      if (value === 'N/D') {
        await deleteDayFromTables(selectedDayNumber);
        selectedDayElement.classList.remove('disp-D', 'disp-N', 'disp-DN', 'disp-ND');
        delete selectedDays[selectedDayNumber];
        closeDispModal();
        return;
      }
      let finalValue = value;
      if (currentValue === 'ED' && value === 'EN') {
        finalValue = 'EN';
      } else if (currentValue === 'EN' && value === 'ED') {
        finalValue = 'ED';
      } else if (currentValue === 'ET' && (value === 'ED' || value === 'EN')) {
        finalValue = value;
      } else if (currentValue === 'ET' && value === 'ET') {
        finalValue = 'ET';
      }
      await deleteDayFromTables(selectedDayNumber, 'ED,EN,ET');
      selectedDayElement.classList.remove('disp-D', 'disp-N', 'disp-DN', 'disp-ND');
      selectedDayElement.classList.add(DISP_CLASS_MAP[finalValue]);
      selectedDayElement.dataset.value = finalValue;
      selectedDays[selectedDayNumber] = finalValue;
      await saveDayToDecDisp(selectedDayNumber, finalValue);
      closeDispModal();
    }
    async function checkPNExists(day, month) {
      const nint = localStorage.getItem("currentCorpNint");
      const corp = localStorage.getItem("currentCorpOperNr");
      if (!nint || !corp || currentMonthIndex === null) return false;
      const year = new Date().getFullYear();
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/reg_serv?select=value&n_int=eq.${parseInt(nint,10)}&corp_oper_nr=eq.${corp.padStart(4,"0")}&year=eq.${year}&month=eq.${month}&day=eq.${day}&value=eq.PN`, {
            headers: getSupabaseHeaders()
          }
        );
        if (!res.ok) return false;
        const data = await res.json();
        return data && data.length > 0;
      } catch (e) {
        console.error("Erro checkPNExists:", e);
        return false;
      }
    }
    async function deleteDayFromTables(day, value = null) {
      const nint = localStorage.getItem("currentCorpNint");
      const corp = localStorage.getItem("currentCorpOperNr");
      if (!nint || !corp || currentMonthIndex === null) return;    
      const nintInt = parseInt(nint, 10);
      const corpPadded = corp.padStart(4, "0");
      const year = new Date().getFullYear();
      const month = currentMonthIndex + 1;    
      try {
        let commonFilter = `n_int=eq.${nintInt}&corp_oper_nr=eq.${corpPadded}&year=eq.${year}&month=eq.${month}&day=eq.${day}&value=neq.PN`;    
        let regServUrl = `${SUPABASE_URL}/rest/v1/reg_serv?${commonFilter}`;
        let regDispUrl = `${SUPABASE_URL}/rest/v1/reg_disp?${commonFilter}`;
        const [res1, res2] = await Promise.all([
          fetch(regServUrl, { method: 'DELETE', headers: getSupabaseHeaders() }),
          fetch(regDispUrl, { method: 'DELETE', headers: getSupabaseHeaders() })
        ]);    
        if (res1.ok) console.log("Eliminado de reg_serv");
        if (res2.ok) console.log("Eliminado de reg_disp");    
      } catch (e) {
        console.error("Erro ao apagar registros:", e);
      }
    }
    async function getAbvNameFromRegElems() {
      const nint = localStorage.getItem("currentCorpNint");
      if (!nint) return null;
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/reg_elems?select=abv_name&n_int=eq.${parseInt(nint, 10)}`, {
            headers: getSupabaseHeaders()
          }
        );
        if (!res.ok) return null;
        const data = await res.json();
        if (data && data.length > 0) {
          return data[0].abv_name || null;
        }
        return null;
      } catch (e) {
        console.error("Erro ao buscar abv_name:", e);
        return null;
      }
    }
    async function saveDayToDecDisp(day, value) {
      const nint = localStorage.getItem("currentCorpNint");
      const corp = localStorage.getItem("currentCorpOperNr");
      if (!nint || !corp || currentMonthIndex === null) return;
      const nintInt = parseInt(nint, 10);
      const corpPadded = corp.padStart(4, "0");
      const year = new Date().getFullYear();
      const month = currentMonthIndex + 1;
      try {
        await deleteDayFromTables(day);
        const abvName = await getAbvNameFromRegElems() || 'N/A';
        const payloadServ = { n_int: nintInt, corp_oper_nr: corpPadded, abv_name: abvName, section: 'DECIR', year, month, day, value };
        await fetch(`${SUPABASE_URL}/rest/v1/reg_serv`, {
          method: 'POST',
          headers: getSupabaseHeaders(),
          body: JSON.stringify(payloadServ)
        });
        const payloadDisp = { n_int: nintInt, corp_oper_nr: corpPadded, year, month, day, value };
        await fetch(`${SUPABASE_URL}/rest/v1/reg_disp`, {
          method: 'POST',
          headers: getSupabaseHeaders(),
          body: JSON.stringify(payloadDisp)
        });
      } catch (e) {
        console.error("Erro saveDayToDecDisp:", e);
      }
    }
    /* ============================== INIT =============================== */
    document.addEventListener('DOMContentLoaded', function() {
      loadCorpInfo();
      const savedTheme = localStorage.getItem('sgo-theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      }
      document.querySelectorAll('.availability-dec-btn').forEach(btn => {
        const month = parseInt(btn.dataset.month, 10);
        if (BLOCKED_MONTHS.includes(month)) {
          btn.classList.add('month-blocked');
        }
      });
    });
  </script>
