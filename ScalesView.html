<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CB360 Mobile">
  <meta name="theme-color" content="#c62828">
  <title>CB360 Mobile - Piquetes</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
    VARIABLES (mesmo sistema de design do CB360 Mobile)
    ============================================================ */
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
           --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
           --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
           --header-h: 60px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --blue: #0282fa;}
    /* ============================================================
    DARK MODE (mesma classe .dark-mode já usada por loadTheme())
    ============================================================ */
    .dark-mode {--bg: #141312; --surface: #1f1e1c; --surface-2: #2a2826; --border: rgba(255, 255, 255, 0.07); --txt-1: #f0ede8; --txt-2: #a09890; --txt-3: #5a5450;
                --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14); --blue: #6cb8ff;}
    /* ============================================================
    RESET & BASE
    ============================================================ */
    html {scrollbar-width: none; background: var(--red-dark);}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
          user-select: none; transition: background var(--ease), color var(--ease);}
    /* ============================================================
    HEADER
    ============================================================ */
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}
    .header-center {display: flex; flex-direction: column; align-items: center; gap: 1px;}
    .header-title {font-size: 19px; font-weight: 700; letter-spacing: 1.5px; color: #fff;}
    .header-sub {font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.75); text-transform: uppercase;}
    /* ============================================================
    MAIN CONTENT
    ============================================================ */
    .main-content {flex: 1; overflow-y: auto; overflow-x: hidden; padding-top: calc(var(--header-h) + 18px); padding-bottom: calc(var(--footer-h) + 18px); padding-left: 16px; padding-right: 16px;
                   display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px;
                   transition: padding-top 0.9s cubic-bezier(0.4, 0, 0.2, 1);}
    .main-content::-webkit-scrollbar {display: none;}
    body.mobile-month-active .main-content {padding-top: calc(var(--header-h) + 8px); justify-content: flex-start !important; align-items: stretch !important;}
    .main-content.slide-out, .main-content.slide-in {transform: none;}
    .scales-header {flex-shrink: 0; text-align: center; width: 100%;}
    .scales-card {flex-shrink: 0;}
    .nextserv-info-title {flex-shrink: 0;}
    .scales-subtitle {font-size: 1.1em; font-weight: 600; color: var(--txt-2); transition: color var(--ease);}
    /* ============================================================
    MONTH BUTTONS (estilo grid-card / mbtn do menu principal)
    ============================================================ */
    .months-card {background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-md); overflow: hidden; width: 100%; margin-bottom: 4px; flex-shrink: 0;}
    .scales-buttons {display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); width: 100%;}
    .scales-btn {position: relative; background: var(--surface); border: none; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
                 padding: 14px 8px; min-height: 64px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--txt-2);
                 cursor: pointer; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
                 line-height: 1.2; transition: background var(--ease), color var(--ease);}
    .scales-btn:nth-child(3n) {border-right: none;}
    .scales-btn:nth-child(n+10) {border-bottom: none;}
    .scales-btn:hover:not(.selected) {background: var(--surface-2); color: var(--txt-1);}
    .scales-btn:active:not(.selected) {background: var(--surface-2);}
    .scales-btn .material-icons {font-size: 22px; color: var(--red-icon); transition: color var(--ease), transform var(--ease);}
    .scales-btn:hover .material-icons {transform: scale(1.08);}
    .scales-btn.selected {background: var(--red-light); color: var(--red);}
    .scales-btn.selected .material-icons {color: var(--red); transform: scale(1.1);}
    .scales-btn div, .scales-btn span {position: relative; z-index: 2; line-height: 1.2;}
    /* ============================================================
    RESULT CARDS (piquetes / decir / extras)
    ============================================================ */
    .scales-card {display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px; border-radius: var(--r-md); background: var(--surface);
                  border: 1px solid var(--border); border-left: 4px solid var(--red); border-right: 4px solid var(--red); box-shadow: var(--sh-sm); width: 100%; max-width: 100%;}
    .scales-card span.card-title {font-weight: 700; margin-bottom: 0; font-size: 13px; color: var(--txt-1); letter-spacing: 0.3px;}
    .scales-card span.values {display: block; font-size: 13px; color: var(--txt-2);}
    .loading-spinner {display: inline-block; width: 14px; height: 14px; border: 2px solid var(--red); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;
                      margin-right: 8px; vertical-align: middle;}
    .error-message {color: #e74c3c; font-weight: 600; font-size: 13px;}
    /* ============================================================
    NEXT SERVICES
    ============================================================ */
    .nextserv-info-title {font-size: 12px; font-weight: 700; text-align: left; color: var(--txt-2); margin: 0; background: var(--surface); padding: 5px 10px; border: 1px solid var(--border);
                          border-radius: var(--r-sm); width: 100%; max-width: 100%; box-shadow: var(--sh-sm);}
    .nextserv-card {margin-bottom: 5px; background: var(--surface); border-radius: var(--r-md); border: 1px solid var(--border); padding: 12px; box-shadow: var(--sh-sm); width: 100%; box-sizing: border-box;
                    transition: transform var(--ease), box-shadow var(--ease); animation: slideDown 0.3s ease forwards; cursor: pointer;}
    .nextserv-card:hover {box-shadow: var(--sh-md); transform: translateY(-1px);}
    .nextserv-type {text-align: left; margin-bottom: 4px;}
    .nextserv-type .label {font-size: 12.5px; font-weight: 700; color: var(--txt-2);}
    .nextserv-type .nextserv-type-value {font-size: 13.5px; color: var(--red); font-weight: 700;}
    .nextserv-dates {display: flex; align-items: center; gap: 8px; margin-bottom: 4px;}
    .nextserv-dates .label {font-size: 12.5px; font-weight: 700; color: var(--txt-2);}
    .nextserv-dates .nextserv-dates-value {font-size: 12.5px; color: var(--blue);}
    .nextserv-location {text-align: left;}
    .nextserv-location .label {font-size: 12.5px; font-weight: 700; color: var(--txt-2); text-align: left;}
    .nextserv-location .location-value {font-size: 12.5px; color: var(--txt-1);}
    .nextserv-prevention {margin-left: auto; background-color: var(--red-light); color: var(--red); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 15px; white-space: nowrap;}
    /* ============================================================
    SERVICE MODAL
    ============================================================ */
    .service-modal {position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 20px;}
    .service-modal-content {background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 460px; max-height: 78%; box-shadow: var(--sh-lg); border: 1px solid var(--border);
                            position: relative; display: flex; flex-direction: column; overflow: hidden; animation: mIn 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);}
    @keyframes mIn {from {opacity: 0; transform: scale(0.95) translateY(10px);} to {opacity: 1; transform: scale(1) translateY(0);}}
    .modal-header {background: linear-gradient(to right, var(--red-dark), var(--red)); color: #fff; padding: 15px 18px; font-size: 15px; font-weight: 600; text-align: center; flex-shrink: 0;}
    .modal-close {position: absolute; top: 12px; right: 14px; font-size: 20px; cursor: pointer; color: #fff;}
    .modal-elements-container {padding: 14px; display: flex; flex-direction: column; gap: 9px; overflow-y: auto; flex: 1; scrollbar-width: none;}
    .modal-elements-container::-webkit-scrollbar {display: none;}
    .modal-footer {background: var(--surface-2); padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; flex-shrink: 0;}
    .modal-footer-btn {background: linear-gradient(to right, var(--red-dark), var(--red)); color: #fff; border: none; padding: 9px 24px; border-radius: 50px; font-size: 13px; font-weight: 600;
                       cursor: pointer; transition: opacity var(--ease);}
    .modal-footer-btn:hover {opacity: 0.88;}
    .modal-footer-btn:active {transform: scale(0.98);}
    /* ============================================================
    ELEMENT CARDS (dentro do modal)
    ============================================================ */
    .element-card {display: flex; justify-content: flex-start; align-items: center; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px; background: var(--surface-2);
                   box-shadow: var(--sh-sm); gap: 5px;}
    .element-info {display: flex; flex-direction: column; gap: 2px;}
    .element-info .element-name {font-size: 15px; font-weight: 700; color: var(--txt-1);}
    .element-info span {font-size: 13px; color: var(--txt-2);}
    .element-avatar {width: 48px; height: 48px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); object-fit: cover; margin-right: 5px;}
    /* ============================================================
    NEXT SERVICES SCROLL CONTAINER
    ============================================================ */
    #nextServicesCard {flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 0px; scrollbar-width: none; width: 100%; max-width: 100%; margin-bottom:15px;}
    #nextServicesCard::-webkit-scrollbar {display: none;}
    /* ============================================================
    FOOTER
    ============================================================ */
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 100;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    @keyframes spin {to { transform: rotate(360deg);}}
    @keyframes slideDown {from {opacity: 0; transform: translateY(-10px);} to {opacity: 1; transform: translateY(0);}}
    /* ============================================================
    RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .header-title {font-size: 16px;}
      .scales-subtitle {font-size: 0.95em;}
      .scales-btn {min-height: 56px; font-size: 10.5px; padding: 10px 6px;}
      .scales-btn .material-icons {font-size: 19px;}
      .main-content {padding-left: 14px; padding-right: 14px; justify-content: center; align-items: center;}
    }
    @media (min-width: 769px) {
      .main-content {max-width: 700px; margin: 0 auto; width: 100%;}
    }
  </style>
</head>
<body>
  <header class="header">
    <img id="corpLogo" class="header-logo" alt="" style="display:none;"
         onerror="console.error('❌ Logo: falha ao carregar imagem, URL:', this.src); this.style.display='none';"
         onload="this.style.display='block';">
    <div class="header-center">
      <span class="header-title">ESCALAS</span>
      <span class="header-sub">Piquetes · Decir · Extras</span>
    </div>
    <h2 id="corpInfo" style="display: none;"></h2>
  </header>
  <div class="main-content">
    <div class="scales-header">
      <p class="scales-subtitle">Selecione o mês:</p>
    </div>
    <div class="months-card">
      <div class="scales-buttons">
        <button class="scales-btn" data-month="0"><span class="material-icons">ac_unit</span><div>Janeiro</div></button>
        <button class="scales-btn" data-month="1"><span class="material-icons">favorite</span><div>Fevereiro</div></button>
        <button class="scales-btn" data-month="2"><span class="material-icons">eco</span><div>Março</div></button>
        <button class="scales-btn" data-month="3"><span class="material-icons">local_florist</span><div>Abril</div></button>
        <button class="scales-btn" data-month="4"><span class="material-icons">wb_sunny</span><div>Maio</div></button>
        <button class="scales-btn" data-month="5"><span class="material-icons">beach_access</span><div>Junho</div></button>
        <button class="scales-btn" data-month="6"><span class="material-icons">local_fire_department</span><div>Julho</div></button>
        <button class="scales-btn" data-month="7"><span class="material-icons">whatshot</span><div>Agosto</div></button>
        <button class="scales-btn" data-month="8"><span class="material-icons">park</span><div>Setembro</div></button>
        <button class="scales-btn" data-month="9"><span class="material-icons">cloud</span><div>Outubro</div></button>
        <button class="scales-btn" data-month="10"><span class="material-icons">grain</span><div>Novembro</div></button>
        <button class="scales-btn" data-month="11"><span class="material-icons">celebration</span><div>Dezembro</div></button>
      </div>
    </div>
    <div id="picketsCard" class="scales-card" style="display:none; margin:-5px 0 0 0;"></div>
    <div id="decirCard" class="scales-card" style="display:none; margin:-5px 0 0 0;"></div>
    <div id="extrasCard" class="scales-card" style="display:none;"></div>
    <div id="nextserv-info-title" class="nextserv-info-title" style="display:none; margin:0 0 -5px 0;">📅 Próximos(s) Serviços(s)</div>
    <div id="nextServicesCard" style="display:none;"></div>
  </div>
  <div id="serviceModal" class="service-modal" style="display:none;">
    <div class="service-modal-content">
      <div class="modal-header">
        <span id="modalTitle">ELEMENTOS DE SERVIÇO</span>
      </div>
      <div id="modalElementsContainer" class="modal-elements-container">
      </div>
      <div class="modal-footer">
        <button class="modal-footer-btn" id="modalFooterClose">FECHAR</button>
      </div>
    </div>
  </div>
  <footer class="footer">
    <div class="footer-content">
      <div class="powered-by">
        Powered by Fábio Martins · Sistemas de Informação · Grupo CB360
      </div>
      <div class="footer-year">
        © 2023–2025 · Sistema CB360 Mobile
      </div>
    </div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('App pronta: ', reg.scope))
          .catch(err => console.log('Erro no motor da App: ', err));
      });
    }
  </script>
  <script>
    /* ===================== SUPABASE CONFIGURATION ====================== */
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';

    /* --- chave única e consistente em TODO o ficheiro para corp/nint --- */
    function getCorp()  {return localStorage.getItem("currentCorpOperNr")}
    function getNInt()  {return localStorage.getItem("currentCorpNint")}

    function getSupabaseHeaders(options = {}) {
      const corp  = getCorp();
      const nint  = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    /* ===================== UTILITY FUNCTIONS ===================== */
    function showLoading(cardId, message) {
      const card = document.getElementById(cardId);
      card.style.display = "block";
      card.innerHTML = `
        <div style="display: flex; align-items: center;">
          <div class="loading-spinner"></div>
          <span>${message}</span>
        </div>
      `;
    }    
    function showError(cardId, message) {
      const card = document.getElementById(cardId);
      card.style.display = "block";
      card.innerHTML = `<span class="error-message">⚠️ ${message}</span>`;
    }    
    function validateCorpData() {
      const nintCorpStr = localStorage.getItem("currentCorpNint");
      if (!nintCorpStr || isNaN(parseInt(nintCorpStr, 10))) {
        return null;
      }
      return parseInt(nintCorpStr, 10);
    }
    /* ======================= CORPORATION LOADING ======================= */
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }
    /* ========================== THEME LOADING ========================== */
    function loadTheme() {
      const savedTheme = localStorage.getItem('sgo-theme');
      if (savedTheme === 'dark') document.body.classList.add('dark-mode');
    }    
    function getWorkYear(targetMonthIndex) {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();
      const currentDay = now.getDate();
      if (currentMonth === 11 && currentDay >= 27 && targetMonthIndex === 0) {
        return currentYear + 1;
      }
      return currentYear;
    }
    /* ===================== GENERIC DATA LOADER ===================== */
    async function loadMonthData(config, monthIndex) {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const nintCorp = validateCorpData();      
      if (!nintCorp) {
        showError(config.cardId, "Elemento e Corporação não definidos.");
        return;
      }      
      const month = monthIndex + 1;
      const yearToFetch = getWorkYear(monthIndex);
      const card = document.getElementById(config.cardId);
      card.style.display = "none";      
      try {
        const url = `${SUPABASE_URL}/rest/v1/${config.table}?select=${config.select}&n_int=eq.${nintCorp}&month=eq.${month}&year=eq.${yearToFetch}&${config.filter}&corp_oper_nr=eq.${corpOperNr}`;
        const response = await fetch(url, { headers: getSupabaseHeaders() });        
        if (!response.ok) {
          showError(config.cardId, "Erro ao carregar dados");
          return;
        }        
        const data = await response.json();
        const formattedData = config.formatData(data);
         if (config.hideIfEmpty && (!formattedData || formattedData.length === 0)) {
      card.style.display = "none";
      return;
    }
        card.innerHTML = formattedData.length
          ? `<span class="card-title">${config.label}</span><span class="values">${formattedData}</span>`
          : `<span class="card-title">${config.label}</span><span class="values"> Nenhum Registado</span>`;
        card.style.display = "block";
      } catch (err) {
        console.error(`Erro ao carregar ${config.label}`, err);
        showError(config.cardId, "Erro de ligação ao servidor");
      }
    }
    /* ========================= PICKETS LOADING ========================= */
    async function loadPicketsMonth(monthIndex) {
      const yearToFetch = getWorkYear(monthIndex);
      const currentYear = new Date().getFullYear();
      const dynamicLabel = yearToFetch > currentYear 
        ? `PIQUETES ATRIBUÍDOS - ${yearToFetch}`
        : "PIQUETES ATRIBUÍDOS";      
      await loadMonthData({cardId: "picketsCard", table: "reg_serv", select: "day", filter: "value=eq.PN", label: dynamicLabel, formatData: (data) => {
          return data
            .map(d => d.day)
            .filter(Boolean)
            .sort((a, b) => a - b)
            .map(d => d + "N")
            .join(", ");
        }
      }, monthIndex);
    }
    /* ========================== DECIR LOADING ========================== */
    async function loadDecirMonth(monthIndex) {
      await loadMonthData({cardId: "decirCard", table: "reg_serv", select: "day,value", filter: "value=in.(ED,EN,ET,EP)", label: "ECINS ATRIBUÍDOS", formatData: (data) => {
          return data
            .filter(d => d.day && d.value)
            .sort((a, b) => a.day - b.day)
            .map(d => `${d.day}${d.value}`)
            .join(", ");
        }
      }, monthIndex);
    }
    /* ========================= EXTRAS LOADING ========================== */
    async function loadExtrasMonth(monthIndex) {
      await loadMonthData({cardId: "extrasCard", table: "reg_extras", select: "day,value", filter: "value=eq.EX", hideIfEmpty: true, label: "EXTRAS ATRIBUÍDOS", formatData: (data) => {
          return data
            .filter(d => d.day && d.value)
            .sort((a, b) => a.day - b.day)
            .map(d => `${d.day}${d.value === "EX" ? "D" : d.value}`)
            .join(", ");
        }
      }, monthIndex);
    }
    /* ===================== CREATE NEXT SERVICE CARD ==================== */
    function createServiceCard(service, index = 0) {
      const card = document.createElement("div");
      card.className = "nextserv-card";
      card.style.opacity = '0';
      card.style.transform = 'translateY(-10px)';      
      const year = service.year || new Date().getFullYear();
      const dateText = formatDateWithWeekday(service.day, service.month, year);
      const info = getServiceInfo(service.value.toUpperCase());      
      card.innerHTML = `
        <div>
          <div class="nextserv-type">
            <span class="label">Tipo:</span>
            <span class="nextserv-type-value">${info.tipo}</span>
          </div>
          <div class="nextserv-dates" style="display:flex; justify-content: space-between; align-items: center;">
            <div class="nextserv-left">
              <span class="label">Data:</span>
              <span class="nextserv-dates-value">${dateText}</span>
            </div>
            <div class="nextserv-prevention">👨‍🚒 ${service.totalElements || '0'}</div>
          </div>
          <div class="nextserv-location">
            <span class="label">Turno:</span>
            <span class="location-value">${info.turno}</span>
          </div>
        </div>
      `;      
      card.addEventListener('click', async () => {
        openServiceModal(`${info.tipo} - ${dateText}`, null);
        const elements = await fetchServiceElements(service.day, service.month, service.value);
        openServiceModal(`${info.tipo} - ${dateText}`, elements);
      });      
      setTimeout(() => {
        card.style.transition = 'all 0.3s ease';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, index * 150);      
      return card;
    }
    function getServiceInfo(code) {
      const map = {PN: {tipo: "PIQUETE", turno: "20:00-08:00"}, ED: {tipo: "ECIN Dia", turno: "08:00-20:00"}, EN: {tipo: "ECIN Noite", turno: "20:00-08:00"}, ET: {tipo: "ECIN Dia/Noite", turno: "08:00-08:00"},
                   EX: {tipo: "EXTRA", turno: "08:00-20:00"}};
      return map[code] || { tipo: code, turno: "-" };
    }
    function formatDateWithWeekday(day, month, year) {
      const date = new Date(year, month - 1, day);
      const weekdays = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
      const dd = String(day).padStart(2, "0");
      const mm = String(month).padStart(2, "0");
      return `${dd}-${mm}-${year} (${weekdays[date.getDay()]})`;
    }
    async function fetchServiceElements(day, month, value) {
      try {
        const corpOperNr = localStorage.getItem("currentCorpOperNr");
        const nintCorp = validateCorpData();
        if (!nintCorp || !corpOperNr) return [];        
        const regServUrl = `${SUPABASE_URL}/rest/v1/reg_serv?select=n_int&corp_oper_nr=eq.${corpOperNr}&day=eq.${day}&month=eq.${month}&value=eq.${value}`;
        const servResponse = await fetch(regServUrl, { headers: getSupabaseHeaders() });
        const servData = await servResponse.json();        
        if (!Array.isArray(servData) || servData.length === 0) return [];        
        const nInts = [...new Set(servData.map(s => parseInt(s.n_int)).filter(n => !isNaN(n)))];
        if (nInts.length === 0) return [];        
        const nIntsPadded = nInts.map(n => String(n).padStart(3, '0'));
        const elemUrl = `${SUPABASE_URL}/rest/v1/reg_elems?select=n_int,full_name,patent,photo_url&n_int=in.(${nIntsPadded.join(',')})&corp_oper_nr=eq.${corpOperNr}`;
        const elemResponse = await fetch(elemUrl, { headers: getSupabaseHeaders() });
        const allElements = await elemResponse.json();        
        if (!Array.isArray(allElements)) return [];        
        allElements.sort((a, b) => parseInt(a.n_int) - parseInt(b.n_int));
        return allElements;
      } catch (err) {
        console.error('Erro ao buscar elementos:', err);
        return [];
      }
    }
    const patenteLogos = {"Comandante": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/Comandante.png",
                          "2º Comandante": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/2%20Comandante.png",

    function openServiceModal(title, elements) {
      const modal = document.getElementById('serviceModal');
      const container = document.getElementById('modalElementsContainer');
      const modalTitle = document.getElementById('modalTitle');      
      modalTitle.textContent = title;
      modal.style.display = 'flex';
      container.innerHTML = '';      
      if (elements === null) {
        container.innerHTML = `
          <div style="display: flex; justify-content: center; align-items: center; padding: 40px;">
            <div class="loading-spinner"></div>
            <span style="margin-left: 10px;">A carregar elementos...</span>
          </div>
        `;
        return;
      }      
      if (!elements || elements.length === 0) {
        const p = document.createElement('p');
        p.textContent = 'Nenhum elemento encontrado';
        p.style.color = 'var(--txt-1)';
        p.style.textAlign = 'center';
        p.style.padding = '40px';
        container.appendChild(p);
      } else {
        elements.forEach(e => {
          const card = document.createElement('div');
          card.className = 'element-card';          
          const avatar = document.createElement('img');
          avatar.className = 'element-avatar';
          avatar.src = e.photo_url || 'https://www.gravatar.com/avatar/?d=mp';
          avatar.alt = e.full_name || 'Avatar';          
          const info = document.createElement('div');
          info.className = 'element-info';
          info.innerHTML = `
            <span class="element-name">${e.full_name || 'N/D'}</span>
            <span>${e.patent || 'N/D'}</span>
          `;          
          const patenteImg = document.createElement('img');
          patenteImg.src = patenteLogos[e.patent] || '';
          patenteImg.alt = e.patent || '';
          patenteImg.style.width = '30px';
          patenteImg.style.height = '30px';
          patenteImg.style.objectFit = 'contain';
          patenteImg.style.marginLeft = 'auto';          
          card.appendChild(avatar);
          card.appendChild(info);
          card.appendChild(patenteImg);
          container.appendChild(card);
        });
      }
    }
    document.getElementById('modalFooterClose').addEventListener('click', () => {
      document.getElementById('serviceModal').style.display = 'none';
    });
    async function loadNextServicesUnified(selectedMonth) {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const container = document.getElementById("nextServicesCard");
      const title = document.getElementById("nextserv-info-title");
      container.innerHTML = "";
      container.style.display = "none";
      title.style.display = "none";
      const nintCorp = validateCorpData();
      if (!nintCorp) return;
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      const yearToFetch = getWorkYear(selectedMonth);
      try {
        const urlServ = `${SUPABASE_URL}/rest/v1/reg_serv?select=day,month,value&n_int=eq.${nintCorp}&value=in.(PN,ED,EN,ET)&month=eq.${selectedMonth + 1}&year=eq.${yearToFetch}&order=day.asc`;
        const responseServ = await fetch(urlServ, {headers: getSupabaseHeaders()});
        const dataServ = await responseServ.json();
        const urlExtras = `${SUPABASE_URL}/rest/v1/reg_extras?select=day,month,value&n_int=eq.${nintCorp}&value=eq.EX&month=eq.${selectedMonth + 1}&year=eq.${yearToFetch}&order=day.asc`;
        const responseExtras = await fetch(urlExtras, {headers: getSupabaseHeaders()});
        const dataExtras = await responseExtras.json();
        const services = [...dataServ, ...dataExtras].filter(d => {
          if (yearToFetch > currentYear) return true;
          if (selectedMonth > currentMonth) return true;
          if (selectedMonth < currentMonth) return false;
          const serviceDate = new Date(currentYear, selectedMonth, d.day);
          const type = d.value.toUpperCase();
          const limitHour = type === "ED" ? 8 : 20;
          serviceDate.setHours(limitHour, 0, 0, 0);
          return serviceDate > now;
        });
        if (!services.length) return;
        title.style.display = "block";
        container.style.display = "block";
        let index = 0;
        for (const service of services) {
          const countUrl = service.value === "EX"
          ? `${SUPABASE_URL}/rest/v1/reg_extras?select=id&month=eq.${service.month}&year=eq.${yearToFetch}&day=eq.${service.day}&value=eq.${service.value}&corp_oper_nr=eq.${corpOperNr}`
          : `${SUPABASE_URL}/rest/v1/reg_serv?select=id&month=eq.${service.month}&year=eq.${yearToFetch}&day=eq.${service.day}&value=eq.${service.value}&corp_oper_nr=eq.${corpOperNr}`;
          const countResponse = await fetch(countUrl, { headers: getSupabaseHeaders() });
          const countData = await countResponse.json();
          const totalElements = Array.isArray(countData) ? countData.length : 0;
          const card = createServiceCard({ day: service.day, month: service.month, value: service.value, totalElements, year: yearToFetch }, index);
          container.appendChild(card);
          index++;
        }
      } catch (err) {
        console.error("Erro ao carregar próximos serviços:", err);
      }
    }
    function toggleMobileMonthLayout(active) {
      if (window.innerWidth > 480) return Promise.resolve();
      const body = document.body;
      const main = document.querySelector('.main-content');
      if (!main) return Promise.resolve();
      return new Promise(resolve => {
        const topOffset = 70;
        const currentScroll = main.scrollTop;
        main.classList.remove('slide-in');
        main.classList.add('slide-out');
        setTimeout(() => {
          if (active) {
            body.classList.add('mobile-month-active');
          } else {
            body.classList.remove('mobile-month-active');
          }
          main.classList.remove('slide-out');
          main.classList.add('slide-in');
          const targetScroll = currentScroll;
          main.scrollTo({top: targetScroll, behavior: 'smooth'});
          setTimeout(() => {
            main.classList.remove('slide-in');
            resolve();
          }, 350);
        }, 50);
      });
    }
    /* ========================== INITIALIZATION ========================== */
    document.addEventListener('DOMContentLoaded', function() {
      loadCorpInfo();
      loadTheme();      
      let selectedMonth = null;
      const mesesSemDecir = [0, 1, 2, 3, 10, 11];      
      document.querySelectorAll(".scales-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const month = parseInt(btn.dataset.month, 10);          
          if (selectedMonth === month) {
            btn.classList.remove("selected");
            selectedMonth = null;
            toggleMobileMonthLayout(false);
            document.getElementById("picketsCard").style.display = "none";
            document.getElementById("decirCard").style.display = "none";
            document.getElementById("extrasCard").style.display = "none";
            document.getElementById("nextServicesCard").style.display = "none";
            document.getElementById("nextserv-info-title").style.display = "none";
            return;
          }      
          document.querySelectorAll(".scales-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          selectedMonth = month;
          await toggleMobileMonthLayout(true);
          document.getElementById("picketsCard").style.display = "none";
          document.getElementById("decirCard").style.display = "none";
          document.getElementById("extrasCard").style.display = "none";
          document.getElementById("nextServicesCard").style.display = "none";
          document.getElementById("nextserv-info-title").style.display = "none";          
          const today = new Date();          
          await loadPicketsMonth(month);          
          if (!mesesSemDecir.includes(month)) {
            await loadDecirMonth(month);
          }
          await loadExtrasMonth(month);
          if (month >= today.getMonth()) {
            document.getElementById("nextserv-info-title").style.display = "block";
            await loadNextServicesUnified(month);
          }
        });
      });
    });
