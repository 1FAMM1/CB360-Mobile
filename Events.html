  <style>
    @view-transition {navigation: auto;}
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
           --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
           --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
           --header-h: 60px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --blue: #0282fa; --green: #2e7d32; --green-state: #2e7d32; --red-state: #c62828;}

                --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14); --blue: #6cb8ff;
                --green: #66bb6a; --green-state: #66bb6a; --red-state: #ff6b6b;}
    ::view-transition-old(root), ::view-transition-new(root) {animation-duration: 0.5s;}
    .header, .footer {view-transition-name: none;}
    html {scrollbar-width: none; background: var(--red-dark);}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex;
          flex-direction: column; user-select: none; transition: background var(--ease), color var(--ease);}
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}

                   display: flex; flex-direction: column; gap: 10px; background: var(--bg); scrollbar-width: none; transition: background var(--ease);}
    .main-content::-webkit-scrollbar {display: none;}
    #back-header {display: none; align-items: center; padding: 0 4px; margin: 0 0 2px; color: var(--txt-2); background: transparent; cursor: pointer;}
    .back-arrow {font-size: 22px !important; font-weight: bold !important;}

    .section-title {display: flex; align-items: center; gap: 8px; font-size: 0.95em; font-weight: 700; letter-spacing: 1px; color: var(--txt-1); text-transform: uppercase; margin: 4px 0 2px; margin-bottom: 15px;}

    .event-card:active {transform: scale(.99);}
    .event-card-header {display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; background: linear-gradient(to right, var(--red-dark), var(--red));}
    .event-card-header .event-title {font-size: 0.92rem; font-weight: 700; color: #fff; letter-spacing: -0.01em;}
    .event-type-badge {flex-shrink: 0; background: rgba(255,255,255,0.2); color: #fff; font-weight: 700; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px;
                       border-radius: 9999px; white-space: nowrap;}
    .event-card-body {padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px;}
    .event-row {display: flex; align-items: flex-start; gap: 8px; color: var(--txt-2);}
    .event-row .material-icons {font-size: 15px; color: var(--red-icon); flex-shrink: 0; margin-top: 1px;}

    .main-event-card-header .material-icons {font-size: 17px; color: #fff;}

    .fade-in-card.show {opacity: 1; transform: translateY(0);}
    .shift-event-card {display: flex; align-items: center; justify-content: space-between; gap: 5px; width: 100%; border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 15px;
                       background: var(--surface); box-shadow: var(--sh-sm); transition: transform var(--ease), box-shadow var(--ease), background var(--ease);}
    .shift-content {display: flex; flex-direction: column; gap: 0px; flex: 1; min-width: 0;}
    .shift-row {display: flex; align-items: baseline; gap: 5px;}
    .shift-content .label {font-size: 11px; font-weight: 700; color: var(--txt-2); text-transform: uppercase; letter-spacing: 0.4px; flex-shrink: 0;}
    .shift-dates-value {font-size: 13px; font-weight: 700; color: var(--txt-1);}
    .shift-location-value {font-size: 13px; font-weight: 700; color: var(--blue);}
    .shift-closed {align-self: flex-start; background: var(--red); color: #fff; font-weight: 700; font-size: 10.5px; padding: 3px 10px; border-radius: 9999px; margin-top: 2px;}
    .shift-event-state {margin-top: 2px;}
    .shift-state-value {font-size: 12px; font-weight: 700;}
    .shift-state-pending-approval, .shift-state-not-approved {color: var(--red-state);}
    .shift-state-approved {color: var(--green-state);}
    .shift-add {background: var(--blue); color: #fff; font-weight: 700; font-size: 15px; line-height: 15px; width: 23px; height: 23px; min-width: 23px; display: inline-flex; align-items: center;
               justify-content: center; border-radius: 50%; flex-shrink: 0; cursor: pointer; border: none; box-shadow: var(--sh-sm); transition: transform var(--ease), opacity var(--ease);}
    .shift-add:hover:not(:disabled) {transform: scale(1.05);}
    .shift-add.shift-state-approved {background: var(--green-state); cursor: not-allowed; opacity: 0.85;}
    .shift-add.shift-state-not-approved {background: var(--red-state); cursor: not-allowed; opacity: 0.85;}
    .shift-closed-btn {background: var(--txt-3) !important; cursor: not-allowed !important; opacity: 0.7 !important; display: none;}
    @keyframes fadeIn {from {opacity: 0;} to {opacity: 1;}}
    .toast-container {position: fixed; top: calc(var(--header-h) + 14px); right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;}
    .toast {display: flex; align-items: center; gap: 10px; min-width: 220px; max-width: 320px; padding: 10px 14px; border-radius: var(--r-sm); color: #fff; font-weight: 600; font-size: 13px;
           box-shadow: var(--sh-lg); opacity: 0; transform: translateX(100%); animation: toastSlideIn 0.3s ease-out forwards; cursor: pointer; pointer-events: auto;}
    .toast .icon {font-size: 13px; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.25); flex-shrink: 0;}
    .toast.success {background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);}
    .toast.error {background: linear-gradient(135deg, var(--red-dark) 0%, var(--red) 100%);}
    @keyframes toastSlideIn {from {opacity: 0; transform: translateX(100%);} to {opacity: 1; transform: translateX(0);}}
    @keyframes toastSlideOut {from {opacity: 1; transform: translateX(0);} to {opacity: 0; transform: translateX(100%);}}
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 100;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    .footer strong {color: inherit;}
    @media (max-width: 480px) {
      .header-title {font-size: 16px;}
      .main-content {padding-left: 12px; padding-right: 12px;}
    }
    @media (min-width: 769px) {
      .main-content {max-width: 700px;}
    }
  </style>

  <script>
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';
    function getCorp()  {return localStorage.getItem("currentCorpOperNr");}
    function getNInt()  {return localStorage.getItem("currentCorpNint");}
    function getSupabaseHeaders(options = {}) {
      const corp = getCorp();
      const nint = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    /* ======================= CORPORATION LOADING ======================= */
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }
    /* ======================= EVENTS LOADING ======================= */
    async function loadEventList() {
      const container = document.getElementById("events-container");
      if (!container) return;
      container.innerHTML = '<div class="section-title"><span class="material-icons">event</span>Eventos a Decorrer</div>';
      try {
        const corpOperNr = localStorage.getItem("currentCorpOperNr");
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/event_list?select=event,event_type,value,location,date_start,date_end,is_ended&corp_oper_nr=eq.${corpOperNr}&is_ended=eq.false`, {
          headers: getSupabaseHeaders()
        });
        const data = await resp.json();
        if (!data || data.length === 0) {
          const card = document.createElement("div");
          card.className = "empty-card";
          card.textContent = "Sem eventos registados";
          container.appendChild(card);
          return;
        }
        data.forEach(event => container.appendChild(createEventCards(event)));
      } catch (err) {
        console.error("Erro ao carregar event_list:", err);
        const errorCard = document.createElement('div');
        errorCard.className = 'error-card';
        errorCard.textContent = 'Erro ao carregar eventos';
        container.appendChild(errorCard);
      }
    }
    function formatDateWithWeekday(dateStr) {
      const date = new Date(dateStr);
      if (isNaN(date)) return dateStr;
      const days = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
      const dd = String(date.getDate()).padStart(2, '0');
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const yyyy = date.getFullYear();
      const weekday = days[date.getDay()];
      return `${dd}-${mm}-${yyyy} (${weekday})`;
    }
    function formatDateSimple(dateStr) {
      const date = new Date(dateStr);
      if (isNaN(date)) return dateStr;
      const dd = String(date.getDate()).padStart(2, '0');
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const yyyy = date.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }
    function createEventCards(event) {
      const card = document.createElement("div");
      card.className = "event-card";
      let datesText = formatDateSimple(event.date_start);
      if (event.date_end) {
        datesText += ` até ${formatDateSimple(event.date_end)}`;
      }
      card.innerHTML = `
        <div class="event-card-header">
          <span class="event-title">${event.event}</span>
          <span class="event-type-badge">${event.event_type || ''}</span>
        </div>
        <div class="event-card-body">
          <div class="event-row"><span class="material-icons">event</span><span class="value">${datesText}</span></div>
          <div class="event-row"><span class="material-icons">place</span><span class="value">${event.location}</span></div>
        </div>
      `;
      card.addEventListener('click', () => showEventShiftCards(event.event));
      return card;
    }
    function createMainEventCard(event) {
      const card = document.createElement("div");
      card.className = "main-event-card";
      let datesText = `${event.date_start}`;
      if (event.date_end) datesText += ` até ${event.date_end}`;
      card.innerHTML = `
        <div class="main-event-card-header">
          <span class="material-icons">place</span>
          <span class="main-event-location">${event.location}</span>
        </div>
        <div class="main-event-card-body">
          <div class="main-event-type">${event.event}</div>
          <div class="main-event-value-badge"><span class="material-icons">payments</span>${event.value} €/h</div>
        </div>
      `;
      return card;
    }
    async function createEventShiftCards(shift) {
      const card = document.createElement("div");
      card.className = "shift-event-card";
      card.dataset.event = shift.event;
      card.dataset.rawDate = shift.event_shift_date;
      card.dataset.shift = shift.event_shift;
      const isClosed = shift.act_oper >= shift.nec_oper;
      const closedHTML = isClosed
        ? `<div class="shift-closed">🔒 FECHADO ${shift.nec_oper} OP</div>`
        : '';
      card.innerHTML = `
        <div class="shift-content">
          <div class="shift-row"><span class="label">Data:</span><span class="shift-dates-value">${formatDateWithWeekday(shift.event_shift_date)}</span></div>
          ${closedHTML}
          <div class="shift-row" style="margin-top:4px;"><span class="label">Turno:</span><span class="shift-location-value">${shift.event_shift}</span></div>
          <div class="shift-event-state shift-row" style="display:none; margin-top:4px;">
            <span class="label">Estado:</span>
            <span class="shift-state-value"></span>
          </div>
        </div>
        <button class="shift-add">+</button>
      `;
      const nint = localStorage.getItem("currentCorpNint");
      const corp_oper_nr = localStorage.getItem("currentCorpOperNr");
      const addBtn = card.querySelector('.shift-add');
      const stateDiv = card.querySelector('.shift-event-state');
      if (isClosed) {
        addBtn.textContent = "🔒";
        addBtn.disabled = true;
        addBtn.classList.add('shift-closed-btn');
      }
      try {
        const resp = await fetch(
          `${SUPABASE_URL}/rest/v1/event_disp?select=shift_state&event=eq.${encodeURIComponent(shift.event)}&n_int=eq.${nint}&corp_oper_nr=eq.${corp_oper_nr}&event_shift_date=eq.${shift.event_shift_date}&event_shift=eq.${encodeURIComponent(shift.event_shift)}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await resp.json();
        const stateValue = card.querySelector('.shift-state-value');
        if (!isClosed && data && data.length > 0) {
          const state = data[0].shift_state;
          stateValue.textContent = state;
          stateDiv.style.display = 'flex';
          if (state === "Em Aprovação") {
            addBtn.style.display = 'none';
            stateValue.classList.add('shift-state-pending-approval');
          } else if (state === "Aprovado") {
            addBtn.textContent = "✓";
            addBtn.disabled = true;
            addBtn.classList.add('shift-state-approved');
            stateValue.classList.add('shift-state-approved');
          } else if (state === "Não Aprovado") {
            addBtn.textContent = "X";
            addBtn.disabled = true;
            addBtn.classList.add('shift-state-not-approved');
            stateValue.classList.add('shift-state-not-approved');
          }
        }
      } catch (err) {
        console.error("Erro ao verificar estado do turno:", err);
      }
      if (!isClosed) {
        addBtn.addEventListener('click', () => registerShift(card));
      }
      return card;
    }
    async function showEventShiftCards(eventName) {
      const eventsContainer = document.getElementById('events-container');
      const shiftsContainer = document.getElementById('shifts-container');
      const shiftsList = document.getElementById('shifts-list');
      const backHeader = document.getElementById('back-header');
      eventsContainer.style.display = 'none';
      shiftsContainer.style.display = 'block';
      shiftsList.innerHTML = "";
      backHeader.style.display = 'flex';
      backHeader.onclick = () => {
        shiftsContainer.style.display = 'none';
        eventsContainer.style.display = 'block';
        backHeader.style.display = 'none';
      };
      try {
        const eventResp = await fetch(`${SUPABASE_URL}/rest/v1/event_list?select=*&event=eq.${encodeURIComponent(eventName)}&is_ended=eq.false`, {
          headers: getSupabaseHeaders()
        });
        const eventData = await eventResp.json();
        if (!eventData || eventData.length === 0) {
          shiftsList.innerHTML = '<div class="error-card">Este evento já terminou.</div>';
          return;
        }
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/event_shifts?select=event,event_shift_date,event_shift,nec_oper,act_oper&event=eq.${encodeURIComponent(eventName)}`, {
          headers: getSupabaseHeaders()
        });
        const data = await resp.json();
        if (eventData && eventData.length > 0) {
          const mainEventCard = createMainEventCard(eventData[0]);
          shiftsList.appendChild(mainEventCard);
          const datesDiv = document.createElement('div');
          datesDiv.id = 'event-shifts-title';
          datesDiv.innerHTML = '<span class="material-icons">event</span>Datas';
          shiftsList.appendChild(datesDiv);
        }
        if (!data || !data.length) {
          const noShiftsCard = document.createElement('div');
          noShiftsCard.className = 'empty-card';
          noShiftsCard.textContent = 'Sem turnos registados';
          shiftsList.appendChild(noShiftsCard);
          return;
        }
        data.sort((a, b) => new Date(a.event_shift_date) - new Date(b.event_shift_date));
        const shiftCardsContainer = document.createElement('div');
        shiftCardsContainer.id = 'shift-cards-container';
        shiftsList.appendChild(shiftCardsContainer);
        const shiftCards = await Promise.all(data.map(shift => createEventShiftCards(shift)));
        shiftCards.forEach((card, index) => {
          card.classList.add('fade-in-card');
          shiftCardsContainer.appendChild(card);
          setTimeout(() => card.classList.add('show'), index * 50);
        });
      } catch (err) {
        console.error(err);
        const errorCard = document.createElement('div');
        errorCard.className = 'error-card';
        errorCard.textContent = 'Erro ao carregar turnos';
        shiftsList.innerHTML = "";
        shiftsList.appendChild(errorCard);
      }
    }
    async function registerShift(card) {
      const nint = localStorage.getItem("currentCorpNint");
      const corp_oper_nr = localStorage.getItem("currentCorpOperNr");
      if (!nint || !corp_oper_nr) {
        showToast('Dados de utilizador em falta', 'error');
        return;
      }
      const addBtn = card.querySelector('.shift-add');
      if (addBtn) addBtn.disabled = true;
      const rawDate = card.dataset.rawDate;
      const shift = card.dataset.shift;
      const event = card.dataset.event;
      const stateDiv = card.querySelector('.shift-event-state');
      const stateValue = card.querySelector('.shift-state-value');
      const payload = {n_int: nint, event: event, corp_oper_nr: corp_oper_nr, event_shift_date: rawDate, event_shift: shift, shift_state: 'Em Aprovação'};
      try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/event_disp`, {
          method: 'POST',
          headers: getSupabaseHeaders({returnRepresentation: true}),
          body: JSON.stringify(payload)
        });
        if (!resp.ok) {
          if (addBtn) addBtn.disabled = false;
          showToast('Erro ao gravar disponibilidade', 'error');
          return;
        }
        stateValue.textContent = 'Em Aprovação';
        stateDiv.style.display = 'flex';
        stateValue.classList.remove('shift-state-rejected', 'shift-state-approved');
        stateValue.classList.add('shift-state-pending-approval');
        if (addBtn) addBtn.style.display = 'none';
        showToast('Disponibilidade registada com sucesso!', 'success');
      } catch (err) {
        console.error(err);
        if (addBtn) addBtn.disabled = false;
        showToast('Erro de ligação ao servidor', 'error');
      }
    }
    function showToast(message, type = 'success', duration = 3000) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
      toast.innerHTML = `<span class="icon">${icon}</span><span>${message}</span>`;
      toast.addEventListener('click', () => {
        toast.style.animation = 'toastSlideOut 0.3s forwards ease-in';
        setTimeout(() => toast.remove(), 300);
      });
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) {
          toast.style.animation = 'toastSlideOut 0.3s forwards ease-in';
          setTimeout(() => toast.remove(), 300);
        }
      }, duration);
    }
    /* ============================== INIT =============================== */
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('sgo-theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      }
      loadCorpInfo();
      loadEventList();
    });
  </script>
</body>
