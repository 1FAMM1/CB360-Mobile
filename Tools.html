<!DOCTYPE html>
<html lang="pt-PT" style="background-color: #8b0000;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CB360 Mobile">
  <meta name="theme-color" content="#c62828">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>CB360 Mobile - Ferramentas Úteis</title>
  <style>
    @view-transition {navigation: auto;}
    /* ============================================================
    VARIABLES
    ============================================================ */
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
           --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
           --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
           --header-h: 60px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --blue: #0282fa; --green: #2e7d32; --green-state: #2e7d32; --red-state: #c62828;}
    ::view-transition-old(root), ::view-transition-new(root) {animation-duration: 0.5s;}
    .header, .footer {view-transition-name: none;}
    /* ============================================================
    DARK MODE
    ============================================================ */
    .dark-mode {--bg: #141312; --surface: #1f1e1c; --surface-2: #2a2826; --border: rgba(255, 255, 255, 0.07); --txt-1: #f0ede8; --txt-2: #a09890; --txt-3: #5a5450;
                --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14); --blue: #6cb8ff;
                --green: #66bb6a; --green-state: #66bb6a; --red-state: #ff6b6b;}
    /* ============================================================
    RESET & BASE
    ============================================================ */
    html {scrollbar-width: none; background: var(--red-dark);}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex;
          flex-direction: column; user-select: none; transition: background var(--ease), color var(--ease);}
    /* ============================================================
    HEADER
    ============================================================ */
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}
    .header-center {display: flex; flex-direction: column; align-items: center; gap: 1px;}
    .header-title {font-size: 19px; font-weight: 700; letter-spacing: 1.5px; color: #fff;}
    .header-sub {font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.75); text-transform: uppercase;}
    /* ============================================================
    MAIN CONTENT
    ============================================================ */
    .main-content {flex: 1; width: 100%; max-width: 700px; margin: 0 auto; overflow-y: auto; overflow-x: hidden; padding: calc(var(--header-h) + 14px) 16px calc(var(--footer-h) + 20px);
                   display: flex; flex-direction: column; gap: 30px; background: var(--bg); scrollbar-width: none; transition: background var(--ease);}
    .main-content::-webkit-scrollbar {display: none;}
    /* ============================================================
    SECTION TITLE
    ============================================================ */
    .section-title {display: flex; align-items: center; gap: 8px; font-size: 0.85em; font-weight: 700; letter-spacing: 1px; color: var(--txt-2); text-transform: uppercase; margin-bottom: 10px;}
    .section-title::before {content: ''; width: 3px; height: 13px; border-radius: 2px; background: var(--red); display: inline-block;}
    
    /* ============================================================
    GRID DE 3 COLUNAS (Estilo unificado)
    ============================================================ */
    .forms-buttons {width: 100%; max-width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-lg); 
                    overflow: hidden; box-shadow: var(--sh-md); margin-bottom: 4px;}   
    .forms-btn {position: relative; min-width: 0; max-width: none; min-height: 96px; padding: 12px 6px; border: 0; border-radius: 0; background: var(--surface); color: var(--txt-2);
                font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; display: flex; flex-direction: column; justify-content: center;
                align-items: center; gap: 6px; line-height: 1.2; box-shadow: none; transition: background var(--ease), color var(--ease), transform var(--ease);}
    .forms-btn:hover {background: var(--surface-2); color: var(--txt-1);}
    .forms-btn:active {background: var(--surface-2); transform: scale(.98);}
    .forms-btn.selected {background: var(--red-light); color: var(--red);}
    .forms-btn .emoji-icon {font-size: 24px; transition: transform var(--ease);}
    .forms-btn.selected .emoji-icon {transform: scale(1.1);}
    .forms-btn div.label {position: relative; z-index: 2; line-height: 1.2;}
    .forms-btn:disabled {opacity: 0.3; cursor: not-allowed; pointer-events: none;}
    .forms-btn:disabled *, .forms-btn:disabled .emoji-icon {opacity: 0.3 !important;}
    .forms-btn .material-icons {font-size: 24px; color: var(--red-icon); transition: transform var(--ease), color var(--ease);}    
    .forms-btn:hover .material-icons, .forms-btn.selected .material-icons {transform: scale(1.08);}
    /* ============================================================
    MODAL
    ============================================================ */
    .modal {display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.45); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 20px;}
    .modal.show {display: flex;}
    .modal-content {background: var(--surface); color: var(--txt-1); width: 100%; max-width: 460px; max-height: 78%; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-lg);
                    border: 1px solid var(--border); display: flex; flex-direction: column; animation: modalIn .25s cubic-bezier(.34,1.2,.64,1);}
    .modal-header {background: linear-gradient(to right, var(--red-dark), var(--red)); color: #fff; padding: 15px 18px; display: flex; align-items: center; justify-content: center; font-size: 15px;
                   font-weight: 600; flex-shrink: 0;}
    .modal-body {padding: 20px; max-height: 60vh; overflow-y: auto; color: var(--txt-1); font-size: 14px; line-height: 1.6; text-align: center;}
    .modal-footer {background: var(--surface-2); padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end;}
    .modal-close {background: linear-gradient(to right, var(--red-dark), var(--red)); color: #fff; border: 0; padding: 9px 24px; border-radius: 50px; cursor: pointer; font-family: 'Inter', sans-serif;
                  font-size: 13px; font-weight: 600; transition: opacity var(--ease), transform var(--ease);}
    .modal-close:hover {opacity: .88;}
    .modal-close:active {transform: scale(.98);}
    @keyframes modalIn {from{opacity:0;transform:scale(.95) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)}}
    /* ============================================================
    FOOTER
    ============================================================ */
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 100;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    .footer strong {color: inherit;}
    /* ============================================================
    RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .header-title {font-size: 16px;}
      .main-content {padding-left: 12px; padding-right: 12px;}
      .forms-btn {min-height: 84px; font-size: 11.5px; padding: 8px 4px;}
      .forms-btn .emoji-icon {font-size: 21px;}
    }
    @media (min-width: 769px) {
      .main-content {max-width: 700px;}
    }
  </style>
</head>
<body>
  <header class="header">
    <img id="corpLogo" class="header-logo" alt="" src="">
    <div class="header-center">
      <span class="header-title">FERRAMENTAS ÚTEIS</span>
      <span class="header-sub">Apoio à Decisão</span>
    </div>
    <h2 id="corpInfo" style="display: none;"></h2>
  </header>
  <div class="main-content">
    <div>
      <div class="section-title">Guias de Comando</div>
      <div class="forms-buttons">
        <button class="forms-btn" onclick="showEmDesenvolvimento()">
          <span class="material-icons">warning</span>
          <div class="label">Matérias Perigosas</div>
        </button>
        <button class="forms-btn" onclick="showEmDesenvolvimento()">
          <span class="material-icons">local_shipping</span>
          <div class="label">Acidentes</div>
        </button>
        <button class="forms-btn" onclick="showEmDesenvolvimento()">
          <span class="material-icons">domain</span>
          <div class="label">Incêndios Estruturais</div>
        </button>
        <button class="forms-btn" onclick="toggleButton(this); setTimeout(() => window.location.href='GCIncRural.html', 300);">
          <span class="material-icons">local_fire_department</span>
          <div class="label">Incêndios Florestais</div>
        </button>
        <button class="forms-btn" onclick="showEmDesenvolvimento()">
          <span class="material-icons">assignment</span>
          <div class="label">SICAC</div>
        </button>
      </div>
    </div>
    <div>
      <div class="section-title">Formulários NRBQ</div>
      <div class="forms-buttons">
        <button class="forms-btn" onclick="showEmDesenvolvimento()">
          <span class="material-icons">notification_important</span>
          <div class="label">Notificação Inicial</div>
        </button>
        <button class="forms-btn" onclick="showEmDesenvolvimento()">
          <span class="material-icons">visibility</span>
          <div class="label">Reconhecimento</div>
        </button>
        <button class="forms-btn" onclick="showEmDesenvolvimento()">
          <span class="material-icons">medical_services</span>
          <div class="label">Intervenção</div>
        </button>
      </div>
    </div>
    <div>
      <div class="section-title">Outras Ferramentas</div>
      <div class="forms-buttons">
        <button class="forms-btn" onclick="toggleButton(this); setTimeout(() => window.location.href='DecirTeam.html', 300);">
          <span class="material-icons">group</span>
          <div class="label">Equipa(s) DECIR</div>
        </button>
      </div>
    </div>
  </div>
  <div id="emDesenvolvimentoModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">🚧 Em Desenvolvimento</div>
      <div class="modal-body">
        Esta funcionalidade ainda está em desenvolvimento.<br>
        Por favor, verifique mais tarde.
      </div>
      <div class="modal-footer">
        <button class="modal-close" onclick="closeModal('emDesenvolvimentoModal')">Fechar</button>
      </div>
    </div>
  </div>
  <footer class="footer">
    <div class="footer-content">
      <div class="powered-by">
        Powered by Fábio Martins · Sistemas de Informação · Grupo CB360
      </div>
      <div class="footer-year">
        © 2023–2025 · Sistema CB360 Mobile
      </div>
    </div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('App pronta: ', reg.scope))
          .catch(err => console.log('Erro no motor da App: ', err));
      });
    }
  </script>
  <script>
    /* ===================== SUPABASE CONFIGURATION ====================== */
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';
    function getCorp() {return localStorage.getItem("currentCorpOperNr")}
    function getNInt() {return localStorage.getItem("currentCorpNint")}
    function getSupabaseHeaders(options = {}) {
      const corp = getCorp();
      const nint = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    /* ========================= MODAL FUNCTIONS ========================= */
    function showEmDesenvolvimento() {
      showModal('emDesenvolvimentoModal');
    }
    function showModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.add('show');
        document.body.style.overflow = 'hidden';
        if (navigator.vibrate) navigator.vibrate(50);
      }
    }
    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.remove('show');
        document.body.style.overflow = 'auto';
      }
    }
    /* ======================= CORPORATION LOADING ======================= */
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }
    /* ========================== BUTTON TOOGLE ========================== */
    function toggleButton(button) {
      const allButtons = document.querySelectorAll('.forms-btn');
      allButtons.forEach(btn => {
        if (btn !== button) {
          btn.classList.remove('selected');
        }
      });
      button.classList.add('selected');
      if (navigator.vibrate) {
        navigator.vibrate(100);
      }
      setTimeout(() => {
        button.classList.remove('selected');
      }, 2000);
    }
    function clearAllSelections() {
      document.querySelectorAll('.forms-btn').forEach(btn => btn.classList.remove('selected'));
    }    
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('sgo-theme');
      if (savedTheme === 'dark') document.body.classList.add('dark-mode');      
      loadCorpInfo();      
      document.addEventListener('touchstart', function(event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
    });    
    window.addEventListener('click', event => {
      const isButtonClick = event.target.closest('.forms-btn');
      if (!isButtonClick) clearAllSelections();
    });
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
