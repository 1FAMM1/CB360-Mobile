        /* ============================================================
        RESET & BASE
        ============================================================ */
        html {scrollbar-width: none; background: var(--red-dark);}
        * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
        body {font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; user-select: none; transition: background var(--ease), color var(--ease);}
        /* ============================================================
        HEADER
        ============================================================ */
        .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center; justify-content: center; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}

        MAIN CONTENT

        .main-content {flex: 1; overflow-y: auto; overflow-x: hidden; padding-top: calc(var(--header-h) + 0px); padding-bottom: calc(var(--footer-h) + 5px); padding-left: 16px; padding-right: 16px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 9px; transition: padding-top 0.5s cubic-bezier(0.4, 0, 0.2, 1);}

        .main-content.slide-out, .main-content.slide-in {transform: none;}
        .scales-header {flex-shrink: 0; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: flex-start;}

        .scales-btn div, .scales-btn span {position: relative; z-index: 2; line-height: 1.2;}
        .btn-back-wrapper {display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; width: 100%;}
        .btn-back-wrapper.show {grid-template-rows: 1fr;}
        .btn-back-wrapper.no-transition {transition: none !important;}
        .btn-back-wrapper.no-transition .btn-back {transition: none !important;}

        .btn-back {display: inline-flex; align-items: center; justify-content: flex-start; gap: 5px; background: var(--surface); color: var(--txt-1); border: 1px solid var(--border); padding: 8px 16px; border-radius: var(--r-sm); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: var(--sh-sm); opacity: 0; pointer-events: none; transition: opacity 0.25s ease, background var(--ease), transform var(--ease);}

        .attendance-stat {flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 6px 6px 10px; border-radius: var(--r-sm); background: var(--surface-2); border-left: 3px solid transparent;}

        .day-chip.type-D {background: linear-gradient(135deg, #fbc02d, #f9a825); color: #212121;}
        .day-chip.type-N {background: linear-gradient(135deg, #3949ab, #2c387e, #1a237e); color: #fff;}
        .day-chip.type-M {background: linear-gradient(135deg, #00897b, #00695c); color: #fff;}
        .day-chip.past {background: linear-gradient(135deg, #9e9e9e, #757575) !important; color: #fff !important;}
        .modal-group-title {display: flex; align-items: center; gap: 8px; margin-top: 4px; padding: 7px 10px; border-radius: 10px; border-left: 4px solid var(--gc); background: var(--surface-2); background: color-mix(in srgb, var(--gc) 14%, transparent); color: var(--txt-1); font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase;}

        ============================================================ */

        .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center; justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 100;}

        @keyframes fadeInSoft {from {opacity: 0; transform: translateY(-6px);} to {opacity: 1; transform: translateY(0);}}
        /* ============================================================
        RESPONSIVE
        ============================================================ */
        @media (max-width: 480px) {

        }
        @media (min-width: 769px) {
          .main-content {max-width: 700px; margin: 0 auto; width: 100%;}
        }      
      </style>
    </head>

          const fixed = [{month: 1, day: 1, name: "Ano Novo"}, {month: 4, day: 25, name: "Dia da Liberdade"}, {month: 5, day: 1, name: "Dia do Trabalhador"}, {month: 6, day: 10, name: "Dia de Portugal"},

          const mun = rhMunicipalHoliday();

        function calcCargaMensal(year, month) {

          const mandatorySet = new Set(getPortugalHolidays(year).filter(h => !h.optional).map(h => toLocalYMD(h.date)));
          let workingDays = 0;
          for (let d = 1; d <= daysInMonth; d++) {

          rows.forEach(r => { byDay[Number(r.day)] = String(r.shift || "").trim().toUpperCase(); });

                flagsByNInt[n].optel = true;
              }
              if (s.is_eip === true) {
                flagsByNInt[n].eip = true;
              }
            });
            const nInts = [
              ...new Set(
                servData
                .map(s => normalizeNInt(s.n_int))
                .filter(Boolean)
              )
            ];
            if (!nInts.length) return [];
            const nIntsPadded = [
              ...new Set(nInts.map(n => n.padStart(3, "0")))
            ];
            const elemUrl =
              `${SUPABASE_URL}/rest/v1/reg_elems?` +
              `select=n_int,full_name,patent,photo_url` +
              `&n_int=in.(${nIntsPadded.join(",")})` +
              `&corp_oper_nr=eq.${corpOperNr}`;
            const elemResponse = await fetch(elemUrl, {
              headers: getSupabaseHeaders()
            });
            if (!elemResponse.ok) {
              console.error("[CB360] Erro ao carregar elementos:", await elemResponse.text());
              return [];
            }
            const allElements = await elemResponse.json();
            if (!Array.isArray(allElements)) return [];
            const teamByNInt = {};
            try {
              const teamResp = await fetch(
                `${SUPABASE_URL}/rest/v1/reg_employees?` +
                `select=n_int,team` +
                `&n_int=in.(${nInts.join(",")})` +
                `&corp_oper_nr=eq.${corpOperNr}`,
                {headers: getSupabaseHeaders()}
              );
              if (teamResp.ok) {
                (await teamResp.json()).forEach(t => {
                  teamByNInt[normalizeNInt(t.n_int)] =
                    String(t.team || "")
                    .trim()
                    .toUpperCase();
                });
              } else {
                console.error("[CB360] Erro ao carregar equipas:", await teamResp.text());
              }
            } catch (err) {
              console.error("[CB360] Erro ao carregar equipas:", err);
            }
            allElements.forEach(e => {
              const n = normalizeNInt(e.n_int);
              e.serviceValue = valueByNInt[n] || null;
              e.team = teamByNInt[n] || "";
              e.isOptel = !!(flagsByNInt[n] && flagsByNInt[n].optel);
              e.isEip = !!(flagsByNInt[n] && flagsByNInt[n].eip);
            });
            const patentOrder = ["Chefe", "Subchefe", "Bombeiro(a) 1ª", "Bombeiro(a) 2ª", "Bombeiro(a) 3ª", "Estagiário(a)", "Bº Especialista"];
            allElements.sort((a, b) => {
              const indexA = patentOrder.indexOf(a.patent);
              const indexB = patentOrder.indexOf(b.patent);
              const orderA = indexA === -1 ? 999 : indexA;
              const orderB = indexB === -1 ? 999 : indexB;
              if (orderA !== orderB) {
                return orderA - orderB;
              }
              return Number(a.n_int) - Number(b.n_int);
            });
            return allElements;
          } catch (err) {
            console.error("[CB360] Erro ao buscar elementos:", err);
            return [];
          }
        }
        const patenteLogos = {"Comandante": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/Comandante.png",
                              "2º Comandante": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/2%20Comandante.png",
                              "Adj. de Comando": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/Adj.%20Comando.png",

                              "Subchefe": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/Subchefe.png",
                              "Bombeiro(a) 1ª": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/B1C.png",
                              "Bombeiro(a) 2ª": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/B2C.png",
                              "Bombeiro(a) 3ª": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/B3C.png",
                              "Estagiário(a)": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/Est..png",
                              "Bº Especialista": "https://rjkbodfqsvckvnhjwmhg.supabase.co/storage/v1/object/public/cb_logos/Esp.png",};
        const serviceColors = {
          D: {bg: 'linear-gradient(135deg, #fbc02d, #f9a825)', text: '#212121'},
          N: {bg: 'linear-gradient(135deg, #3949ab, #2c387e, #1a237e)', text: '#fff'},
          M: {bg: 'linear-gradient(135deg, #00897b, #00695c)', text: '#fff'}
        };
        const modalGroups = [
        {title: 'INEM', prefix: 'EQ', icon: 'medical_services', color: '#f9a825', on: '#212121'},
          {title: 'GERAL', prefix: 'TDNU', icon: 'security', color: '#1565c0'},
          {title: 'OPTEL', prefix: 'OPC', icon: 'cell_tower', color: '#8e24aa'},
          {title: 'EIP', prefix: 'EIP', icon: 'local_fire_department', color: '#c62828'}
        ];
        const modalGroupOther = {title: 'OUTROS', icon: 'groups', color: '#757575'};
        function groupOfTeam(team) {
          const t = String(team || '').toUpperCase();
          const g = modalGroups.find(g => t.startsWith(g.prefix));
          return g ? g.title : 'OUTROS';
        }
        function groupsOfElement(e) {
          const g = [];
          if (e.isOptel) g.push('OPTEL');
          if (e.isEip) g.push('EIP');
          return g.length ? g : [groupOfTeam(e.team)];
        }
        function openServiceModal(title, elements) {
          const modal = document.getElementById('serviceModal');
          const container = document.getElementById('modalElementsContainer');
          const modalTitle = document.getElementById('modalTitle');
          modalTitle.textContent = title;
          modal.style.display = 'flex';
          container.innerHTML = '';
          if (elements === null) {
            container.innerHTML = `
              <div style="display: flex; justify-content: center; align-items: center; padding: 40px;">
                <div class="loading-spinner"></div>
                <span style="margin-left: 10px;">A carregar elementos...</span>
              </div>
            `;
            return;
          }
          if (!elements || elements.length === 0) {
            const p = document.createElement('p');
            p.textContent = 'Nenhum elemento encontrado';
            p.style.color = 'var(--txt-1)';
            p.style.textAlign = 'center';
            p.style.padding = '40px';
            container.appendChild(p);
            return;
          }
          [...modalGroups, modalGroupOther].forEach(group => {
            const list = elements.filter(e => groupsOfElement(e).includes(group.title));
            if (!list.length) return;
            const h = document.createElement('div');
            h.className = 'modal-group-title';
            h.style.setProperty('--gc', group.color);
            h.style.setProperty('--gc-on', group.on || '#fff');
            h.innerHTML = `<span class="material-icons">${group.icon}</span><span>${group.title}</span><span class="mg-count">${list.length}</span>`;
            container.appendChild(h);
            list.forEach(e => {
              const card = document.createElement('div');
              card.className = 'element-card';
              card.style.position = 'relative';
              const avatar = document.createElement('img');
              avatar.className = 'element-avatar';
              mobileLoadPhoto(avatar, e.photo_url, 'https://www.gravatar.com/avatar/?d=mp');
              avatar.alt = e.full_name || 'Avatar';
              const info = document.createElement('div');
              info.className = 'element-info';
              info.innerHTML = `
                <span class="element-name">${e.full_name || 'N/D'}</span>
                <span>${e.patent || 'N/D'}</span>
              `;
              const patenteImg = document.createElement('img');
              patenteImg.src = patenteLogos[e.patent] || '';
              patenteImg.alt = e.patent || '';
              patenteImg.style.width = '30px';
              patenteImg.style.height = '30px';
              patenteImg.style.objectFit = 'contain';
              patenteImg.style.marginLeft = 'auto';
              card.appendChild(avatar);
              card.appendChild(info);
              card.appendChild(patenteImg);
              if (e.serviceValue) {
                const badge = document.createElement('span');
                badge.textContent = e.serviceValue;
                const colorInfo = serviceColors[e.serviceValue] || { bg: 'var(--red)', text: '#fff' };
                badge.style.cssText = `position: absolute; top: -6px; right: -6px; background: ${colorInfo.bg}; color: ${colorInfo.text}; font-size: 10px; font-weight: 700;
                                       padding: 3px 7px; border-radius: 10px; box-shadow: var(--sh-sm); letter-spacing: 0.3px;`;
                card.appendChild(badge);
              }
              container.appendChild(card);
            });
          });
        }
        document.getElementById('modalFooterClose').addEventListener('click', () => {
          document.getElementById('serviceModal').style.display = 'none';
        });
        /* ===================== LOAD NEXT SERVICES UNIFIED ==================== */
        async function loadNextServicesUnified(selectedMonth, scaleAlreadyValidated = false) {
          const corpOperNr = localStorage.getItem("currentCorpOperNr");
          const nintCorp = validateCorpData();
          const container = document.getElementById("nextServicesCard");
          const title = document.getElementById("nextserv-info-title");
          container.innerHTML = "";
          container.style.display = "none";
          title.style.display = "none";
          if (!nintCorp || !corpOperNr) return;
          const now = new Date();
          const year = getWorkYear(selectedMonth);
          const month = selectedMonth + 1;
          const currentYear = now.getFullYear();
          const currentMonth = now.getMonth() + 1;
          const isFutureMonth = year > currentYear || (year === currentYear && month > currentMonth);
          if (isFutureMonth && !scaleAlreadyValidated) {
            const validation = await isMonthScaleValidated(selectedMonth);
            if (!validation.validated) {
              console.warn("[CB360] Próximos serviços bloqueados: escala futura não validada.");
              return;
            }
          }
          const shiftsToCount = {D: ["D", "M"], N: ["N"], M: ["M", "D"]};
          const shiftEndHour = {D: 20, N: 8, M: 17};
          const normalizeNInt = n => String(n ?? "")
            .trim()
            .replace(/^0+(?=\d)/, "");
          const fetchAllRows = async (url, pageSize = 1000) => {
            const rows = [];
            for (let from = 0; ; from += pageSize) {
              const res = await fetch(url, {
                headers: {...getSupabaseHeaders(), "Range-Unit": "items", Range: `${from}-${from + pageSize - 1}`}
              });
              if (!res.ok) {
                console.error("[CB360] Erro na contagem:", await res.text());
                throw new Error("Erro ao consultar a contagem dos elementos.");
              }
              const page = await res.json();
              rows.push(...page);
              if (page.length < pageSize) break;
            }
            return rows;
          };
          try {
            const urlShifts =
              `${SUPABASE_URL}/rest/v1/reg_employee_shifts?` +
              `select=day,month,year,shift` +
              `&n_int=eq.${nintCorp}` +
              `&corp_oper_nr=eq.${corpOperNr}` +
              `&month=eq.${month}` +
              `&year=eq.${year}` +
              `&shift=in.(D,N,M)` +
              `&order=day.asc`;
            const responseShifts = await fetch(urlShifts, {
              headers: getSupabaseHeaders()
            });
            if (!responseShifts.ok) {
              console.error("[CB360] Erro ao carregar próximos turnos:", await responseShifts.text());
              return;
            }
            const dataShifts = await responseShifts.json();
            const monthsCard = document.querySelector(".months-card");
            if (monthsCard && monthsCard.style.display !== "none") {
              return;
            }
            const services = dataShifts.map(d => ({day: Number(d.day), month: Number(d.month), year: Number(d.year), value: String(d.shift).trim().toUpperCase()}));
            const uniqueServices = new Map();
            services.forEach(service => {
              const key =
                `${service.year}-${service.month}-${service.day}-${service.value}`;
              if (!uniqueServices.has(key)) {
                uniqueServices.set(key, service);
              }
            });
            const nextServices = [...uniqueServices.values()]
              .filter(service => {
                const currentMonth = now.getMonth() + 1;
                const currentYear = now.getFullYear();
                const isPreviousMonth = service.year < currentYear ||(service.year === currentYear && service.month < currentMonth);
                if (isPreviousMonth) return true;
                const end = new Date(service.year, service.month - 1, service.day, shiftEndHour[service.value], 0, 0, 0);
                if (service.value === "N") {end.setDate(end.getDate() + 1);}
                return end > now;
              })
            .sort((a, b) => a.day - b.day);
            if (!nextServices.length) return;
            const firstDay = nextServices[0].day;
            const countUrl =
              `${SUPABASE_URL}/rest/v1/reg_employee_shifts?` +
              `select=day,shift,n_int` +
              `&corp_oper_nr=eq.${corpOperNr}` +
              `&month=eq.${month}` +
              `&year=eq.${year}` +
              `&day=gte.${firstDay}` +
              `&shift=in.(D,N,M)` +
              `&order=day.asc,n_int.asc,shift.asc`;
            const monthRows = await fetchAllRows(countUrl);
            if (monthsCard && monthsCard.style.display !== "none") {
              return;
            }
            const grouped = new Map();
            for (const r of monthRows) {
              const nInt = normalizeNInt(r.n_int);
              if (!nInt) continue;
              const key = `${Number(r.day)}|${String(r.shift).trim().toUpperCase()}`;
              if (!grouped.has(key)) {
                grouped.set(key, new Set());
              }
              grouped.get(key).add(nInt);
            }
            const countFor = service => {
              const allowed = shiftsToCount[service.value] || [];
              const union = new Set();
              for (const s of allowed) {
                const set = grouped.get(`${service.day}|${s}`);
                if (set) {
                  set.forEach(n => union.add(n));
                }
              }
              return union.size;
            };
            title.style.display = "block";
            container.style.display = "block";
            nextServices.forEach((service, index) => {
              container.appendChild(
                createServiceCard({day: service.day, month: service.month, year: service.year, value: service.value, totalElements: countFor(service)}, index)
              );
            });
          } catch (err) {
            console.error("[CB360] Erro ao carregar próximos serviços:", err);
            container.innerHTML = "";
            container.style.display = "none";
            title.style.display = "none";
          }
        }
        function toggleMobileMonthLayout(active) {
          if (window.innerWidth > 480) return Promise.resolve();
          const body = document.body;
          const main = document.querySelector('.main-content');
          if (!main) return Promise.resolve();
          return new Promise(resolve => {
            const topOffset = 70;
            const currentScroll = main.scrollTop;
            main.classList.remove('slide-in');
            main.classList.add('slide-out');
            setTimeout(() => {
              if (active) {
                body.classList.add('mobile-month-active');
              } else {
                body.classList.remove('mobile-month-active');
              }
              main.classList.remove('slide-out');
              main.classList.add('slide-in');
              const targetScroll = currentScroll;
              main.scrollTo({top: targetScroll, behavior: 'smooth'});
              setTimeout(() => {
                main.classList.remove('slide-in');
                resolve();
              }, 350);
            }, 50);
          });
        }
        /* ========================== INITIALIZATION ========================== */
        document.addEventListener('DOMContentLoaded', function() {
          loadCorpInfo();
          const savedTheme = localStorage.getItem('sgo-theme');
          if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
          }
          let selectedMonth = null;
          let currentFetchRequestId = 0;
          const monthsCard = document.querySelector(".months-card");
          const btnBack = document.getElementById("btnBackToMonths");
          const btnBackWrapper = document.getElementById("btnBackWrapper");
          const scalesSubtitle = document.getElementById("scalesSubtitle");
          const scalesHeader = document.querySelector(".scales-header");
          const mainContent = document.querySelector(".main-content");
          const selectedMonthIcon = document.getElementById("selectedMonthIcon");
          const selectedMonthName = document.getElementById("selectedMonthName");
          function applyMonthsCentering() {
            if (window.innerWidth > 480) {
              mainContent.style.paddingTop = "";
              return;
            }
            const headerH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--header-h")) || 60;
            const footerH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--footer-h")) || 50;
            const contentHeight = (scalesHeader ? scalesHeader.offsetHeight : 0) + (monthsCard ? monthsCard.offsetHeight : 0) + 4;
            const availableHeight = window.innerHeight - headerH - footerH;
            const extra = Math.max(18, (availableHeight - contentHeight) / 2);
            mainContent.style.paddingTop = `calc(var(--header-h) + ${extra}px)`;
          }
          function hideBackButtonInstant() {
            btnBackWrapper.classList.add("no-transition");
            btnBackWrapper.classList.remove("show");
            void btnBackWrapper.offsetHeight;
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                btnBackWrapper.classList.remove("no-transition");
              });
            });
          }
          function hideAllServiceCards() {
            document.getElementById("attendanceCard").style.display = "none";
            document.getElementById("servicesCard").style.display = "none";
            document.getElementById("ServicesSection").style.display = "none";
            document.getElementById("nextServicesCard").style.display = "none";
            document.getElementById("nextserv-info-title").style.display = "none";
            const noServicesCard = document.getElementById("noServicesCard");
            if (noServicesCard) noServicesCard.remove();
          }
          function resetToMonthsView() {
            currentFetchRequestId++;
            selectedMonth = null;
            document.querySelectorAll(".scales-btn").forEach(b => b.classList.remove("selected"));
            hideBackButtonInstant();
            hideAllServiceCards();
            monthsCard.style.display = "block";
            if (scalesSubtitle) scalesSubtitle.style.display = "block";
            toggleMobileMonthLayout(false);
            requestAnimationFrame(() => applyMonthsCentering());
          }
          btnBack.addEventListener("click", resetToMonthsView);
          requestAnimationFrame(() => applyMonthsCentering());
          window.addEventListener("resize", () => {
            if (selectedMonth === null) applyMonthsCentering();
          });
          document.querySelectorAll(".scales-btn").forEach(btn => {
            btn.addEventListener("click", async () => {
              const month = parseInt(btn.dataset.month, 10);
              const requestId = ++currentFetchRequestId;
              document.querySelectorAll(".scales-btn").forEach(b => {b.classList.remove("selected");});
              btn.classList.add("selected");
              selectedMonth = month;
              const btnIconText = btn.querySelector(".material-icons")
                ? btn.querySelector(".material-icons").textContent
                : "";
              const btnNameText = btn.querySelector("div")
                ? btn.querySelector("div").textContent
                : "";
              if (selectedMonthIcon) {
                selectedMonthIcon.textContent = btnIconText;
              }
              if (selectedMonthName) {
                selectedMonthName.textContent = btnNameText;
              }
              monthsCard.style.display = "none";
              if (scalesSubtitle) {
                scalesSubtitle.style.display = "none";
              }
              hideBackButtonInstant();
              mainContent.style.paddingTop = "";
              await toggleMobileMonthLayout(true);
              hideAllServiceCards();
              if (requestId !== currentFetchRequestId) return;
              const today = new Date();
              const currentMonth = today.getMonth();
              const currentYear = today.getFullYear();
              const targetYear = getWorkYear(month);
              const targetMonth = month + 1;
              const isFutureMonth = targetYear > currentYear || (targetYear === currentYear && targetMonth > currentMonth + 1);
              const validation = isFutureMonth
                ? await isMonthScaleValidated(month)
                : {validated: true, error: false};
              if (requestId !== currentFetchRequestId) return;
              btnBackWrapper.classList.add("show");
              const showInformation = (message) => {
                const oldCard = document.getElementById("noServicesCard");
                if (oldCard) oldCard.remove();
                const mainContainer = document.querySelector(".main-content");
                const card = document.createElement("div");
                card.id = "noServicesCard";
                card.className = "scales-card";
                card.style.marginTop = "0px";
                card.innerHTML = `
                  <span class="card-title"
                    style="display:flex;align-items:center;justify-content:center;gap:6px;">
                    <span class="material-icons"
                      style="font-size:18px;color:var(--red-icon);">
                      info
                    </span>
                    Informação
                  </span>
                  <span class="values" style="margin-top:4px;">
                    ${message}
                  </span>
                `;
                mainContainer.appendChild(card);
              };
              if (validation.error) {
                showInformation("Não foi possível verificar a emissão da escala. Por favor, tente novamente mais tarde.");
                return;
              }
              if (!validation.validated) {
                showInformation("A escala deste mês ainda não foi emitida pelo Departamento de Recursos Humanos.");
                return;
              }
              await loadServicesMonth(month, true);
              if (requestId !== currentFetchRequestId) return;
              updateSectionDividers();
              await loadNextServicesUnified(month, true);
              if (requestId !== currentFetchRequestId) return;
              const hasServices = document.getElementById("ServicesSection").style.display !== "none";
              const hasNext = document.getElementById("nextServicesCard").style.display !== "none" && document.getElementById("nextServicesCard").children.length > 0;
              if (!hasServices && !hasNext) {
                document.getElementById("nextserv-info-title").style.display = "none";
                showInformation("Nenhum serviço registado neste mês.");
              }
            });
          });            
        });
    <\/script>

</script>
