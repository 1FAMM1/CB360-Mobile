<!DOCTYPE html>
<html lang="pt-PT" style="background-color: #d32f2f;">
<head>
  <script>
    (function() {
      try {
        if (localStorage.getItem('sgo-theme') === 'dark') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CB360 Mobile">
  <meta name="theme-color" content="#d32f2f">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>CB360 Mobile - Comunicados</title>
  <style>
    @view-transition {navigation: auto;}
    /* ============================================================
    VARIABLES
    ============================================================ */
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
           --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
           --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
           --header-h: 60px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --blue: #0282fa; --green: #2e7d32; --green-state: #2e7d32; --red-state: #c62828;}
    ::view-transition-old(root), ::view-transition-new(root) {animation-duration: 0.5s;}
    .header, .footer {view-transition-name: none;}
    /* ============================================================
    DARK MODE
    ============================================================ */
    .dark-mode {--bg: #141312; --surface: #1f1e1c; --surface-2: #2a2826; --border: rgba(255, 255, 255, 0.07); --txt-1: #f0ede8; --txt-2: #a09890; --txt-3: #5a5450;
                --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14); --blue: #6cb8ff;
                --green: #66bb6a; --green-state: #66bb6a; --red-state: #ff6b6b;}
    /* ============================================================
    RESET & BASE
    ============================================================ */
    html {scrollbar-width: none; background: var(--red-dark);}
    html, body {overscroll-behavior: none;}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex;
          flex-direction: column; user-select: none; transition: background var(--ease), color var(--ease); padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);}
    /* ============================================================
    HEADER
    ============================================================ */
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}
    .header-center {display: flex; flex-direction: column; align-items: center; gap: 1px;}
    .header-title {font-size: 19px; font-weight: 700; letter-spacing: 1.5px; color: #fff;}
    .header-sub {font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.75); text-transform: uppercase;}
    /* ============================================================
    MAIN CONTENT
    ============================================================ */
    .main-content {flex: 1; width: 100%; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; padding-top: calc(var(--header-h) + 14px);
                   background: var(--bg); transition: background var(--ease);}
    .section-title {display: flex; align-items: center; gap: 8px; font-size: 0.9em; font-weight: 700; letter-spacing: 1px; color: var(--txt-2); text-transform: uppercase; margin: 0 16px 12px;}
    .section-title::before {content: ''; width: 3px; height: 13px; border-radius: 2px; background: var(--red); display: inline-block;}
    /* ============================================================
    COMMUNICATIONS LIST
    ============================================================ */
    .communications-list-container {flex: 1; overflow-y: auto; padding: 0 16px; padding-bottom: 20px; scrollbar-width: none; -ms-overflow-style: none;}
    .communications-list-container::-webkit-scrollbar {display: none;}
    .communications-list {display: flex; flex-direction: column; gap: 8px;}
    .comun-card {background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px; display: flex; align-items: center; gap: 12px;
                 box-shadow: var(--sh-sm); cursor: pointer; transition: background var(--ease), box-shadow var(--ease), transform var(--ease);}
    .comun-card:hover {background: var(--surface-2); box-shadow: var(--sh-md);}
    .comun-card:active {transform: scale(.99);}
    .comun-icon-wrap {flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px; background: var(--red-light); display: flex; align-items: center; justify-content: center;}
    .comun-icon-wrap .material-icons {font-size: 20px; color: var(--red-state);}
    .comun-icon-wrap.read {background: rgba(46, 125, 50, 0.12);}
    .comun-icon-wrap.read .material-icons {color: var(--green-state);}
    .comun-title {font-size: 13.5px; font-weight: 600; color: var(--txt-1); flex: 1; min-width: 0;}
    .empty-card {text-align: center; font-weight: 700; padding: 20px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--txt-2); box-shadow: var(--sh-sm);}
    /* ============================================================
    PDF VIEWER
    ============================================================ */
    #pdf-viewer-container {position: fixed; left: 0; right: 0; display: none; flex-direction: column; background: var(--bg); z-index: 999;}
    #pdf-viewer-header {background: linear-gradient(to right, var(--red-dark), var(--red)); color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 10px; justify-content: space-between;}
    #pdf-controls {display: flex; gap: 8px; align-items: center;}
    #pdf-controls button {background: rgba(255,255,255,0.2); border: none; color: #fff; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: background var(--ease);}
    #pdf-controls button:hover {background: rgba(255,255,255,0.3);}
    #pdf-controls span {font-size: 13px; min-width: 44px; text-align: center; font-weight: 600;}
    #pdf-viewer {flex: 1; overflow: auto; background: var(--surface-2); padding: 12px; text-align: center; scrollbar-width: none;}
    #pdf-viewer::-webkit-scrollbar {display: none;}
    /* ============================================================
    FOOTER
    ============================================================ */
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 1000;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    .footer strong {color: inherit;}
    /* ============================================================
    RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .header-title {font-size: 16px;}
      .communications-list-container {padding: 0 12px;}
      .section-title {margin-left: 12px; margin-right: 12px;}
    }
    @media (min-width: 769px) {
      .main-content {max-width: 700px;}
    }
  </style>
</head>
<body>
  <header class="header">
    <img id="corpLogo" class="header-logo" alt="" src="">
    <div class="header-center">
      <span class="header-title">COMUNICADOS</span>
      <span class="header-sub">Visualização de Comunicados</span>
    </div>
    <h2 id="corpInfo" style="display: none;"></h2>
  </header>
  <div class="main-content">
    <div class="section-title"><span class="material-icons" style="font-size:1.1em; color:var(--red-icon);">campaign</span>Lista de Comunicados</div>
    <div class="communications-list-container">
      <div id="communications-list" class="communications-list"></div>
    </div>
    <div id="pdf-viewer-container">
      <div id="pdf-viewer-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="material-icons" style="cursor:pointer" id="pdf-back-btn">arrow_back</span>
          <span id="pdf-title" style="font-weight:600; font-size:14px;"></span>
        </div>
        <div id="pdf-controls">
          <button id="zoom-out">−</button>
          <span id="zoom-level">100%</span>
          <button id="zoom-in">+</button>
        </div>
      </div>
      <div id="pdf-viewer"></div>
    </div>
  </div>
  <footer class="footer">
    <div class="footer-content">
      <div class="powered-by">
        Powered by Fábio Martins · Sistemas de Informação · Grupo CB360
      </div>
      <div class="footer-year">
        © 2023–2025 · Sistema CB360 Mobile
      </div>
    </div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('App pronta: ', reg.scope))
          .catch(err => console.log('Erro no motor da App: ', err));
      });
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    /* ===================== SUPABASE CONFIGURATION ====================== */
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';
    function getCorp() {return localStorage.getItem("currentCorpOperNr");}
    function getNInt() {return localStorage.getItem("currentCorpNint");}
    function getSupabaseHeaders(options = {}) {
      const corp = getCorp();
      const nint = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    /* ======================= CORPORATION LOADING ======================= */
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }
    /* ===================== PRESS RELEASES LOADING ====================== */
    function markAsRead(url) {
      let viewedDocs = JSON.parse(localStorage.getItem("viewed_communications") || "[]");
      if (!viewedDocs.includes(url)) {
        viewedDocs.push(url);
        localStorage.setItem("viewed_communications", JSON.stringify(viewedDocs));
      }
    }
    async function loadComunicates() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const list = document.getElementById("communications-list");
      list.innerHTML = "<p style='text-align:center; padding:20px; color:var(--txt-2);'>A carregar comunicados...</p>";
      const viewedDocs = JSON.parse(localStorage.getItem("viewed_communications") || "[]");
      try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/serv_comun?select=comun_title,comun_url&corp_oper_nr=eq.${corpOperNr}&order=created_at.desc`, {
          headers: getSupabaseHeaders()
        });
        const comunicados = await resp.json();
        list.innerHTML = "";
        if (!Array.isArray(comunicados) || comunicados.length === 0) {
          list.innerHTML = `<div class="empty-card">Sem comunicados disponíveis</div>`;
          return;
        }
        comunicados.forEach(comun => {
          if (!comun.comun_url) return;
          const publicUrl = comun.comun_url.startsWith('http') ? comun.comun_url :
          `${SUPABASE_URL}/storage/v1/object/public/cb_pdf/${comun.comun_url}`;
          const isRead = viewedDocs.includes(publicUrl);
          const card = document.createElement("div");
          card.className = "comun-card";
          card.innerHTML = `
            <div class="comun-icon-wrap ${isRead ? 'read' : ''}">
              <span class="material-icons">${isRead ? 'check_circle' : 'picture_as_pdf'}</span>
            </div>
            <div class="comun-title">${comun.comun_title}</div>
          `;
          card.onclick = () => {
            markAsRead(publicUrl);
            const iconWrap = card.querySelector('.comun-icon-wrap');
            iconWrap.classList.add('read');
            iconWrap.querySelector('.material-icons').innerText = 'check_circle';
            openPdfViewer(publicUrl, comun.comun_title);
          };
          list.appendChild(card);
        });
      } catch (err) {
        list.innerHTML = `<div class="empty-card">Erro ao carregar comunicados</div>`;
      }
    }
    let currentScale = 3.0;
    let currentPdf = null;
    let pinchScale = 1;
    let lastPinchDistance = 0;
    let isPinching = false;
    async function openPdfViewer(pdfUrl, title) {
      const viewerContainer = document.getElementById("pdf-viewer-container");
      const pdfViewer = document.getElementById("pdf-viewer");
      const pdfTitle = document.getElementById("pdf-title");
      const commListContainer = document.querySelector(".communications-list-container");
      const commTitle = document.querySelector(".section-title");
      const header = document.querySelector(".header");
      const footer = document.querySelector(".footer");
      const headerHeight = header.offsetHeight;
      const footerHeight = footer.offsetHeight;
      viewerContainer.style.top = `${headerHeight}px`;
      viewerContainer.style.bottom = `${footerHeight}px`;
      commListContainer.style.display = "none";
      commTitle.style.display = "none";
      viewerContainer.style.display = "flex";
      pdfTitle.textContent = title;
      pdfViewer.innerHTML = "<p style='text-align:center; padding:20px;'>A carregar PDF...</p>";
      currentScale = 0.75;
      pinchScale = 1;
      updateZoomLevel();
      setupPinchZoom(pdfViewer);
      document.getElementById("pdf-back-btn").onclick = () => {
        viewerContainer.style.display = "none";
        commListContainer.style.display = "block";
        if (commTitle) commTitle.style.display = "flex";
        currentPdf = null;
      };
      try {
        currentPdf = await pdfjsLib.getDocument(pdfUrl).promise;
        await renderPdf();
      } catch (err) {
        pdfViewer.innerHTML = "<p style='text-align:center; font-weight:bold; padding:20px; color:var(--red);'>Não foi possível carregar o PDF.</p>";
      }
    }
    /* =========================== ZOOM PINCH ============================ */
    function setupPinchZoom(element) {
      let initialPinchCenter = {x: 0, y: 0};
      let scrollAtStart = {x: 0, y: 0};
      element.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isPinching = true;
          lastPinchDistance = getPinchDistance(e.touches);
          scrollAtStart.x = element.scrollLeft;
          scrollAtStart.y = element.scrollTop;
          const rect = element.getBoundingClientRect();
          initialPinchCenter.x = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
          initialPinchCenter.y = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        }
      });
      element.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && isPinching) {
          e.preventDefault();
          const distance = getPinchDistance(e.touches);
          const ratio = distance / lastPinchDistance;
          pinchScale *= ratio;
          pinchScale = Math.max(0.5, Math.min(6, pinchScale));
          const canvases = element.querySelectorAll('canvas');
          canvases.forEach(canvas => {
            const rect = canvas.getBoundingClientRect();
            const originX = ((initialPinchCenter.x - (rect.left - element.getBoundingClientRect().left)) / rect.width) * 100;
            const originY = ((initialPinchCenter.y - (rect.top - element.getBoundingClientRect().top)) / rect.height) * 100;
            canvas.style.transform = `scale(${pinchScale})`;
            canvas.style.transformOrigin = `${originX}% ${originY}%`;
          });
          updateZoomLevel(currentScale * pinchScale);
          lastPinchDistance = distance;
        }
      }, {
        passive: false
      });
      element.addEventListener('touchend', async (e) => {
        if (isPinching && e.touches.length < 2) {
          isPinching = false;
          const oldScale = currentScale;
          currentScale = currentScale * pinchScale;
          currentScale = Math.max(0.5, Math.min(8.0, currentScale));
          const scaleChange = currentScale / oldScale;
          const pinchDocX = scrollAtStart.x + initialPinchCenter.x;
          const pinchDocY = scrollAtStart.y + initialPinchCenter.y;
          pinchScale = 1;
          await renderPdf();
          element.scrollLeft = pinchDocX * scaleChange - initialPinchCenter.x;
          element.scrollTop = pinchDocY * scaleChange - initialPinchCenter.y;
          updateZoomLevel(currentScale);
        }
      });
    }
    function getPinchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }
    async function renderPdf() {
      if (!currentPdf) return;
      const pdfViewer = document.getElementById("pdf-viewer");
      const tempContainer = document.createElement('div');
      try {
        for (let i = 1; i <= currentPdf.numPages; i++) {
          const page = await currentPdf.getPage(i);
          const canvas = document.createElement('canvas');
          canvas.style.marginBottom = "10px";
          canvas.style.display = "block";
          canvas.style.marginLeft = "auto";
          canvas.style.marginRight = "auto";
          canvas.style.boxShadow = "0 4px 8px rgba(0,0,0,0.15)";
          canvas.style.borderRadius = "8px";
          const ctx = canvas.getContext('2d');
          const viewport = page.getViewport({
            scale: currentScale
          });
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          await page.render({
            canvasContext: ctx,
            viewport: viewport
          }).promise;
          tempContainer.appendChild(canvas);
        }
        pdfViewer.innerHTML = "";
        pdfViewer.appendChild(tempContainer);
      } catch (err) {
        pdfViewer.innerHTML = "<p style='color:var(--red);'>Erro ao renderizar páginas.</p>";
      }
    }
    function updateZoomLevel(scale) {
      const finalScale = scale || currentScale;
      const zoomPercent = Math.round((finalScale / 1.5) * 100);
      document.getElementById("zoom-level").textContent = zoomPercent + "%";
    }
    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('sgo-theme') === 'dark') document.body.classList.add('dark-mode');
      document.getElementById("zoom-in").onclick = async () => {
        if (currentPdf && currentScale < 7.5) {
          currentScale += 0.50;
          updateZoomLevel();
          await renderPdf();
        }
      };
      document.getElementById("zoom-out").onclick = async () => {
        if (currentPdf && currentScale > 0.5) {
          currentScale -= 0.50;
          updateZoomLevel();
          await renderPdf();
        }
      };
      loadCorpInfo();
      loadComunicates();
    });
  </script>
</body>
</html>
