<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CB360 Mobile">
  <meta name="theme-color" content="#c62828">
  <title>CB360 Mobile - Disponibilidades Piquetes</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
    VARIABLES (alinhadas com a página Escalas)
    ============================================================ */
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
           --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
           --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
           --header-h: 60px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --blue: #0282fa;}
    /* ============================================================
    DARK MODE
    ============================================================ */
    .dark-mode {--bg: #141312; --surface: #1f1e1c; --surface-2: #2a2826; --border: rgba(255, 255, 255, 0.07); --txt-1: #f0ede8; --txt-2: #a09890; --txt-3: #5a5450; --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14); --blue: #6cb8ff;}
    /* ============================================================
    RESET & BASE
    ============================================================ */
    html {scrollbar-width: none; background: var(--red-dark);}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; user-select: none; transition: background var(--ease), color var(--ease);}
    /* ============================================================
    HEADER
    ============================================================ */
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center; justify-content: center; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}
    .header-center {display: flex; flex-direction: column; align-items: center; gap: 1px;}
    .header-title {font-size: 19px; font-weight: 700; letter-spacing: 1.5px; color: #fff;}
    .header-sub {font-size: 9.5px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.75); text-transform: uppercase;}
    /* ============================================================
    MAIN CONTENT
    ============================================================ */
    .main-content {flex: 1; overflow-y: auto; overflow-x: hidden; padding-top: calc(var(--header-h) + 18px); padding-bottom: calc(var(--footer-h) + 18px); padding-left: 16px; padding-right: 16px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; transition: padding-top 0.5s cubic-bezier(0.16, 1, 0.3, 1);}
    .main-content::-webkit-scrollbar {display: none;}
    body.mobile-month-active .main-content {padding-top: calc(var(--header-h) + 8px);}
    .main-content.content-blur {filter: blur(2px); pointer-events: none;}
    .availability-pik-header {flex-shrink: 0; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: flex-start;}
    .availability-pik-card {flex-shrink: 0;}
    .availability-pik-info-title {flex-shrink: 0;}
    .availability-pik-subtitle {display: flex; align-items: center; justify-content: center; gap: 5px; background: var(--surface); color: var(--txt-1); border: 1px solid var(--border); padding: 8px 16px; border-radius: var(--r-sm); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; box-shadow: var(--sh-sm); transition: background var(--ease), transform var(--ease); margin: 0 auto 0 auto;}
    /* ============================================================
    MONTH BUTTONS (mesmo estilo grid-card / mbtn da página Escalas)
    ============================================================ */
    .months-card {background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-md); overflow: hidden; width: 100%; margin-bottom: 0px; flex-shrink: 0;}
    .availability-pik-buttons {display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); width: 100%;}
    .availability-pik-btn {position: relative; background: var(--surface); border: none; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 14px 8px; min-height: 64px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--txt-2); cursor: pointer; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; line-height: 1.2; transition: background var(--ease), color var(--ease);}
    .availability-pik-btn:nth-child(3n) {border-right: none;}
    .availability-pik-btn:nth-child(n+10) {border-bottom: none;}
    .availability-pik-btn:hover:not(.selected) {background: var(--surface-2); color: var(--txt-1);}
    .availability-pik-btn:active:not(.selected) {background: var(--surface-2);}
    .availability-pik-btn .material-icons {font-size: 22px; color: var(--red-icon); transition: color var(--ease), transform var(--ease);}
    .availability-pik-btn:hover .material-icons {transform: scale(1.08);}
    .availability-pik-btn.selected {background: var(--red-light); color: var(--red);}
    .availability-pik-btn.selected .material-icons {color: var(--red); transform: scale(1.1);}
    .availability-pik-btn div, .availability-pik-btn span {position: relative; z-index: 2; line-height: 1.2;}
    /* ============================================================
    CALENDAR CARD
    ============================================================ */
    .collapse-wrapper {display: grid; grid-template-rows: 0fr; opacity: 0; transform: translateY(-10px); width: 100%; transition: grid-template-rows 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);}
    .collapse-wrapper > * {min-height: 0; overflow: hidden;}
    .collapse-wrapper.show {grid-template-rows: 1fr; opacity: 1; transform: translateY(0);}
    .collapse-wrapper.legend-wrapper {transition-delay: 0.06s;}
    .calendar-container {background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--red); border-right: 4px solid var(--red); border-radius: var(--r-md); box-shadow: var(--sh-sm); padding: 14px; width: 100%; max-width: 100%;}
    .calendar-header {text-align: center; font-size: 14px; font-weight: 700; color: var(--red); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; letter-spacing: 0.3px; transition: color var(--ease), border-color var(--ease);}
    .calendar-grid {display: grid; grid-template-columns: repeat(7, minmax(30px, 1fr)); gap: 5px;}
    .calendar-day-header {text-align: center; font-weight: 700; padding: 6px 0; font-size: 11px; color: var(--txt-3);}
    .calendar-day {text-align: center; padding: 9px 0; border-radius: var(--r-sm); background: var(--surface-2); font-size: 12.5px; color: var(--txt-1); cursor: pointer; transition: background var(--ease), transform 0.15s ease, color var(--ease);}
    .calendar-day:hover {background: var(--red-light); color: var(--red); transform: scale(1.05);}
    .calendar-day.empty {background: transparent; cursor: default;}
    .calendar-day.empty:hover {transform: none; background: transparent;}
    .calendar-day.today {background: var(--red-dark); color: #fff; font-weight: 700; border: 2px solid #e67e22;}
    .calendar-day.selected {background: linear-gradient(135deg, var(--blue), #1aa9c5); color: #fff; font-weight: 700; border: 2px solid #1aa9c5;}
    .calendar-day.selected.today {background: linear-gradient(135deg, #27ae60, #1e8449); border: 2px solid #f39c12;}
    .calendar-day.processing {opacity: 0.55; pointer-events: none;}
    /* ============================================================
    LEGEND
    ============================================================ */
    .calendar-legend {width: 100%; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--sh-sm); display: flex; justify-content: center; align-items: center; padding: 10px 16px; gap: 30px; font-size: 12.5px;}
    .legend-item {display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--txt-2); font-weight: 600;}
    .legend-color {width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; border: 1px solid var(--border);}
    .legend-color.pick {background: linear-gradient(135deg, var(--blue), #1aa9c5);}
    /* ============================================================
    TOAST
    ============================================================ */
    .toast {position: fixed; bottom: calc(var(--footer-h) + 30px); left: 50%; transform: translateX(-50%) translateY(10px); background: linear-gradient(to right, var(--red-dark), var(--red)); color: #fff; padding: 14px 22px; border-radius: var(--r-md); box-shadow: var(--sh-lg); font-size: 13.5px; font-weight: 600; width: 90%; max-width: 380px; text-align: center; z-index: 9999; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease;}
    .toast.show {opacity: 1; transform: translateX(-50%) translateY(0);}
    /* ============================================================
    FOOTER
    ============================================================ */
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center; justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 100;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    /* ============================================================
    RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .header-title {font-size: 16px;}
      .availability-pik-subtitle {font-size: 0.95em;}
      .availability-pik-btn {min-height: 56px; font-size: 10.5px; padding: 10px 6px;}
      .availability-pik-btn .material-icons {font-size: 19px;}
      .main-content {padding-left: 14px; padding-right: 14px;}
    }
    @media (min-width: 769px) {
      .main-content {max-width: 700px; margin: 0 auto; width: 100%;}
    }
  </style>
</head>
<body>
  <header class="header">
    <img id="corpLogo" class="header-logo" alt="" style="display:none;"
         onerror="console.error('❌ Logo: falha ao carregar imagem, URL:', this.src); this.style.display='none';"
         onload="this.style.display='block';">
    <div class="header-center">
      <span class="header-title">DISPONIBILIDADES</span>
      <span class="header-sub">Piquetes</span>
    </div>
    <h2 id="corpInfo" style="display: none;"></h2>
  </header>
  <div class="main-content">
    <div class="availability-pik-header">
      <p class="availability-pik-subtitle">Selecione o mês e dias:</p>
    </div>
    <div class="months-card">
      <div class="availability-pik-buttons">
        <button class="availability-pik-btn" data-month="0" onclick="showCalendar(0, this)"><span class="material-icons">ac_unit</span><div>Janeiro</div></button>
        <button class="availability-pik-btn" data-month="1" onclick="showCalendar(1, this)"><span class="material-icons">favorite</span><div>Fevereiro</div></button>
        <button class="availability-pik-btn" data-month="2" onclick="showCalendar(2, this)"><span class="material-icons">eco</span><div>Março</div></button>
        <button class="availability-pik-btn" data-month="3" onclick="showCalendar(3, this)"><span class="material-icons">local_florist</span><div>Abril</div></button>
        <button class="availability-pik-btn" data-month="4" onclick="showCalendar(4, this)"><span class="material-icons">wb_sunny</span><div>Maio</div></button>
        <button class="availability-pik-btn" data-month="5" onclick="showCalendar(5, this)"><span class="material-icons">beach_access</span><div>Junho</div></button>
        <button class="availability-pik-btn" data-month="6" onclick="showCalendar(6, this)"><span class="material-icons">local_fire_department</span><div>Julho</div></button>
        <button class="availability-pik-btn" data-month="7" onclick="showCalendar(7, this)"><span class="material-icons">whatshot</span><div>Agosto</div></button>
        <button class="availability-pik-btn" data-month="8" onclick="showCalendar(8, this)"><span class="material-icons">park</span><div>Setembro</div></button>
        <button class="availability-pik-btn" data-month="9" onclick="showCalendar(9, this)"><span class="material-icons">cloud</span><div>Outubro</div></button>
        <button class="availability-pik-btn" data-month="10" onclick="showCalendar(10, this)"><span class="material-icons">grain</span><div>Novembro</div></button>
        <button class="availability-pik-btn" data-month="11" onclick="showCalendar(11, this)"><span class="material-icons">celebration</span><div>Dezembro</div></button>
      </div>
    </div>
    <div id="calendarOuter" class="collapse-wrapper">
      <div id="calendarContainer" class="calendar-container">
        <div class="calendar-header" id="calendarHeader"></div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </div>
    <div id="legendOuter" class="collapse-wrapper legend-wrapper">
      <div id="legend" class="calendar-legend">
        <div class="legend-item">
          <span class="legend-color pick"></span>
          <span class="legend-text">PIQUETE</span>
        </div>
      </div>
    </div>
  </div>
  <footer class="footer">
    <div class="footer-content">
      <div class="powered-by">
        Powered by Fábio Martins · Sistemas de Informação · Grupo CB360
      </div>
      <div class="footer-year">
        © 2023–2025 · Sistema CB360 Mobile
      </div>
    </div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('App pronta: ', reg.scope))
          .catch(err => console.log('Erro no motor da App: ', err));
      });
    }
  </script>
  <script>
    /* ===================== SUPABASE CONFIGURATION ====================== */
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';
    function getCorp() {return localStorage.getItem("currentCorpOperNr");}
    function getNInt() {return localStorage.getItem("currentCorpNint");}
    function getSupabaseHeaders(options = {}) {
      const corp = getCorp();
      const nint = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    /* ===================== UTILITY FUNCTIONS ===================== */
    function getWorkYear(selectedMonthIndex) {
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      if (currentMonth === 11 && selectedMonthIndex === 0 && now.getDate() >= 15) {
        return currentYear + 1;
      }
      return currentYear;
    }
    function isPastMonth(selectedMonthIndex, selectedYear) {
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      return selectedYear < currentYear || (selectedYear === currentYear && selectedMonthIndex < currentMonth);
    }
    /* ======================= CORPORATION LOADING ======================= */
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }
    /* ========================== GLOBAL STATE =========================== */
    let currentMonthIndex = null;
    let selectedDays = [];
    let isLoadingCalendar = false;
    let allowPiqPastMonthsEdit = false;
    /* ========================== LOADING DAYS =========================== */
    async function loadSelectedDaysFromSupabase(monthIndex) {
      const nint = localStorage.getItem("currentCorpNint");
      const corp = (localStorage.getItem("currentCorpOperNr")).padStart(4, "0");
      if (!nint || !corp) return [];
      const month = monthIndex + 1;
      const year = getWorkYear(monthIndex);
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/reg_serv?select=day&n_int=eq.${nint}&corp_oper_nr=eq.${corp}&month=eq.${month}&year=eq.${year}&value=eq.PN`, {
          headers: getSupabaseHeaders()
        });
        const data = await res.json();
        return data.map(d => `${year}-${String(month).padStart(2, '0')}-${String(d.day).padStart(2, '0')}`);
      } catch (err) {
        console.error('Erro ao ler dias selecionados:', err);
        return [];
      }
    }
    /* ==================== MOBILE MONTH TRANSITION ==================== */
    function toggleMobileMonthLayout(active) {
      if (window.innerWidth > 480) return Promise.resolve();
      return new Promise(resolve => {
        if (active) {
          document.body.classList.add('mobile-month-active');
        } else {
          document.body.classList.remove('mobile-month-active');
        }
        setTimeout(resolve, 500);
      });
    }
    /* ============================ CALENDAR ============================= */
    async function showCalendar(monthIndex, button) {
      if (isLoadingCalendar) return;
      const calendarContainer = document.getElementById('calendarContainer');
      const calendarOuter = document.getElementById('calendarOuter');
      const legendOuter = document.getElementById('legendOuter');
      isLoadingCalendar = true;
      if (currentMonthIndex === monthIndex && button.classList.contains('selected')) {
        button.classList.remove('selected');
        calendarOuter.classList.remove('show');
        legendOuter.classList.remove('show');
        currentMonthIndex = null;
        toggleMobileMonthLayout(false);
        if (window.applyMonthsCentering) window.applyMonthsCentering();
        await new Promise(resolve => setTimeout(resolve, 500));
        isLoadingCalendar = false;
        return;
      }
      currentMonthIndex = monthIndex;
      document.querySelectorAll('.availability-pik-btn').forEach(btn => btn.classList.remove('selected'));
      calendarOuter.classList.remove('show');
      legendOuter.classList.remove('show');
      const mainContentEl = document.querySelector('.main-content');
      if (mainContentEl) mainContentEl.style.paddingTop = "";
      button.classList.add('selected');
      const year = getWorkYear(monthIndex);
      const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
      const dayNames = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
      const firstDay = new Date(year, monthIndex, 1);
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const startingDayOfWeek = firstDay.getDay();
      const calendarHeader = document.getElementById('calendarHeader');
      const calendarGrid = document.getElementById('calendarGrid');
      calendarHeader.textContent = `${monthNames[monthIndex]} ${year}`;
      calendarGrid.innerHTML = '';
      dayNames.forEach(day => {
        const div = document.createElement('div');
        div.className = 'calendar-day-header';
        div.textContent = day;
        calendarGrid.appendChild(div);
      });
      for (let i = 0; i < startingDayOfWeek; i++) {
        const empty = document.createElement('div');
        empty.className = 'calendar-day empty';
        calendarGrid.appendChild(empty);
      }
      /* Constrói a grelha completa (números + clique) de imediato, para nunca
         mostrar um calendário vazio enquanto se aguarda o Supabase. */
      const today = new Date();
      const dayElementsByDate = {};
      for (let day = 1; day <= daysInMonth; day++) {
        const dayElement = document.createElement('div');
        dayElement.className = 'calendar-day';
        dayElement.textContent = day;
        const dateStr = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        if (year === today.getFullYear() && monthIndex === today.getMonth() && day === today.getDate()) {
          dayElement.classList.add('today');
        }
        dayElement.onclick = () => handleDayClick(day, dateStr, dayElement);
        calendarGrid.appendChild(dayElement);
        dayElementsByDate[dateStr] = dayElement;
      }
      toggleMobileMonthLayout(true);
      calendarOuter.classList.add('show');
      legendOuter.classList.add('show');
      calendarOuter.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      const requestedMonth = monthIndex;
      selectedDays = await loadSelectedDaysFromSupabase(monthIndex);
      if (currentMonthIndex !== requestedMonth) { isLoadingCalendar = false; return; }
      selectedDays.forEach(dateStr => {
        const el = dayElementsByDate[dateStr];
        if (el) el.classList.add('selected');
      });
      isLoadingCalendar = false;
    }
    /* ======================== HANDLE DAY CLICK ========================= */
    async function handleDayClick(day, dateStr, element) {
      const year = getWorkYear(currentMonthIndex);
      const month = currentMonthIndex + 1;
      const nint = localStorage.getItem("currentCorpNint");
      const corp = (localStorage.getItem("currentCorpOperNr")).padStart(4, "0");
      if (!allowPiqPastMonthsEdit) {
        if (isPastMonth(currentMonthIndex, year)) return showToast("Não permitido alterar meses passados.");
        if (currentMonthIndex === new Date().getMonth() && year === new Date().getFullYear()) {
          return showToast("Não pode efetuar alteração às disponibilidades do mês atual. Use a opção TROCAS DE SERVIÇO para efetuar uma troca com outro Bombeiro.");
        }
      }
      if (selectedDays.includes(dateStr)) {
        element.classList.add('processing');
        try {
          const query = `n_int=eq.${nint}&corp_oper_nr=eq.${corp}&month=eq.${month}&day=eq.${day}&value=eq.PN`;
          await Promise.all([
            fetch(`${SUPABASE_URL}/rest/v1/reg_serv?${query}`, {method: 'DELETE', headers: getSupabaseHeaders()}),
            fetch(`${SUPABASE_URL}/rest/v1/reg_disp?${query}`, {method: 'DELETE', headers: getSupabaseHeaders()})
          ]);
          selectedDays = selectedDays.filter(d => d !== dateStr);
          element.classList.remove('selected', 'processing');
        } catch (err) {
          showToast("Erro ao remover disponibilidade.");
        }
        return;
      }
      const success = await saveDayToPiqDisp(day);
      if (success) {
        selectedDays.push(dateStr);
        element.classList.add('selected');
      }
    }
    /* ============================== SAVE =============================== */
    async function saveDayToPiqDisp(day) {
      const year = getWorkYear(currentMonthIndex);
      const month = currentMonthIndex + 1;
      const nint = parseInt(localStorage.getItem("currentCorpNint"), 10) || 0;
      const corp = (localStorage.getItem("currentCorpOperNr")).padStart(4, "0");
      try {
        const checkServ = await fetch(`${SUPABASE_URL}/rest/v1/reg_serv?select=value&n_int=eq.${nint}&day=eq.${day}&month=eq.${month}&year=eq.${year}&value=in.(EN,ET)`, {
          headers: getSupabaseHeaders()
        });
        const servData = await checkServ.json();
        if (servData.length > 0) return showToast(`ATENÇÃO! Já deu disponibilidade para ECIN Noite no dia (${day}/${month}). Não pode dar disponibilidade para PIQUETE.`);
        const checkDisp = await fetch(`${SUPABASE_URL}/rest/v1/reg_disp?select=value&n_int=eq.${nint}&day=eq.${day}&month=eq.${month}&year=eq.${year}&value=in.(ET,PN)`, {
          headers: getSupabaseHeaders()
        });
        const dispData = await checkDisp.json();
        if (dispData.length > 0) return showToast(`ATENÇÃO! Já deu disponibilidade para ECIN Noite no dia (${day}/${month}). Não pode dar disponibilidade para PIQUETE.`);
        const userRes = await fetch(`${SUPABASE_URL}/rest/v1/reg_elems?select=abv_name,section&n_int=eq.${nint}`, {
          headers: getSupabaseHeaders()
        });
        const userData = await userRes.json();
        const { abv_name = "N/D", section = "N/D" } = userData[0] || {};
        const payloadServ = { n_int: nint, abv_name, section, day, month, year, value: "PN", corp_oper_nr: corp };
        const payloadDisp = { n_int: nint, day, month, year, value: "PN", corp_oper_nr: corp };
        const [res1, res2] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/reg_serv`, {
            method: "POST",
            headers: getSupabaseHeaders({returnRepresentation: true}),
            body: JSON.stringify(payloadServ)
          }),
          fetch(`${SUPABASE_URL}/rest/v1/reg_disp`, {
            method: "POST",
            headers: getSupabaseHeaders({returnRepresentation: true}),
            body: JSON.stringify(payloadDisp)
          })
        ]);
        if (res1.ok && res2.ok) {
          return true;
        } else {
          const errorText = await res2.text();
          console.error("Erro Supabase:", errorText);
          showToast("Erro ao gravar na base de dados.");
          return false;
        }
      } catch (err) {
        console.error("Erro na função saveDayToPiqDisp:", err);
        return false;
      }
    }
    /* ============================== TOAST ============================== */
    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      const content = document.querySelector(".main-content");
      document.body.appendChild(toast);
      if (content) content.classList.add("content-blur");
      setTimeout(() => toast.classList.add("show"), 50);
      setTimeout(() => {
        toast.classList.remove("show");
        if (content) content.classList.remove("content-blur");
        setTimeout(() => toast.remove(), 300);
      }, 4500);
    }
    /* ============================== INIT =============================== */
    document.addEventListener('DOMContentLoaded', () => {
      loadCorpInfo();
      const savedTheme = localStorage.getItem('sgo-theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      }
      const monthsCard = document.querySelector('.months-card');
      const pikHeader = document.querySelector('.availability-pik-header');
      const mainContent = document.querySelector('.main-content');
      window.applyMonthsCentering = function applyMonthsCentering() {
        if (window.innerWidth > 480) {
          mainContent.style.paddingTop = "";
          return;
        }
        if (currentMonthIndex !== null) return;
        const headerH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--header-h")) || 60;
        const footerH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--footer-h")) || 50;
        const contentHeight = (pikHeader ? pikHeader.offsetHeight : 0) + (monthsCard ? monthsCard.offsetHeight : 0) + 4;
        const availableHeight = window.innerHeight - headerH - footerH;
        const extra = Math.max(18, (availableHeight - contentHeight) / 2);
        mainContent.style.paddingTop = `calc(var(--header-h) + ${extra}px)`;
      };
      requestAnimationFrame(() => window.applyMonthsCentering());
      window.addEventListener('resize', () => {
        if (currentMonthIndex === null) window.applyMonthsCentering();
      });
    });
  </script>
</body>
