<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">  
  <meta name="apple-mobile-web-app-title" content="CB360 Mobile">
  <meta name="theme-color" content="#c62828">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>CB360 Mobile - Visualização Disponibilidades</title>
  <style>
    /* ============================================================
    VARIABLES (alinhadas com a página Escalas / Disponibilidades Piquetes)
    ============================================================ */
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
           --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
           --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
           --header-h: 60px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --blue: #0282fa;}
    /* ============================================================
    DARK MODE
    ============================================================ */
    .dark-mode {--bg: #141312; --surface: #1f1e1c; --surface-2: #2a2826; --border: rgba(255, 255, 255, 0.07); --txt-1: #f0ede8; --txt-2: #a09890; --txt-3: #5a5450;
                --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14); --blue: #6cb8ff;}
    /* ============================================================
    RESET & BASE
    ============================================================ */
    html {scrollbar-width: none; background: var(--red-dark);}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
         user-select: none; transition: background var(--ease), color var(--ease);}
    /* ============================================================
    HEADER
    ============================================================ */
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}
    .header-center {display: flex; flex-direction: column; align-items: center; gap: 1px;}
    .header-title {font-size: 19px; font-weight: 700; letter-spacing: 1.5px; color: #fff;}
    .header-sub {font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.75); text-transform: uppercase;}
    /* ============================================================
    MAIN CONTENT
    ============================================================ */
    .main-content {flex: 1; overflow-y: auto; overflow-x: hidden; padding-top: calc(var(--header-h) + 18px); padding-bottom: calc(var(--footer-h) + 18px); padding-left: 16px; padding-right: 16px;
                   display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px;
                   transition: padding-top 0.9s cubic-bezier(0.4, 0, 0.2, 1);}
    .main-content::-webkit-scrollbar {display: none;}
    body.mobile-month-active .main-content {padding-top: calc(var(--header-h) + 8px); justify-content: flex-start !important; align-items: stretch !important;}
    .main-content.slide-out, .main-content.slide-in {transform: none;}
    .main-content.content-blur {filter: blur(2px); pointer-events: none;}
    .availability-view-header {flex-shrink: 0; text-align: center; width: 100%;}
    .availability-view-subtitle {font-size: 1.1em; font-weight: 600; color: var(--txt-2); transition: color var(--ease);}
    /* ============================================================
    MONTH BUTTONS
    ============================================================ */
    .months-card {background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-md); overflow: hidden; width: 100%; margin-bottom: 4px; flex-shrink: 0;}
    .availability-view-buttons {display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); width: 100%;}
    .availability-view-btn {position: relative; background: var(--surface); border: none; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
                 padding: 14px 8px; min-height: 64px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--txt-2);
                 cursor: pointer; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
                 line-height: 1.2; transition: background var(--ease), color var(--ease);}
    .availability-view-btn:nth-child(3n) {border-right: none;}
    .availability-view-btn:nth-child(n+10) {border-bottom: none;}
    .availability-view-btn:hover:not(.selected) {background: var(--surface-2); color: var(--txt-1);}
    .availability-view-btn:active:not(.selected) {background: var(--surface-2);}
    .availability-view-btn .material-icons {font-size: 22px; color: var(--red-icon); transition: color var(--ease), transform var(--ease);}
    .availability-view-btn:hover .material-icons {transform: scale(1.08);}
    .availability-view-btn.selected {background: var(--red-light); color: var(--red);}
    .availability-view-btn.selected .material-icons {color: var(--red); transform: scale(1.1);}
    .availability-view-btn div, .availability-view-btn span {position: relative; z-index: 2; line-height: 1.2;}
    /* ============================================================
    CALENDAR CARD
    ============================================================ */
    .calendar-container {background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--red); border-right: 4px solid var(--red); border-radius: var(--r-md);
                         box-shadow: var(--sh-sm); padding: 14px; width: 100%; max-width: 100%; display: none; flex-shrink: 0;}
    .calendar-container.show {display: block; animation: slideDown 0.3s ease;}
    .calendar-header {text-align: center; font-size: 14px; font-weight: 700; color: var(--red); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px;
                      letter-spacing: 0.3px; transition: color var(--ease), border-color var(--ease);}
    .calendar-grid {display: grid; grid-template-columns: repeat(7, minmax(30px, 1fr)); gap: 5px;}
    .calendar-day-header {text-align: center; font-weight: 700; padding: 6px 0; font-size: 11px; color: var(--txt-3);}
    .calendar-day {text-align: center; padding: 9px 0; border-radius: var(--r-sm); background: var(--surface-2); font-size: 12.5px; color: var(--txt-1); cursor: pointer;
                   transition: background var(--ease), transform 0.15s ease, color var(--ease);}
    .calendar-day:hover {background: var(--surface); transform: scale(1.05);}
    .calendar-day.empty {background: transparent; cursor: default;}
    .calendar-day.empty:hover {transform: none;}
    .calendar-day.today {background: var(--red-dark); color: #fff; font-weight: 700; border: 2px solid #f1c40f;}
    .calendar-day.selected {background-color: var(--blue); color: #fff; font-weight: 700;}
    .calendar-day.selected.today {background-color: #27ae60; border: 2px solid #f39c12;}
    /* ============================================================
    CALENDAR DAY TYPES (cores semânticas fixas)
    ============================================================ */
    .calendar-day.type-pn {background: linear-gradient(135deg, #3ad0ec, #28c0de, #1aa9c5); color: white; font-weight: bold; border: 2px solid #1aa9c5;}
    .calendar-day.type-pn:hover {background: linear-gradient(135deg, #5adbf2, #28c0de, #159bb5); box-shadow: 0 4px 12px rgba(40, 192, 222, 0.6); transform: scale(1.05);}
    .calendar-day.type-ed {background: linear-gradient(135deg, #ffd54f, #ffca28, #ffa726); color: #4e342e; font-weight: bold; border: 2px solid #ffb300;}
    .calendar-day.type-ed:hover {background: linear-gradient(135deg, #ffe082, #ffd54f, #ffb300); box-shadow: 0 4px 12px rgba(255, 193, 7, 0.55); transform: scale(1.05);}    
    .calendar-day.type-en {background: linear-gradient(135deg, #3949ab, #2c387e, #1a237e); color: white; font-weight: bold; border: 2px solid rgba(255, 255, 255, 0.2);} 
    .calendar-day.type-en:hover {background: linear-gradient(135deg, #5c6bc0, #303f9f, #1a237e); box-shadow: 0 4px 14px rgba(26, 35, 126, 0.6);transform: scale(1.05);}
    .calendar-day.type-et {background: linear-gradient(135deg, #ab47bc, #9c27b0, #8e24aa); color: white; font-weight: bold; border: 2px solid rgba(255, 255, 255, 0.2);}
    .calendar-day.type-et:hover {background: linear-gradient(135deg, #b156c7, #9c27b0, #8e24aa); box-shadow: 0 4px 12px rgba(156, 39, 176, 0.5); transform: scale(1.05);}
    .calendar-day.type-ep {background: linear-gradient(135deg, #e68900, #d97a00, #c86c00); color: white;  font-weight: bold; border: 2px solid rgba(255, 255, 255, 0.2);}
    .calendar-day.type-ep:hover {background: linear-gradient(135deg, #f29300, #e68900, #d97a00); box-shadow: 0 4px 12px rgba(184, 108, 0, 0.5); transform: scale(1.05);}
    .calendar-day.type-ex {background: linear-gradient(135deg, #d32f2f, #b71c1c, #9c0f0f); color: white; font-weight: bold; border: 2px solid rgba(255, 255, 255, 0.2);}
    .calendar-day.type-ex:hover {background: linear-gradient(135deg, #e53935, #d32f2f, #b71c1c); box-shadow: 0 4px 12px rgba(211, 47, 47, 0.5); transform: scale(1.05);}
    /* ============================================================
    LEGEND CARD
    ============================================================ */
    .calendar-legend {display: none; width: 100%; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--sh-sm);
                      justify-content: center; align-items: center; padding: 10px 16px; gap: 30px; font-size: 12.5px; flex-shrink: 0;}
    .calendar-legend.show {display: flex;}
    .legend-item {display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--txt-2); font-weight: 600;}
    .legend-color {width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; border: 1px solid var(--border);}
    .legend-color.type-pn {background: linear-gradient(135deg, #3ad0ec, #28c0de, #1aa9c5); border-color: rgba(255, 255, 255, 0.05);}
    .legend-color.type-ed {background: linear-gradient(135deg, #ffd54f, #ffca28, #ffa726); border-color: rgba(255, 255, 255, 0.05);}
    .legend-color.type-en {background: linear-gradient(135deg, #3949ab, #2c387e, #1a237e); border-color: rgba(255, 255, 255, 0.05);}
    .legend-color.type-et {background: linear-gradient(135deg, #ab47bc, #9c27b0, #8e24aa); border-color: rgba(255, 255, 255, 0.05);}
    .legend-color.type-ep {background: linear-gradient(135deg, #e68900, #d97a00, #c86c00); border-color: rgba(255, 255, 255, 0.05);}
    .legend-color.type-ex {background: linear-gradient(135deg, #d32f2f, #b71c1c, #9c0f0f); border-color: rgba(255, 255, 255, 0.05);}
    /* ============================================================
    SHIFT SELECTION MODAL
    ============================================================ */
    .disp-modal {position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;}
    .disp-modal.show {display: flex;}
    .disp-modal-content {background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 340px; box-shadow: var(--sh-lg); border: 1px solid var(--border);
                         display: flex; flex-direction: column; overflow: hidden; animation: mIn 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);}
    @keyframes mIn {from {opacity: 0; transform: scale(0.95) translateY(10px);} to {opacity: 1; transform: scale(1) translateY(0);}}
    .disp-modal-header {background: linear-gradient(to right, var(--red-dark), var(--red)); color: #fff; padding: 15px 18px; font-size: 15px; font-weight: 600; text-align: center; flex-shrink: 0;}
    .disp-modal-body {padding: 20px 18px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;}
    .disp-btn {flex: 1 1 45%; padding: 14px 0; font-size: 12.5px; font-weight: 700; border-radius: var(--r-sm); border: 2px solid transparent; cursor: pointer; transition: transform var(--ease), box-shadow var(--ease); text-transform: uppercase;}
    .disp-btn:hover {transform: scale(1.05); box-shadow: var(--sh-md);}
    .disp-btn.d {background: linear-gradient(135deg, #ffd54f, #ffa726); color: #4e342e;}
    .disp-btn.n {background: linear-gradient(135deg, #3949ab, #1a237e); color: #fff;}
    .disp-btn.dn {background: linear-gradient(135deg, #ab47bc, #8e24aa); color: #fff;}
    .disp-btn.nd {background: var(--surface-2); color: var(--red); border-color: var(--red);}
    .disp-btn.active {border-color: var(--txt-1);}
    .disp-modal-footer {background: var(--surface-2); padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: center; flex-shrink: 0;}
    .disp-cancel {background: transparent; border: 1px solid var(--border); color: var(--txt-2); cursor: pointer; font-size: 13px; font-weight: 600; padding: 8px 22px; border-radius: 50px; transition: background var(--ease), color var(--ease);}
    .disp-cancel:hover {background: var(--red-light); color: var(--red); border-color: transparent;}
    /* ============================================================
    TOAST
    ============================================================ */
    .toast {position: fixed; bottom: calc(var(--footer-h) + 30px); left: 50%; transform: translateX(-50%) translateY(10px); background: linear-gradient(to right, var(--red-dark), var(--red));
            color: #fff; padding: 14px 22px; border-radius: var(--r-md); box-shadow: var(--sh-lg); font-size: 13.5px; font-weight: 600; width: 90%; max-width: 380px; text-align: center;
            z-index: 9999; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease;}
    .toast.show {opacity: 1; transform: translateX(-50%) translateY(0);}
    /* ============================================================
    FOOTER
    ============================================================ */
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 100;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    @keyframes slideDown {from {opacity: 0; transform: translateY(-10px);} to {opacity: 1; transform: translateY(0);}}
    /* ============================================================
    RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .header-title {font-size: 16px;}
      .availability-view-subtitle {font-size: 0.95em;}
      .availability-view-btn {min-height: 56px; font-size: 10.5px; padding: 10px 6px;}
      .availability-view-btn .material-icons {font-size: 19px;}
      .main-content {padding-left: 14px; padding-right: 14px; justify-content: center; align-items: center;}
    }
    @media (min-width: 769px) {
      .main-content {max-width: 700px; margin: 0 auto; width: 100%;}
    }
</style>
</head>
<body>
  <header class="header">
    <img id="corpLogo" class="header-logo" alt="" src="" style="display:none;" onload="this.style.display='block';">
    <div class="header-center">
      <span class="header-title">DISPONIBILIDADES</span>
      <span class="header-sub">Visualização Global</span>
    </div>
    <h2 id="corpInfo" style="display: none;"></h2>
  </header>
  <div class="main-content">
    <div class="availability-view-header">
      <p class="availability-view-subtitle">Selecione o mês:</p>
    </div>
    <div class="months-card">
      <div class="availability-view-buttons">
        <button class="availability-view-btn" onclick="showCalendar(0, this)"><span class="material-icons">ac_unit</span><div>Janeiro</div></button>
        <button class="availability-view-btn" onclick="showCalendar(1, this)"><span class="material-icons">favorite</span><div>Fevereiro</div></button>
        <button class="availability-view-btn" onclick="showCalendar(2, this)"><span class="material-icons">eco</span><div>Março</div></button>
        <button class="availability-view-btn" onclick="showCalendar(3, this)"><span class="material-icons">local_florist</span><div>Abril</div></button>
        <button class="availability-view-btn" onclick="showCalendar(4, this)"><span class="material-icons">wb_sunny</span><div>Maio</div></button>
        <button class="availability-view-btn" onclick="showCalendar(5, this)"><span class="material-icons">beach_access</span><div>Junho</div></button>
        <button class="availability-view-btn" onclick="showCalendar(6, this)"><span class="material-icons">local_fire_department</span><div>Julho</div></button>
        <button class="availability-view-btn" onclick="showCalendar(7, this)"><span class="material-icons">whatshot</span><div>Agosto</div></button>
        <button class="availability-view-btn" onclick="showCalendar(8, this)"><span class="material-icons">park</span><div>Setembro</div></button>
        <button class="availability-view-btn" onclick="showCalendar(9, this)"><span class="material-icons">cloud</span><div>Outubro</div></button>
        <button class="availability-view-btn" onclick="showCalendar(10, this)"><span class="material-icons">grain</span><div>Novembro</div></button>
        <button class="availability-view-btn" onclick="showCalendar(11, this)"><span class="material-icons">celebration</span><div>Dezembro</div></button>
      </div>
    </div>
    <div id="calendarContainer" class="calendar-container">
      <div class="calendar-header" id="calendarHeader"></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <div id="legend" class="calendar-legend">
    </div>
  </div>
  <footer class="footer">
    <div class="footer-content">
      <div class="powered-by">
        <strong>Powered by:</strong> Fábio Martins | Sistemas de Informação - Grupo CB360
      </div>
      <div class="footer-year">
        © 2023-2025 - Sistema CB360 Mobile
      </div>
    </div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('App pronta: ', reg.scope))
          .catch(err => console.log('Erro no motor da App: ', err));
      });
    }
  </script>
  <script>
    /* ===================== SUPABASE CONFIGURATION ====================== */
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';
    /* --- chave única e consistente em TODO o ficheiro para corp/nint --- */
    function getCorp() {return localStorage.getItem("currentCorpOperNr")}
    function getNInt() {return localStorage.getItem("currentCorpNint")}
    function getSupabaseHeaders(options = {}) {
      const corp  = getCorp();
      const nint  = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    /* ======================= CORPORATION LOADING ======================= */
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }
    /* ========================== THEME LOADING ========================== */
    function loadTheme() {
      const savedTheme = localStorage.getItem('sgo-theme');
      if (savedTheme === 'dark') document.body.classList.add('dark-mode');
    }
    /* ============================== TOAST ============================== */
    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.classList.add("show"), 50);
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }
    /* ======================== CALENDAR DISPLAY ========================= */
    let currentMonthIndex = null;
    let selectedDaysMap = {};
    const TYPE_CLASS_MAP = {'PN': 'type-pn', 'ED': 'type-ed', 'EN': 'type-en', 'ET': 'type-et', 'EP': 'type-ep', 'EX': 'type-ex'};
    const TYPE_LABEL_MAP = {'PN': 'PIQUETE', 'ED': 'ECIN Dia', 'EN': 'ECIN Noite', 'ET': 'ECIN 24h', 'EP': 'ECIN/Piquete', 'EX': 'EXTRA'};
    async function loadSelectedDaysFromSupabase(monthIndex) {
      const nint = localStorage.getItem("currentCorpNint");
      const corp = localStorage.getItem("currentCorpOperNr");
      if (!nint || !corp) return {};
      const today = new Date();
      const currentYear = today.getFullYear();
      const currentMonth = today.getMonth();
      const currentDay = today.getDate();
      let year = currentYear;
      if (currentMonth === 11 && monthIndex === 0 && currentDay >= 15) {
        year = currentYear + 1;
      }
      const month = monthIndex + 1;
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/reg_disp?select=day,value&n_int=eq.${parseInt(nint,10)}&corp_oper_nr=eq.${corp.padStart(4,"0")}&year=eq.${year}&month=eq.${month}`, {
            headers: getSupabaseHeaders()
          }
        );
        if (!res.ok) return {};
        const data = await res.json();
        const daysMap = {};
        data.forEach(d => {
          if (!daysMap[d.day]) {
            daysMap[d.day] = [];
          }
          daysMap[d.day].push(d.value);
        });
        return daysMap;
      } catch (e) {
        console.error("Erro loadSelectedDays:", e);
        return {};
      }
    }
    function getDayType(values) {
      if (!values || values.length === 0) return null;
      const hasPN = values.includes('PN');
      const hasECIN = values.some(v => ['ED', 'EN', 'ET'].includes(v));
      const hasEX = values.includes('EX');
      if (hasPN && hasECIN) return 'EP';
      if (hasECIN) {
        if (values.includes('ET')) return 'ET';
        if (values.includes('EN')) return 'EN';
        if (values.includes('ED')) return 'ED';
      }
      if (hasPN) return 'PN';
      if (hasEX) return 'EX';
      return null;
    }
    let isLoadingCalendar = false;
    async function showCalendar(monthIndex, button) {
      if (isLoadingCalendar) return;
      isLoadingCalendar = true;
      if (currentMonthIndex === monthIndex && button.classList.contains('selected')) {
        button.classList.remove('selected');
        document.body.classList.remove('mobile-month-active');
        document.getElementById('calendarContainer').classList.remove('show');
        document.getElementById('legend').classList.remove('show');
        currentMonthIndex = null;
        isLoadingCalendar = false;
        return;
      }
      currentMonthIndex = monthIndex;
      document.querySelectorAll('.availability-view-btn').forEach(b => b.classList.remove('selected'));
      button.classList.add('selected');
      document.body.classList.add('mobile-month-active');
      const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      const today = new Date();
      const currentDay = today.getDate();
      const currentMonth = today.getMonth();
      const currentYear = today.getFullYear();
      let headerYear = currentYear;
      if (currentMonth === 11 && monthIndex === 0 && currentDay >= 15) {
        headerYear = currentYear + 1;
      }
      const firstDay = new Date(headerYear, monthIndex, 1);
      const lastDay = new Date(headerYear, monthIndex + 1, 0);
      const calendarHeader = document.getElementById('calendarHeader');
      const calendarGrid = document.getElementById('calendarGrid');
      const calendarContainer = document.getElementById('calendarContainer');
      calendarHeader.textContent = `${monthNames[monthIndex]} ${headerYear}`;
      calendarGrid.innerHTML = '';
      dayNames.forEach(d => {
        const el = document.createElement('div');
        el.className = 'calendar-day-header';
        el.textContent = d;
        calendarGrid.appendChild(el);
      });
      for (let i = 0; i < firstDay.getDay(); i++) {
        calendarGrid.appendChild(Object.assign(document.createElement('div'), {
          className: 'calendar-day empty'
        }));
      }
      selectedDaysMap = await loadSelectedDaysFromSupabase(monthIndex);
      for (let day = 1; day <= lastDay.getDate(); day++) {
        const el = document.createElement('div');
        el.className = 'calendar-day';
        el.textContent = day;
        const dayValues = selectedDaysMap[day];
        const dayType = getDayType(dayValues);
        if (dayType && TYPE_CLASS_MAP[dayType]) {
          el.classList.add(TYPE_CLASS_MAP[dayType]);
          el.dataset.type = dayType;
          el.dataset.values = dayValues ? dayValues.join(',') : '';
        }
        if (headerYear === currentYear && monthIndex === currentMonth && day === currentDay) {
          el.classList.add('today');
        }
        el.addEventListener('click', () => {
          if (dayType) {
            let message = `${TYPE_LABEL_MAP[dayType]} - Dia ${day}`;
            if (dayValues && dayValues.length > 1) {
              message += ` (${dayValues.join(' + ')})`;
            }
            showToast(message);
          } else {
            showToast("Sem disponibilidade registada.");
          }
        });
        calendarGrid.appendChild(el);
      }
      calendarContainer.classList.add('show');
      updateLegend();
      isLoadingCalendar = false;
    }
    function updateLegend() {
      const legendContainer = document.getElementById('legend');
      if (!legendContainer) return;
      legendContainer.innerHTML = '';
      const month = currentMonthIndex;
      let typeOrder = (month >= 4 && month <= 9) 
      ? ['PN', 'EX', 'ED', 'EN', 'ET', 'EP'] 
      : ['PN', 'EX'];
      typeOrder.forEach((type) => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        const colorBox = document.createElement('span');
        colorBox.className = `legend-color ${TYPE_CLASS_MAP[type]}`;
        const label = document.createElement('span');
        label.className = 'legend-label';
        label.textContent = TYPE_LABEL_MAP[type];
        item.appendChild(colorBox);
        item.appendChild(label);
        legendContainer.appendChild(item);
      });
      legendContainer.classList.toggle('show', typeOrder.length > 0);
    }
    /* ========================= GLOBAL LOADING ========================== */
    const buttons = document.querySelectorAll('.availability-view-btn');
    buttons.forEach((button, index) => {
      button.style.opacity = '0';
      button.style.transform = 'translateY(20px)';
      setTimeout(() => {
        button.style.transition = 'all 0.5s ease';
        button.style.opacity = '1';
        button.style.transform = 'translateY(0)';
      }, index * 100);
    });
    document.addEventListener('DOMContentLoaded', () => {
      loadCorpInfo();
      loadTheme();
    });
  </script>
</body>
</html>
