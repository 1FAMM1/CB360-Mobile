<!DOCTYPE html>
<html lang="pt-PT" style="background-color: #d32f2f;">
<head>
  <script>
    (function() {
      try {
        if (localStorage.getItem('sgo-theme') === 'dark') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">  
  <meta name="apple-mobile-web-app-title" content="CB360 Mobile">
  <meta name="theme-color" content="#d32f2f">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>CB360 Mobile - Disponibilidades</title>
  <style>
    @view-transition {navigation: auto;}
    /* ============================================================
    VARIABLES
    ============================================================ */
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
           --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
           --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
           --header-h: 60px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --blue: #0282fa;}
    ::view-transition-old(root), ::view-transition-new(root) {animation-duration: 0.5s;}
    .header, .footer {view-transition-name: none;}
    /* ============================================================
    DARK MODE
    ============================================================ */
    .dark-mode {--bg: #141312; --surface: #1f1e1c; --surface-2: #2a2826; --border: rgba(255, 255, 255, 0.07); --txt-1: #f0ede8; --txt-2: #a09890; --txt-3: #5a5450;
                --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14); --blue: #6cb8ff;}
    /* ============================================================
    RESET & BASE
    ============================================================ */
    html {scrollbar-width: none; background: var(--red-dark);}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
          user-select: none; transition: background var(--ease), color var(--ease);}
    /* ============================================================
    HEADER
    ============================================================ */
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}
    .header-center {display: flex; flex-direction: column; align-items: center; gap: 1px;}
    .header-title {font-size: 19px; font-weight: 700; letter-spacing: 1.5px; color: #fff;}
    .header-sub {font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.75); text-transform: uppercase;}
    /* ============================================================
    MAIN CONTENT
    ============================================================ */
    .main-content {flex:1; width:100%; max-width:700px; margin:0 auto; overflow-y:auto; overflow-x:hidden; padding:calc(var(--header-h) + 10px) 16px 110px; display:flex; flex-direction:column;
               align-items:center; justify-content:flex-start; background:var(--bg); scrollbar-width:none; transition:background var(--ease);}
    .main-content::-webkit-scrollbar {display:none;}
    /* ============================================================
    AVAILABILITY CARDS
    ============================================================ */
    .availability-buttons {width:100%; max-width:100%; margin:auto 4px; display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--border); border:1px solid var(--border);
                           border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--sh-md);}
    .availability-btn {position:relative; min-width:0; max-width:none; min-height:120px; padding:16px 10px; border:0; border-radius:0; background:var(--surface); color:var(--txt-2); font-family:'Inter',sans-serif;
                       font-size:13px; font-weight:600; cursor:pointer; text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:8px; line-height:1.2;
                       box-shadow:none; transition:background var(--ease),color var(--ease),transform var(--ease);}
    .availability-btn:hover {background:var(--surface-2); color:var(--txt-1);}
    .availability-btn:active {background:var(--surface-2); transform:scale(.98);}
    .availability-btn.selected {background:var(--red-light); color:var(--red);}
    .availability-btn .material-icons {font-size:28px; color:var(--red-icon); transition:transform var(--ease),color var(--ease);}
    .availability-btn:hover .material-icons,
    .availability-btn.selected .material-icons {transform:scale(1.08);}
    .availability-btn:hover {background:var(--surface-2); color:var(--txt-1);}
    .availability-btn:active {background:var(--surface-2); transform:scale(.98);}
    .availability-btn:disabled {opacity: 0.3; cursor: not-allowed; pointer-events: none; filter: alpha(opacity=30);}
    .availability-btn:disabled *, .availability-btn:disabled .material-icons {opacity: 0.3 !important;}
    /* ============================================================
    FOOTER
    ============================================================ */
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 100;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    .footer strong { color:inherit; }
    /* ============================================================
    RESPONSIVE
    ============================================================ */
    @media (max-width:480px) {
      .header-title {font-size: 16px;}
      .main-content {padding-left: 14px; padding-right: 14px;}
      .availability-btn {min-height:104px; font-size:11.5px; padding:12px 8px;}
      .availability-btn .material-icons {font-size:25px;}
      .footer {height:var(--footer-h);}
    }
    @media (min-width:769px) {
      .main-content { max-width:700px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <img id="corpLogo" class="header-logo" alt="" style="display:none;"
         onerror="console.error('❌ Logo: falha ao carregar imagem, URL:', this.src); this.style.display='none';"
         onload="this.style.display='block';">
    <div class="header-center">
      <span class="header-title">DISPONIBILIDADES</span>
      <span class="header-sub">Piquetes · Decir · Extras · SBA · OPAT</span>
    </div>
    <h2 id="corpInfo" style="display: none;"></h2>
  </header>
  <div class="main-content">
    <div class="availability-buttons">
      <button class="availability-btn" onclick="toggleButton(this); setTimeout(() => window.location.href='PiqDisp.html', 300);">
        <span class="material-icons">local_fire_department</span>
        <span>Piquetes</span>
      </button>
      <button class="availability-btn" onclick="toggleButton(this); setTimeout(() => window.location.href='DecDisp.html', 300);">
        <span class="material-icons">whatshot</span>
        <span>DECIR</span>
      </button>
      <button class="availability-btn" onclick="toggleButton(this); setTimeout(() => window.location.href='SBADisp.html', 300);">
        <span class="material-icons">flight</span>
        <span>SBAS</span>
      </button>
      <button class="availability-btn" onclick="toggleButton(this); setTimeout(() => window.location.href='OPATDisp.html', 300);">
        <span class="material-icons">cell_tower</span>
        <span>OPATS</span>
      </button>
      <button class="availability-btn" onclick="toggleButton(this); setTimeout(() => window.location.href='ExtDisp.html', 300);">
        <span class="material-icons">emergency</span>
        <span>Extras</span>
      </button>
      <button class="availability-btn" onclick="toggleButton(this); setTimeout(() => window.location.href='DispView.html', 300);">
        <span class="material-icons">visibility</span>
        <span>Visualizar Disponibilidades</span>
      </button>
    </div>
  </div>
  <footer class="footer">
    <div class="footer-content">
      <div class="powered-by">
        Powered by Fábio Martins · Sistemas de Informação · Grupo CB360
      </div>
      <div class="footer-year">
        © 2023–2025 · Sistema CB360 Mobile
      </div>
    </div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('App pronta: ', reg.scope))
          .catch(err => console.log('Erro no motor da App: ', err));
      });
    }
  </script>
  <script>
    /* ===================== SUPABASE CONFIGURATION ====================== */
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';
    function getCorp() {return localStorage.getItem("currentCorpOperNr");}
    function getNInt() {return localStorage.getItem("currentCorpNint");}
    function getSupabaseHeaders(options = {}) {
      const corp = getCorp();
      const nint = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }    
    function toggleButton(button) {
      document.querySelectorAll('.availability-btn').forEach(btn => {
        if (btn !== button) btn.classList.remove('selected');
      });
      button.classList.add('selected');
      if (navigator.vibrate) navigator.vibrate(100);
      setTimeout(() => {
        button.classList.remove('selected');
      }, 2000);
    }
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('sgo-theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      }    
      loadCorpInfo();     
      document.querySelectorAll('.availability-btn').forEach((btn, i) => {
        btn.style.opacity = '0';
        btn.style.transform = 'translateY(15px)';
        btn.style.transition = 'all 0.4s ease';
        setTimeout(() => {
          btn.style.opacity = '1';
          btn.style.transform = 'translateY(0)';
        }, i * 80);
      });
      document.addEventListener('touchstart', (event) => {
        if (event.touches.length > 1) event.preventDefault();
      }, { passive: false });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (event) => {
        const now = new Date().getTime();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, false);
    });
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());    
  </script>
</body>
</html>
