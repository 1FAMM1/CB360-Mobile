<!DOCTYPE html>
<html lang="pt-PT"  style="background-color: #d32f2f;">
<head>
  <script>
    (function() {
      try {
        if (localStorage.getItem('sgo-theme') === 'dark') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CB360 Mobile">
  <meta name="theme-color" content="#d32f2f">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>CB360 Mobile - Os Meus Relatórios</title>
  <style>
    @view-transition {navigation: auto;}
    /* ============================================================
    VARIABLES
    ============================================================ */
    :root {--red: #c62828; --red-dark: #8b0000; --red-light: rgba(198, 40, 40, 0.10); --red-icon: #c62828; --bg: #f4f3f1; --surface: #dddddd; --surface-2: #edecea;
           --border: rgba(0, 0, 0, 0.07); --txt-1: #1c1b1a; --txt-2: #5c5651; --txt-3: #9a928c; --sh-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
           --sh-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04); --sh-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05);
           --header-h: 60px; --footer-h: 50px; --r-sm: 12px; --r-md: 15px; --r-lg: 20px; --ease: 0.2s cubic-bezier(0.4, 0, 0.2, 1); --blue: #0282fa;
           --green: #2e7d32; --green-state: #2e7d32; --red-state: #c62828; --amber: #b8860b;}
    ::view-transition-old(root), ::view-transition-new(root) {animation-duration: 0.5s;}
    .header, .footer {view-transition-name: none;}
    /* ============================================================
    DARK MODE
    ============================================================ */
    .dark-mode {--bg: #141312; --surface: #1f1e1c; --surface-2: #2a2826; --border: rgba(255, 255, 255, 0.07); --txt-1: #f0ede8; --txt-2: #a09890; --txt-3: #5a5450;
                --sh-sm: 0 1px 3px rgba(0,0,0,0.30); --sh-md: 0 4px 12px rgba(0,0,0,0.40); --sh-lg: 0 8px 24px rgba(0,0,0,0.50); --red-light: rgba(198, 40, 40, 0.14); --blue: #6cb8ff;
                --green: #66bb6a; --green-state: #66bb6a; --red-state: #ff6b6b; --amber: #e0b34d;}
    /* ============================================================
    RESET & BASE
    ============================================================ */
    html {scrollbar-width: none; background: var(--red-dark);}
    html, body {overscroll-behavior: none;}
    * {margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
    body {font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--txt-1); height: 100dvh; overflow: hidden; display: flex;
          flex-direction: column; user-select: none; transition: background var(--ease), color var(--ease); padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);}
    /* ============================================================
    HEADER
    ============================================================ */
    .header {position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.20);}
    .header-logo {position: absolute; left: 14px; height: 50px; border-radius: 6px;}
    .header-center {display: flex; flex-direction: column; align-items: center; gap: 1px;}
    .header-title {display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; letter-spacing: 1.5px; color: #fff;}
    .header-title .material-icons {font-size: 1.1em;}
    .header-sub {font-size: 10px; font-weight: 500; letter-spacing: 1.5px; color: rgba(255,255,255,0.75); text-transform: uppercase;}
    /* ============================================================
    MAIN CONTENT
    ============================================================ */
    .main-content {flex: 1; width: 100%; max-width: 700px; margin: 0 auto; overflow: hidden; padding: calc(var(--header-h) + 14px) 16px calc(var(--footer-h) + 20px);
                   display: flex; flex-direction: column; gap: 14px; background: var(--bg); transition: background var(--ease);}
    /* ============================================================
    CARDS / SURFACES
    ============================================================ */
    .report-stats-container, .report-list-container {background: var(--surface); padding: 16px; border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-md);
                                                      transition: background var(--ease), box-shadow var(--ease), border-color var(--ease); animation: fadeIn 0.4s ease-out;}
    .report-stats-container h1, .report-list-container h1 {text-align: center; font-size: clamp(0.85em, 4vw, 1em); font-weight: 700; letter-spacing: 0.5px; color: var(--txt-1); position: relative;}
    .report-stats-container h1::after, .report-list-container h1::after {content: ""; display: block; height: 1px; background: var(--border); margin: 14px auto; width: 90%;}
    .title-row {display: inline-flex; align-items: center; gap: 8px;}
    .title-row .material-icons {font-size: 1.15em; color: var(--red-icon);}
    .stats-badge {border-radius: 50px; padding: 6px 15px; margin: 0 auto; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: var(--sh-sm); font-weight: 700;
                  font-size: clamp(0.85em, 2.5vw, 1em); max-width: fit-content; color: #fff; transition: background var(--ease);}
    .stats-badge .material-icons {font-size: 1.05em;}
    .stats-badge.has-reports {background: linear-gradient(to right, var(--red-dark), var(--red));}
    .stats-badge.no-reports {background: linear-gradient(to right, #1b5e20, var(--green));}
    .report-list-container {margin: 0; display: flex; flex-direction: column; max-height: calc(100vh - 340px); min-height: 100px; overflow: hidden;}
    .cards-container {display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-top: 12px; overflow-y: auto; flex: 1; padding-right: 4px; padding-bottom: 6px;
                      scrollbar-width: thin; scrollbar-color: var(--red) transparent;}
    .cards-container::-webkit-scrollbar {width: 4px;}
    .cards-container::-webkit-scrollbar-track {background: transparent;}
    .cards-container::-webkit-scrollbar-thumb {background: linear-gradient(to bottom, var(--red), var(--red-dark)); border-radius: 10px;}
    .message {text-align: center; font-weight: 700; padding: clamp(8px, 2vw, 10px) clamp(10px, 3vw, 15px); border-radius: var(--r-sm); font-size: clamp(0.85em, 2.5vw, 1em);
              box-shadow: var(--sh-sm); animation: fadeIn 0.4s ease-out;}
    .message.loading {background: var(--blue); color: #fff;}
    .message.error {background: var(--red); color: #fff;}
    .no-reports {display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; font-weight: 700; padding: 12px 15px; border-radius: var(--r-sm); background: var(--green);
                 font-size: 1em; box-shadow: var(--sh-sm); animation: fadeIn 0.4s ease-out; color: #fff;}
    /* ============================================================
    REPORT CARD
    ============================================================ */
    .report-card {background: var(--surface-2); border-radius: var(--r-md); padding: 0; box-shadow: var(--sh-sm); border: 1px solid var(--border); cursor: pointer;
                  transition: transform var(--ease), box-shadow var(--ease), background var(--ease); position: relative; display: flex; flex-direction: column; overflow: hidden;}
    .report-card:hover {transform: translateY(-1px); box-shadow: var(--sh-md);}
    .report-card:active {transform: scale(.99);}
    .card-top {padding: 8px 14px; background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; justify-content: space-between; align-items: center; gap: 8px;}
    .report-nr {font-family: 'Monaco', monospace; font-weight: 800; color: #fff; font-size: 0.85em;}
    .report-date {font-size: 0.72em; color: rgba(255,255,255,0.85); display: flex; align-items: center; gap: 4px; font-weight: 600;}
    .status-row {display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;}
    .badge-pending {display: inline-flex; align-items: center; gap: 4px; background: rgba(184, 134, 11, 0.14); color: var(--amber); padding: 4px 10px; border-radius: 9999px; font-size: 0.66rem;
                    font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;}
    .badge-pending .material-icons {font-size: 13px;}
    .open-platform {display: inline-flex; align-items: center; gap: 4px; font-size: 0.76rem; font-weight: 700; color: var(--red-icon);}
    @keyframes fadeIn {from {opacity: 0;} to {opacity: 1;}}
    /* ============================================================
    FOOTER
    ============================================================ */
    .footer {position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: linear-gradient(to right, var(--red-dark), var(--red)); display: flex; align-items: center;
             justify-content: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.18); z-index: 1000;}
    .footer-content {text-align: center;}
    .powered-by {font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85);}
    .footer-year {font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 1px;}
    .footer strong {color: inherit;}
    /* ============================================================
    RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .header-title {font-size: 16px;}
      .main-content {padding-left: 12px; padding-right: 12px;}
      .cards-container {grid-template-columns: 1fr;}
    }
    @media (min-width: 769px) {
      .main-content {max-width: 700px;}
    }
  </style>
</head>
<body>
  <header class="header">
    <img id="corpLogo" class="header-logo" alt="" src="">
    <div class="header-center">
      <span class="header-title">OS MEUS RELATÓRIOS</span>
      <span class="header-sub">Controlo de Pendentes</span>
    </div>
    <h2 id="corpInfo" style="display: none;"></h2>
  </header>
  <div class="main-content">
    <div class="report-stats-container">
      <h1><span class="title-row"><span class="material-icons">assessment</span>Resumo de Pendentes</span></h1>
      <div id="statsBadge" class="stats-badge" style="display: flex;">
        <span class="material-icons">assignment_late</span>
        <span><span id="totalPendingReports">0</span> Relatórios Pendentes</span>
      </div>
    </div>
    <div class="report-list-container">
      <h1><span class="title-row"><span class="material-icons">list_alt</span>Lista de Relatórios</span></h1>
      <div id="reportsCardsContainer" class="cards-container"></div>
      <div id="noReportsMessage" class="no-reports" style="display: none;">
        <span class="material-icons">check_circle</span> NÃO TEM RELATÓRIOS PENDENTES
      </div>
    </div>
  </div>
  <footer class="footer">
    <div class="footer-content">
      <div class="powered-by">
        Powered by Fábio Martins · Sistemas de Informação · Grupo CB360
      </div>
      <div class="footer-year">
        © 2023–2025 · Sistema CB360 Mobile
      </div>
    </div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('App pronta: ', reg.scope))
          .catch(err => console.log('Erro no motor da App: ', err));
      });
    }
  </script>
  <script>
    /* ===================== SUPABASE CONFIGURATION ====================== */
    const SUPABASE_URL = 'https://rjkbodfqsvckvnhjwmhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa2JvZGZxc3Zja3ZuaGp3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxNjM3NjQsImV4cCI6MjA2MzczOTc2NH0.jX5OPZkz1JSSwrahCoFzqGYw8tYkgE8isbn12uP43-0';
    function getCorp() {return localStorage.getItem("currentCorpOperNr");}
    function getNInt() {return localStorage.getItem("currentCorpNint");}
    function getSupabaseHeaders(options = {}) {
      const corp = getCorp();
      const nint = getNInt();
      const token = localStorage.getItem("authToken");
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'x-my-corpo': corp,
        'x-my-nint': nint,
      };
      if (options.returnRepresentation) {
        headers['Prefer'] = 'return=representation';
      }
      return headers;
    }
    /* ======================= CORPORATION LOADING ======================= */
    async function loadCorpInfo() {
      const corpOperNr = localStorage.getItem("currentCorpOperNr");
      const h2 = document.getElementById("corpInfo");
      const logoEl = document.getElementById("corpLogo");
      if (!corpOperNr) return;
      const cachedLogo = localStorage.getItem("cached_logo_url");
      if (cachedLogo && logoEl) {
        logoEl.src = cachedLogo;
      }
      if (h2) h2.textContent = corpOperNr;
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/corporation_data?select=corporation,corp_oper_nr,logo_url&corp_oper_nr=eq.${corpOperNr}`, {
            headers: getSupabaseHeaders()
          }
        );
        const data = await response.json();
        if (data && data.length > 0) {
          const corp = data[0];
          if (corp.logo_url && corp.logo_url !== cachedLogo) {
            localStorage.setItem("cached_logo_url", corp.logo_url.trim());
            if (logoEl) logoEl.src = corp.logo_url.trim();
          }
        }
      } catch (err) {
        console.error('Erro silencioso:', err);
      }
    }
    /* ========================= REPORTS LOADING ========================= */
    async function loadUserReports() {
      const corpNr = localStorage.getItem('currentCorpOperNr');
      const nInt = localStorage.getItem('currentCorpNint');
      const container = document.getElementById('reportsCardsContainer');
      const counter = document.getElementById('totalPendingReports');
      const noReportsMsg = document.getElementById('noReportsMessage');
      const statsBadge = document.getElementById('statsBadge');
      container.innerHTML = '<div class="message loading">A atualizar lista...</div>';
      try {
        const url = `${SUPABASE_URL}/rest/v1/reports_control?select=report_nr,report_date,report_state&corp_oper_nr=eq.${corpNr}&n_int=eq.${nInt}&report_state=eq.false&order=report_date.desc`;
        const response = await fetch(url, {
          headers: getSupabaseHeaders()
        });
        const data = await response.json();
        if (!Array.isArray(data)) {
          container.innerHTML = `<div class="message error">Erro de Colunas: ${data.message}</div>`;
          return;
        }
        counter.textContent = data.length;
        statsBadge.classList.remove('has-reports', 'no-reports');
        if (data.length > 0) {
          statsBadge.classList.add('has-reports');
        } else {
          statsBadge.classList.add('no-reports');
        }
        if (data.length === 0) {
          noReportsMsg.style.display = 'flex';
          container.innerHTML = '';
          return;
        }
        noReportsMsg.style.display = 'none';
        container.innerHTML = data.map(report => {
          let formattedDate = 'Data n/a';
          if (report.report_date) {
            const d = new Date(report.report_date);
            if (!isNaN(d)) {
              const day = String(d.getDate()).padStart(2, '0');
              const month = String(d.getMonth() + 1).padStart(2, '0');
              const year = d.getFullYear();
              formattedDate = `${day}/${month}/${year}`;
            }
          }
          return `
            <div class="report-card" onclick="openGescorp()">
              <div class="card-top">
                <span class="report-nr">OCORRÊNCIA: ${report.report_nr || '---'}</span>
                <span class="report-date"><span class="material-icons" style="font-size:13px;">event</span>${formattedDate}</span>
              </div>
              <div class="status-row">
                <span class="badge-pending"><span class="material-icons">warning</span>Aguarda GESCORP</span>
                <span class="open-platform">Abrir Plataforma<span class="material-icons" style="font-size:15px;">arrow_forward</span></span>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<div class="message error">Erro de ligação ao servidor.</div>';
      }
    }
    /* ========================== GO TO GESCORP ========================== */
    function openGescorp() {
      window.open('https://mobile.gescorp.pt/', '_blank');
    }
    /* ========================= INITIALIZATION ========================== */
    document.addEventListener('DOMContentLoaded', async () => {
      if (localStorage.getItem('sgo-theme') === 'dark') document.body.classList.add('dark-mode');
      loadCorpInfo();
      loadUserReports();
    });
  </script>
  <script src="nav-lock.js"></script>
</body>
</html>
